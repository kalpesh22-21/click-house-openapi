{{- /*
Validate that secrets are provided: either via existingSecret or inline values.
Abort the installation early with a clear error rather than deploying with
empty / default credentials.
*/ -}}
{{- if not .Values.secrets.existingSecret.name -}}
{{- if or (not .Values.secrets.clickhousePassword) (not .Values.secrets.apiKey) -}}
{{- fail "secrets.clickhousePassword and secrets.apiKey must be set (or use secrets.existingSecret). Do not deploy with empty credentials." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.connection }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
{{- end }}
