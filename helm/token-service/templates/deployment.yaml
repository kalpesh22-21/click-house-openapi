apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "token-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "token-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "token-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "token-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: token-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.APP_PORT | default "8000" | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "token-service.fullname" . }}
          env:
            - name: MODE
              value: "token"
            # Private signing key is mounted as a file (multi-line PEM).
            - name: TOKEN_SIGNING_KEY_FILE
              value: /etc/token-service/signing-key.pem
            - name: TOKEN_ISSUER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "token-service.secretName" . }}
                  key: TOKEN_ISSUER_API_KEY
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: signing-key
              mountPath: /etc/token-service
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: signing-key
          secret:
            secretName: {{ include "token-service.secretName" . }}
            items:
              - key: signing-key.pem
                path: signing-key.pem
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
