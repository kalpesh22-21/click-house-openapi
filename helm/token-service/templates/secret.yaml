{{- /*
Create the Secret holding the RSA signing key and the issuer API key — unless a
pre-existing Secret is referenced. Fail closed (abort install) when required
values are missing and dev mode is off, rather than deploying an issuer that
cannot sign or whose /token endpoint is open.
*/ -}}
{{- if not .Values.secrets.existingSecret.name -}}
{{- $devMode := eq (.Values.config.TOKEN_DEV_MODE | toString) "true" -}}
{{- if not $devMode -}}
{{- if not .Values.secrets.signingKey -}}
{{- fail "secrets.signingKey must be set (PEM RSA private key) — e.g. --set-file secrets.signingKey=signing-key.pem. Or use secrets.existingSecret, or config.TOKEN_DEV_MODE=true for local dev only." -}}
{{- end -}}
{{- if not .Values.secrets.issuerApiKey -}}
{{- fail "secrets.issuerApiKey must be set to protect POST /token — e.g. --set secrets.issuerApiKey=$(openssl rand -hex 32). Or config.TOKEN_DEV_MODE=true for local dev only." -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "token-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "token-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  signing-key.pem: |-
{{ .Values.secrets.signingKey | default "" | indent 4 }}
  TOKEN_ISSUER_API_KEY: {{ .Values.secrets.issuerApiKey | default "" | quote }}
{{- end }}
