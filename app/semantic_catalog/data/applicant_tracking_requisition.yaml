database: dbpcm_warehouse
table: applicant_tracking_requisition
description: Applicant Tracking requisition table. One row per job requisition; use for job opening metadata, requisition status, posting windows, open positions, hires, recruiter, and hiring-manager context.

grain: [ requisition_id ]

temporal:
  dimensions:
    - { name: posting_period, role: period, range: { start_col: requisition_posting_start_date, end_col: requisition_posting_end_date } }
    - { name: filled_event, role: event, date_col: requisition_posting_filled_date }
  default_pin: posting_period

primary_key: [ requisition_id ]

# DATA LIMITATION: no foreign key links requisitions to applications, hires, or employees — there is
# no requisition_id on applicant_tracking_application. So application→requisition funnel analysis (apps
# per req, fill rate, time-to-fill spanning posting→hire) is NOT possible without an external mapping.
# requisition_number_of_hires is the only in-table hire signal. See the application_link ambiguity below.
join_keys: []

columns:
  client_code: { type: Nullable(String), description: Client/company code. }
  requisition_id: { type: Int32, description: Unique requisition identifier. }
  requisition_status_enum:
    type: Nullable(String)
    observed_values: [ Posted, Denied, Draft, Filled, Closed ]
    description: Current requisition workflow/status.
  requisition_position_title: { type: Nullable(String), client_defined: true, description: Internal position title (CLIENT-DEFINED; resolve via resolveValues(requisition_position_title, <concept>)). }
  requisition_position_code: { type: Nullable(String), description: Position code. }
  requisition_position_seat_codes: { type: Nullable(String), description: Position seat codes associated with the requisition. }
  requisition_position_seat_titles: { type: Nullable(String), description: Position seat titles associated with the requisition. }
  requisition_job_title: { type: Nullable(String), client_defined: true, description: Job title (CLIENT-DEFINED; resolve via resolveValues(requisition_job_title, <concept>)). }
  requisition_published_job_title: { type: Nullable(String), client_defined: true, description: Published job title shown externally (CLIENT-DEFINED; resolve via resolveValues(requisition_published_job_title, <concept>)). }
  requisition_position_type:
    type: Nullable(String)
    observed_values: [ Contractor, Full Time, Internship ]
    description: Position type for the requisition.
  requisition_posting_start_date: { type: Nullable(DateTime64(6)), description: Posting start date. }
  requisition_posting_end_date: { type: Nullable(DateTime64(6)), description: Posting end date. }
  requisition_posting_filled_date: { type: Nullable(DateTime64(6)), description: Date/time requisition was filled. }
  requisition_position_level_enum:
    type: Nullable(String)
    observed_values: [ Entry, Experienced, Management, Senior ]
    description: Position level.
  requisition_department_code: { type: Nullable(String), client_defined: true, description_col: requisition_department_description, description: Department code for the requisition (CLIENT-DEFINED; resolve via resolveValues(requisition_department_code, <concept>)). }
  requisition_department_description: { type: Nullable(String), client_defined: true, description: Department description for the requisition (CLIENT-DEFINED; resolve via resolveValues(requisition_department_description, <concept>)). }
  requisition_open_positions: { type: Nullable(String), description: "Remaining open positions; stored as String. Cast with toInt32OrNull(requisition_open_positions) before numeric use — nulls non-numeric values rather than erroring." }
  requisition_number_of_hires: { type: Nullable(Int32), description: Number of hires recorded against the requisition. }
  requisition_location: { type: Nullable(String), client_defined: true, description: Requisition location (CLIENT-DEFINED; resolve via resolveValues(requisition_location, <concept>)). }
  request_type_enum:
    type: Nullable(String)
    observed_values: [ Seasonal, Replacement, Additional, Evergreen ]
    description: Type of requisition request.
  request_reason: { type: Nullable(String), description: Reason for the requisition request. }
  primary_recruiter: { type: Nullable(String), description: Primary recruiter assigned to the requisition. }
  hiring_manager_username: { type: Nullable(String), description: Hiring manager username. }

measures:
  requisition_count: { column: requisition_id, agg: count_distinct, defined_over: "requisitions after temporal and status filters" }
  requisition_hires: { column: requisition_number_of_hires, agg: sum, defined_over: "requisitions after temporal and status filters" }

rules:
  - { id: posted_requisitions, predicate: "requisition_status_enum = 'Posted'", applies_when: open/posted requisition analysis, description: Restrict to posted requisitions. }
  - { id: filled_requisitions, predicate: "requisition_status_enum = 'Filled'", applies_when: filled requisition analysis, description: Restrict to filled requisitions. }
  - { id: closed_requisitions, predicate: "requisition_status_enum = 'Closed'", applies_when: closed requisition analysis, description: Restrict to closed requisitions. }
  - { id: draft_requisitions, predicate: "requisition_status_enum = 'Draft'", applies_when: draft requisition analysis, description: Restrict to draft requisitions. }
  - { id: denied_requisitions, predicate: "requisition_status_enum = 'Denied'", applies_when: denied requisition analysis, description: Restrict to denied requisitions. }
  - { id: active_postings, predicate: "requisition_status_enum = 'Posted' AND (requisition_posting_end_date IS NULL OR requisition_posting_end_date >= now64(6))", applies_when: currently active posting analysis, description: Restrict to posted requisitions whose posting end date has not passed. }
  - { id: requisitions_with_hires, predicate: "requisition_number_of_hires > 0", applies_when: requisitions with recorded hires, description: Restrict to requisitions with at least one hire. }
  - { id: full_time_requisitions, predicate: "requisition_position_type = 'Full Time'", applies_when: full-time requisition analysis, description: Restrict to full-time requisitions. }
  - { id: contractor_requisitions, predicate: "requisition_position_type = 'Contractor'", applies_when: contractor requisition analysis, description: Restrict to contractor requisitions. }
  - { id: internship_requisitions, predicate: "requisition_position_type = 'Internship'", applies_when: internship requisition analysis, description: Restrict to internship requisitions. }

ambiguities:
  - { term: open_requisition, resolves_to: [ "requisition_status_enum = 'Posted'" ], default: posted_requisitions, clarify_if: user means active by posting date, open positions > 0, or not filled/closed }
  - { term: active_posting, resolves_to: [ "requisition_status_enum = 'Posted' and posting end date has not passed" ], default: active_postings, clarify_if: user only means status Posted }
  - { term: job_title, resolves_to: [ requisition_published_job_title, requisition_job_title, requisition_position_title ], default: requisition_published_job_title, clarify_if: user wants internal title or position title }
  - { term: open_positions, resolves_to: [ "cast requisition_open_positions before numeric use" ], default: requisition_open_positions_string_cast, clarify_if: field contains non-numeric values or user needs exact requisition capacity logic }
  - { term: hires, resolves_to: [ requisition_number_of_hires ], default: requisition_hires, clarify_if: user wants hired applications from the application table }
  - { term: application_link, resolves_to: [ "no requisition_id is exposed on applicant_tracking_application; requisitions cannot be joined to applications/hires without an external mapping" ], default: unavailable_without_mapping, clarify_if: user asks for applications per requisition, requisition fill rate, or time-to-fill spanning the application table }

