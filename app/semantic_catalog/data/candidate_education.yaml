database: dbpcm_warehouse
table: candidate_education
description: Candidate-provided education history linked to an ATS application. Not verified current employee education and not directly linked to employee_code or candidate_id.

grain: [ education_id ]

temporal:
  dimensions: []
  default_pin: null

primary_key: [ education_id ]

join_keys:
  - { column: application_id, joins: applicant_tracking_application.application_id, cardinality: N:1 }

columns:
  client_code: { type: Nullable(String), description: Client/company code. }
  education_id: { type: Nullable(Int32), description: Unique education-history row identifier. }
  application_id: { type: Nullable(Int32), description: Application identifier; join through applicant_tracking_application. }
  institute_name: { type: Nullable(String), description: Candidate-provided institution name. }
  education_city: { type: Nullable(String), description: Institution city. }
  education_state: { type: Nullable(String), description: Institution state. }
  education_country: { type: Nullable(String), description: Institution country. }
  student_degree: { type: Nullable(String), description: Candidate-provided degree. }
  student_major: { type: Nullable(String), description: Candidate-provided major. }
  student_minor: { type: Nullable(String), description: Candidate-provided minor. }
  student_alias: { type: Nullable(String), description: Student alias/name used at institution. }
  student_gpa: { type: "Nullable(Decimal(18, 6))", description: Candidate-provided GPA. }
  graduated:
    type: Nullable(String)
    observed_values: [ Yes, No ]
    description: Whether the candidate reported graduating.
  currently_enrolled:
    type: Nullable(String)
    observed_values: [ No ]
    description: Whether the candidate reported being currently enrolled.
  education_date_attended_start: { type: Nullable(String), description: Candidate-provided attendance start date; stored as String. }
  education_date_attended_end: { type: Nullable(String), description: Candidate-provided attendance end date; stored as String. }
  anticipated_graduation_date: { type: Nullable(String), description: Candidate-provided anticipated graduation date; stored as String. }
  education_phone_number: { type: Nullable(String), sensitive: true, description: Sensitive institution phone number. }
  institution_type:
    type: Nullable(String)
    observed_values: [ Other, High School, University, University / Graduate School ]
    description: Candidate-provided institution type.

measures:
  education_entries: { column: "*", agg: count, defined_over: "education rows after application/candidate filters" }

rules:
  - { id: graduated, predicate: "graduated = 'Yes'", applies_when: graduated education analysis, description: Restrict to rows marked graduated. }
  - { id: not_graduated, predicate: "graduated = 'No'", applies_when: non-graduated education analysis, description: Restrict to rows marked not graduated. }
  - { id: currently_enrolled, predicate: "currently_enrolled = 'Yes'", applies_when: current enrollment analysis, description: Restrict to rows marked currently enrolled. }
  - { id: university_institution, predicate: "institution_type IN ('University', 'University / Graduate School')", applies_when: college/university education analysis, description: Restrict to university-type institutions. }
  - { id: high_school_institution, predicate: "institution_type = 'High School'", applies_when: high-school education analysis, description: Restrict to high-school institutions. }
  - { id: has_gpa, predicate: "student_gpa IS NOT NULL", applies_when: GPA analysis, description: Restrict to rows with a GPA value. }

ambiguities:
  - { term: employee_education_history, resolves_to: [ "join employee -> applicant_tracking_application by employee_code, pick the application with MAX(application_date) for that employee, then candidate_education on its application_id" ], default: latest_application_by_ApplicationDate, clarify_if: user wants all ATS education across every application, or a specific application }
  - { term: candidate_education_history, resolves_to: [ "candidate_education rows joined through application_id" ], default: application_linked_education_rows, clarify_if: candidate has multiple applications and user does not specify which one }
  - { term: highest_degree, resolves_to: [ student_degree ], default: candidate_provided_degree_text, clarify_if: degree ranking/mapping is required }
  - { term: education_dates, resolves_to: [ education_date_attended_start, education_date_attended_end, anticipated_graduation_date ], default: candidate_provided_string_dates, clarify_if: "candidate-entered String dates with NO guaranteed format — parse via parseDateTimeBestEffortOrNull(...) (nulls unparseable values rather than erroring); chronological sorting/filtering is best-effort and may silently drop rows. Confirm before relying on date math." }

