database: dbpcm_warehouse
table: candidate_employment_history
description: Candidate-provided prior employment history linked to an ATS application. Not verified internal employment history and not directly linked to employee_code or candidate_id.

grain: [ employment_id ]

temporal:
  dimensions: []
  default_pin: null

primary_key: [ employment_id ]

join_keys:
  - { column: application_id, joins: applicant_tracking_application.application_id, cardinality: N:1 }

columns:
  client_code: { type: Nullable(String), description: Client/company code. }
  employment_id: { type: Nullable(Int32), description: Unique employment-history row identifier. }
  application_id: { type: Nullable(Int32), description: Application identifier; join through applicant_tracking_application. }
  employer_name: { type: Nullable(String), description: Candidate-provided employer name. }
  employer_street_address: { type: Nullable(String), sensitive: true, description: Sensitive candidate-provided employer street address. }
  employer_city: { type: Nullable(String), description: Employer city. }
  employer_state: { type: Nullable(String), description: Employer state. }
  employer_zip_code: { type: Nullable(String), description: Employer ZIP/postal code. }
  employer_country: { type: Nullable(String), description: Employer country. }
  employer_phone: { type: Nullable(String), sensitive: true, description: Sensitive employer phone number. }
  previous_job_title: { type: Nullable(String), description: Candidate-provided previous job title. }
  previous_job_duties: { type: Nullable(String), description: Candidate-provided previous job duties. }
  previous_supervisor: { type: Nullable(String), description: Candidate-provided previous supervisor. }
  reason_left: { type: Nullable(String), description: Candidate-provided reason for leaving. }
  can_contact_employer:
    type: Nullable(String)
    observed_values: [ Yes, No ]
    description: Whether the candidate says the employer may be contacted.
  current_employer:
    type: Nullable(String)
    observed_values: [ Yes, No ]
    description: Whether the candidate marked this as their current employer.
  employment_start_date: { type: Nullable(String), description: Candidate-provided employment start date; stored as String. }
  employment_end_date: { type: Nullable(String), description: Candidate-provided employment end date; stored as String. }

measures:
  employment_history_entries: { column: "*", agg: count, defined_over: "employment-history rows after application/candidate filters" }

rules:
  - { id: current_employer_rows, predicate: "current_employer = 'Yes'", applies_when: current prior-employer analysis, description: Restrict to rows marked as current employer. }
  - { id: former_employer_rows, predicate: "current_employer = 'No'", applies_when: former-employer analysis, description: Restrict to rows not marked as current employer. }
  - { id: can_contact_employer, predicate: "can_contact_employer = 'Yes'", applies_when: employer-contact-permission analysis, description: Restrict to rows where employer contact is allowed. }
  - { id: cannot_contact_employer, predicate: "can_contact_employer = 'No'", applies_when: contact-restricted employer analysis, description: Restrict to rows where employer contact is not allowed. }
  - { id: has_employment_start, predicate: "employment_start_date IS NOT NULL", applies_when: employment-date analysis, description: Restrict to rows with a start date value. }
  - { id: has_employment_end, predicate: "employment_end_date IS NOT NULL", applies_when: employment-date analysis, description: Restrict to rows with an end date value. }

ambiguities:
  - { term: employee_work_history, resolves_to: [ "join employee -> applicant_tracking_application by employee_code, pick the application with MAX(application_date) for that employee, then candidate_employment_history on its application_id" ], default: latest_application_by_ApplicationDate, clarify_if: user wants all ATS work history across every application, or a specific application }
  - { term: candidate_work_history, resolves_to: [ "candidate_employment_history rows joined through application_id" ], default: application_linked_employment_rows, clarify_if: candidate has multiple applications and user does not specify which one }
  - { term: current_employer, resolves_to: [ "current_employer = 'Yes' in candidate-provided work history" ], default: current_employer_rows, clarify_if: user means current Paycom employment status from employee table }
  - { term: employment_dates, resolves_to: [ employment_start_date, employment_end_date ], default: candidate_provided_string_dates, clarify_if: "candidate-entered String dates with NO guaranteed format — parse via parseDateTimeBestEffortOrNull(...) (nulls unparseable values rather than erroring); chronological sorting/filtering is best-effort and may silently drop rows. Confirm before relying on date math." }
