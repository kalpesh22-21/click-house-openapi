measures:
  gross_earnings:
    column: amount
    agg: sum
    defined_over: register_type = 'EARN'; summed over payroll line items within the selected employee and payroll-period or
      pay-date grain.
  employee_tax_withheld:
    column: amount
    agg: sum
    defined_over: register_type = 'EETAX'; summed over payroll line items within the selected employee and payroll-period
      or pay-date grain.
  employee_deductions:
    column: amount
    agg: sum
    defined_over: register_type = 'DDUCT'; summed over payroll line items within the selected employee and payroll-period
      or pay-date grain.
  net_pay_distributed:
    column: amount
    agg: sum
    defined_over: register_type = 'NETPAYDIST'; summed over payroll line items within the selected employee and payroll-period
      or pay-date grain.
  employer_tax:
    column: amount
    agg: sum
    defined_over: register_type = 'ERTAX'; summed over payroll line items within the selected employee and payroll-period
      or pay-date grain.
  employee_benefits:
    column: amount
    agg: sum
    defined_over: register_type = 'EEBEN'; summed over payroll line items within the selected employee and payroll-period
      or pay-date grain.
  paid_hours:
    column: type_hours
    agg: sum
    defined_over: Hours-bearing rows, usually narrowed by register_type and type_code depending on whether the user wants
      worked, paid, PTO, overtime, or all hours.
rules:
- id: gross_earnings
  predicate: register_type = 'EARN'
  applies_when: gross earnings or payroll earnings questions
  description: Use earnings rows for gross compensation analysis.
- id: employee_deductions
  predicate: register_type = 'DDUCT'
  applies_when: deductions or expense-reimbursement-style deduction questions
  description: Use deduction rows, then narrow by type_code as needed.
- id: employee_taxes
  predicate: register_type = 'EETAX'
  applies_when: employee tax withholding questions
  description: Taxes withheld from employee pay.
- id: employer_taxes
  predicate: register_type = 'ERTAX'
  applies_when: employer payroll tax questions
  description: Employer-paid payroll tax rows.
- id: employee_benefits
  predicate: register_type = 'EEBEN'
  applies_when: employee benefit contribution questions
  description: Employee benefit contribution rows.
- id: net_pay_distribution
  predicate: register_type = 'NETPAYDIST'
  applies_when: take-home pay distribution questions
  description: How net pay was distributed, such as direct deposit or check.
ambiguities:
- term: pay_timing
  resolves_to:
  - pay_date
  - pay_period_start_date / pay_period_end_date
  default: pay_period_coverage
  clarify_if: Timing is ambiguous between check/payment date and work period covered.
- term: payroll
  resolves_to:
  - line items across all register_type values
  default: all_register_types
  clarify_if: user needs only gross earnings, net pay, taxes, deductions, benefits, or employer cost
- term: paycheck
  resolves_to:
  - group payroll line items by employee_code + pay_date, and often pay-period dates
  default: grouped_line_items
  clarify_if: exact check identity is required, because no reliable unique paycheck id is exposed
- term: wages_or_earnings
  resolves_to:
  - SUM(amount) WHERE register_type = 'EARN'
  default: gross_earnings
  clarify_if: user means net pay, taxable wages, employer payroll cost, or planned annual_salary / rate_1 from the employee
    table
- term: hours_worked
  resolves_to:
  - SUM(type_hours), usually filtered to earnings/hour-related type_code rows
  default: type_hours
  clarify_if: user needs paid hours, worked hours, PTO hours, overtime hours, or all hours
- term: department
  resolves_to:
  - department_code
  - department.department_name
  default: department_code for code filters; join department for department name or other dimensional attributes
  clarify_if: The user needs stored payroll department versus dimensional department attributes.
- term: labor_allocation
  resolves_to:
  - labor_allocation_key_1
  - labor_allocation_key_2
  - labor_allocation_key_3
  - labor_allocation_key_4
  - labor_allocation_key_5
  - labor_allocation_key_6
  - labor_allocation_key_7
  - labor_allocation_key_8
  - labor_allocation_key_9
  - labor_allocation_key_10
  - labor_allocation_key_11
  - labor_allocation_key_12
  - labor_allocation_key_13
  - labor_allocation_key_14
  - labor_allocation_key_15
  - labor_allocation_key_16
  - labor_allocation_key_17
  - labor_allocation_key_18
  - labor_allocation_key_19
  - labor_allocation_key_20
  default: Use the specifically requested labor allocation type number
  clarify_if: The request does not identify which labor allocation type, from 1 through 20, should be used.
schema_notes:
  - The table uses ReplicatedReplacingMergeTree(version).
  - dedup_hash is a materialized physical deduplication key and is not exposed to semantic consumers.
  - pay_date, pay_period_start_date and pay_period_end_date are non-nullable Date32 fields.
  - amount and type_hours are required Decimal(19,2) fields and may contain negative values for reversals.
  - gross_to_net_key participates in payroll balancing and deduplication logic.
mcp_projection:
  hidden_columns:
    - client_code
    - proc_center
    - version
    - dedup_hash
  notes:
    - client_code and proc_center are enforced by row-level policy and omitted from exposed columns and joins.
    - version and dedup_hash are physical storage and deduplication fields and are omitted from the model-facing schema.
row_scope:
  implicit_filters:
    - client_code
    - proc_center
  enforced_by: ClickHouse row policy