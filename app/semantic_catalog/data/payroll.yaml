database: dbpcm_warehouse
table: payroll
region: workforce_payroll
description: Payroll register line-item table. Contains paycheck components such as earnings, deductions, taxes, benefits,
  employer taxes, and net-pay distributions. Not one row per paycheck.
grain:
- register_type
- profile_code
- department_code
- transaction_number
- type_code
- type_code_description
- type_rate
- employee_code
- distributed_job_cost_code
- check_number
grain_verifiable: true
grain_note: Payroll register LINE ITEMS - one row per unique ClickHouse sort/dedup tuple above, not one row per paycheck.
  transaction_number and check_number should not be treated as unique by themselves. Multiple rows can share the same employee_code
  + pay_date.
temporal:
  dimensions:
  - name: pay_period
    role: period
    range:
      start_col: pay_period_start_date
      end_col: pay_period_end_date
  - name: pay_event
    role: event
    date_col: pay_date
  default_pin: pay_period
  note: Constrain at least one payroll time dimension before broad aggregation. Use pay_date for issued/paid timing; use pay_period_start_date
    and pay_period_end_date for the period covered.
primary_key: []
primary_key_note: No simple single-column business primary key is exposed. The ORDER BY tuple is unique in observed data and
  defines the ClickHouse sort/dedup grain.
join_keys:
- column: employee_code
  joins: employee.employee_code
  join_on:
  - employee_code
  cardinality: N:1
  confidence: high
  description: Join Payroll to Employee using employee_code.
  implicit_join_scope:
  - client_code
  - proc_center
- column: department_code
  joins: department.department_code
  join_on:
  - department_code
  cardinality: N:1
  confidence: medium
  description: Join payroll department_code to department using tenant scope when department attributes are needed.
  implicit_join_scope:
  - client_code
  - proc_center
# Labor allocation join model — TEMPLATED join_key (overlay pattern form):
# each payroll line item carries up to 20 INDEPENDENT labor-allocation dimension values in
# labor_allocation_key_1..labor_allocation_key_20. Each key column holds a join_key
# value that resolves to exactly one labor_allocation row (labor_allocation.join_key
# is unique within a tenant), from which the allocation code and description are read.
# The 20 keys are DISTINCT dimension slots (types 1..20) — the per-slot MEANING lives in
# each labor_allocation_key_N column's own description below — but they ALL join
# labor_allocation on join_key identically, so the JOIN is authored ONCE as a pattern
# entry (column_pattern + index_range) instead of 20 near-identical rows. The overlay
# (app/semantic_catalog/overlay.py) emits this as a SINGLE compact join_key carrying the
# pattern + range + join_on template + description; it is NOT expanded to 20 entries in
# getTableSchema. The model selects whichever key(s) 1..20 the question needs. Tenant
# scope (the RLS columns) is applied server-side by the ClickHouse row policy and is
# intentionally NOT part of the model-facing ON clause. Cardinality N:1.
- column_pattern: labor_allocation_key_{n}
  index_range: [1, 20]
  joins: labor_allocation.join_key
  join_on: labor_allocation_key_{n} = join_key
  cardinality: N:1
  description: Each labor_allocation_key_{n} (n=1..20) is a DISTINCT labor-allocation dimension (see each column's own description for what it represents); join the specific key(s) the question needs to labor_allocation on join_key to resolve its code/description.
columns:
  employee_code:
    type: FixedString(4)
    description: Employee identifier; canonical join key to employee.
  register_type:
    type: String
    values:
      EARN: earnings
      EETAX: employee_tax
      DDUCT: deductions
      NETPAYDIST: net_pay_distribution
      EEBEN: employee_benefits
      ERTAX: employer_tax
    description: Main payroll register category for the line item.
  amount:
    type: Nullable(Decimal(19, 2))
    description: Monetary amount for the payroll line. Meaning depends on register_type. Negative values can occur for reversals
      or adjustments.
    unit: USD
  type_hours:
    type: Nullable(Decimal(19, 2))
    description: Hours associated with the payroll type code when applicable. Negative values can occur for reversals or adjustments.
    unit: hours
  type_code:
    type: FixedString(3)
    description: Payroll code within the register type.
    client_defined: true
    description_col: type_code_description
  type_code_description:
    type: FixedString(64)
    description: Human-readable description for type_code.
    client_defined: true
  profile_code:
    type: FixedString(5)
    description: Payroll profile or benefit eligibility profile code when applicable.
    client_defined: true
  distributed_job_cost_code:
    type: FixedString(119)
    description: This is a key formed by concatenating all labor allocation keys.
  department_code:
    type: FixedString(12)
    description: Department code on the payroll row.
    client_defined: true
  type_rate:
    type: Decimal(12, 2)
    description: Rate associated with the type code when applicable.
    unit: USD_per_hour
  pay_date:
    type: Nullable(Date32)
    description: Check/payment date; use when the question is about when payroll was issued.
  pay_period_start_date:
    type: Nullable(Date32)
    description: Start date of the pay period covered by the line item.
  pay_period_end_date:
    type: Nullable(Date32)
    description: End date of the pay period covered by the line item.
  transaction_number:
    type: FixedString(9)
    description: Payroll transaction reference number. Not unique by itself.
  check_number:
    type: UInt32
    description: Check number for the payroll item when paid by or associated with a check. Not unique by itself.
  labor_allocation_key_1:
    type: Nullable(String)
    description: Labor allocation key for dimension 1. Join labor_allocation_key_1 to labor_allocation.join_key to resolve
      the allocation code and description; tenant scope is applied server-side by the row policy.
    client_defined: true
