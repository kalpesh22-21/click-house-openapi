database: dbpcm_warehouse
table: performance_discussions
description: Performance discussion workflow and form-detail table. Use for writeups, coaching or disciplinary discussions, workflow state, acknowledgments, monitoring periods, uploaded-document filenames, and field-level discussion responses.

grain: []
grain_verifiable: false   # no exposed unique key — the D43 COUNT(*)==COUNT(DISTINCT grain) conformance probe does not apply
grain_note: >
  Field-response-level rows. No reliable row-level natural key is exposed. Use discussion_id for
  discussion-level grouping (COUNT(DISTINCT discussion_id)); multiple rows exist per discussion_id
  because field-level responses repeat. Logical analysis grain: one field-response row.

temporal:
  dimensions:
    - { name: creation_event, role: event, date_col: creation_date }
    - { name: last_action_event, role: event, date_col: last_action_date }
    - { name: resolved_event, role: event, date_col: resolved_date }
    - { name: employee_acknowledgment_event, role: event, date_col: employee_acknowledgment_date }
    - { name: manager_approval_event, role: event, date_col: manager_approval_date }
    - { name: monitoring_end_event, role: event, date_col: monitoring_period_end_date }
  default_pin: creation_event

primary_key: []
primary_key_note: discussion_id is the discussion-level identifier, but it is not row-unique.

join_keys:
  - { column: employee_code, joins: employee.employee_code, cardinality: N:1 }

columns:
  client_code: { type: Nullable(String), description: Client/company code. }
  employee_code: { type: String, description: Employee identifier; canonical join key to employee. }
  discussion_id: { type: Nullable(Int32), description: Discussion/form/workflow identifier. Group by this for discussion-level analysis. }
  approval_notes: { type: Nullable(String), sensitive: true, description: Approval or resolution notes. Sensitive workflow text. }
  approver: { type: Nullable(String), description: User who approved or resolved the discussion. }
  created_by: { type: Nullable(String), description: User who created the discussion. }
  creation_date: { type: Nullable(DateTime64(6)), description: Discussion creation timestamp. }
  discussion_notes: { type: Nullable(String), sensitive: true, description: Discussion notes. Sensitive workflow text. }
  discussion_notes_updated_by: { type: Nullable(String), description: User who last updated discussion notes. }
  discussion_reason: { type: Nullable(String), description: Reason for the discussion. }
  discussion_state:
    type: Nullable(String)
    values:
      Draft: draft_not_submitted
      Creator: with_creator
      Employee Approval: awaiting_employee_approval
      Eligibility Review: eligibility_review_stage
      Accrual Review: accrual_review_stage
      Human Resources: hr_review_stage
      Final Approval: in_final_approval
      Resolved: resolved_closed
      Archived: archived
    observed_values: [ Draft, Creator, Resolved, Archived, Final Approval, Employee Approval ]
    description: Current workflow state of the discussion.
  discussion_template: { type: Nullable(String), client_defined: true, description: Form/template used for the discussion (CLIENT-DEFINED; resolve via resolveValues(discussion_template, <concept>)). }
  discussion_type:
    type: Nullable(String)
    client_defined: true
    observed_values: [ Verbal, 1 on 1, Manager Updates, Green Kudos, Exit Interview, Stay Interviews, Talent Acquisition, CRR Manager Shadow, New Hire Check In, Final Incident Summary - Involuntary Separation, Memo Of Conversation - Verbal, Corrective Action Form - Misconduct, Sales Performance Documentation, Corrective Action Form - Performance, Memo Of Conversation - Performance, Paycom Offboarding Interview, Corrective Action Form - Behavior, Performance Improvement Plan ]
    description: Type/category of discussion. CLIENT-DEFINED (client-configured form types) — resolve concepts via resolveValues(discussion_type, <concept>); observed_values is illustrative, not authoritative per client.
  document_uploads: { type: Nullable(String), description: Uploaded document filenames only; not document contents. }
  document_uploads_updated_by: { type: Nullable(String), description: User who updated uploaded document metadata. }
  employee_acknowledgment:
    type: Nullable(String)
    observed_values: [ Declined, Acknowledgment, Individual Development Plan (initiator) ]
    description: Employee acknowledgment state/text.
  employee_acknowledgment_date: { type: Nullable(DateTime64(6)), description: Timestamp when employee acknowledged the discussion. }
  employee_signature: { type: Nullable(String), description: Employee signature or acknowledgment text. }
  exception_point_threshold: { type: Nullable(String), description: Exception-point threshold tier associated with the discussion. }
  exception_point_total: { type: Nullable(String), description: "Employee exception-point total at discussion creation time; stored as String. Cast with toFloat64OrNull(exception_point_total) before numeric use — nulls non-numeric values rather than erroring." }
  field_answer: { type: Nullable(String), sensitive: true, description: Field-level answer captured on the discussion form. Sensitive form text. }
  field_completed_by: { type: Nullable(String), description: User or employee who completed the field-level answer. }
  field_description: { type: Nullable(String), description: Field-level prompt/description on the discussion form. }
  last_action_date: { type: Nullable(DateTime64(6)), description: Timestamp of most recent workflow action. }
  last_modified_by: { type: Nullable(String), description: User who last modified the discussion. }
  manager_acknowledgment:
    type: Nullable(String)
    observed_values: [ Acknowledgment, Declined, Individual Development Plan (initiator), Individual Development Plan (leader), Overridden ]
    description: Manager acknowledgment state/text.
  manager_approval_date: { type: Nullable(DateTime64(6)), description: Timestamp when manager approved or resolved the discussion. }
  manager_signature: { type: Nullable(String), description: Manager signature identifier or text. }
  monitoring_period_days: { type: Nullable(String), unit: days, description: "Monitoring-period length; stored as String. Cast with toInt32OrNull(monitoring_period_days) before numeric use — nulls non-numeric values rather than erroring." }
  monitoring_period_end_date: { type: Nullable(DateTime64(6)), description: Monitoring-period end timestamp. }
  resolved_date: { type: Nullable(DateTime64(6)), description: Resolution timestamp when discussion is resolved. }
  send_back_notes: { type: Nullable(String), sensitive: true, description: Notes entered when the discussion was sent back. Sensitive workflow text. }
  waiting_on: { type: Nullable(String), description: Current pending owner, approver, employee, group, or relationship. }

measures:
  discussion_count: { column: discussion_id, agg: count_distinct, defined_over: "discussion rows after temporal, workflow-state, employee, and type filters" }
  field_response_rows: { column: "*", agg: count, defined_over: "field-level rows after temporal, workflow-state, employee, and type filters" }

rules:
  - { id: resolved_discussions, predicate: "discussion_state = 'Resolved'", applies_when: resolved discussion analysis, description: Restrict to resolved discussions. }
  - { id: archived_discussions, predicate: "discussion_state = 'Archived'", applies_when: archived discussion analysis, description: Restrict to archived discussions. }
  - { id: final_approval_discussions, predicate: "discussion_state = 'Final Approval'", applies_when: final approval workflow analysis, description: Restrict to discussions in final approval. }
  - { id: employee_approval_discussions, predicate: "discussion_state = 'Employee Approval'", applies_when: employee approval or acknowledgment workflow analysis, description: Restrict to discussions awaiting employee approval. }
  - { id: draft_discussions, predicate: "discussion_state = 'Draft'", applies_when: draft discussion analysis, description: Restrict to draft discussions. }
  - { id: creator_discussions, predicate: "discussion_state = 'Creator'", applies_when: creator workflow queue analysis, description: Restrict to discussions in creator workflow state. }
  - { id: open_discussions, predicate: "discussion_state IS NOT NULL AND discussion_state NOT IN ('Resolved', 'Archived')", applies_when: open or in-flight discussion analysis, description: Restrict to discussions not resolved or archived. }
  - { id: has_waiting_on, predicate: "waiting_on IS NOT NULL AND waiting_on != ''", applies_when: pending-owner workflow analysis, description: Restrict to discussions with a waiting_on value. }
  - { id: employee_acknowledged, predicate: "employee_acknowledgment = 'Acknowledgment' OR employee_acknowledgment_date IS NOT NULL", applies_when: employee acknowledgment analysis, description: Restrict to discussions with employee acknowledgment evidence. }
  - { id: employee_declined_acknowledgment, predicate: "employee_acknowledgment = 'Declined'", applies_when: declined employee acknowledgment analysis, description: Restrict to employee-declined acknowledgment rows. }
  - { id: manager_acknowledged, predicate: "manager_acknowledgment = 'Acknowledgment' OR manager_approval_date IS NOT NULL", applies_when: manager acknowledgment or approval analysis, description: Restrict to discussions with manager acknowledgment/approval evidence. }
  - { id: manager_declined_acknowledgment, predicate: "manager_acknowledgment = 'Declined'", applies_when: declined manager acknowledgment analysis, description: Restrict to manager-declined acknowledgment rows. }
  - { id: active_monitoring_period, predicate: "monitoring_period_end_date IS NOT NULL AND monitoring_period_end_date >= now64(6)", applies_when: active monitoring-period analysis, description: Restrict to discussions whose monitoring end date has not passed. }
  - { id: has_document_uploads, predicate: "document_uploads IS NOT NULL AND document_uploads != ''", applies_when: uploaded-document filename analysis, description: Restrict to rows with uploaded document filenames. }
  - { id: has_exception_points, predicate: "exception_point_total IS NOT NULL OR exception_point_threshold IS NOT NULL", applies_when: exception-point-triggered discussion analysis, description: Restrict to discussions with exception-point fields populated. }
  - { id: corrective_action_discussions, predicate: "discussion_type IN ('Corrective Action Form - Misconduct', 'Corrective Action Form - Performance', 'Corrective Action Form - Behavior')", applies_when: corrective action analysis, description: Restrict to corrective action discussion types. }
  - { id: performance_improvement_plan_discussions, predicate: "discussion_type = 'Performance Improvement Plan'", applies_when: PIP analysis, description: Restrict to performance improvement plan discussions. }
  - { id: field_level_rows, predicate: "field_description IS NOT NULL OR field_answer IS NOT NULL", applies_when: form field response analysis, description: Restrict to rows with field-level form detail. }

ambiguities:
  - { term: discussion_count, resolves_to: [ "COUNT(DISTINCT discussion_id)" ], default: discussion_count, clarify_if: user asks for field-level rows or form answers }
  - { term: row_count, resolves_to: [ "COUNT(*) at field-response row grain" ], default: field_response_rows, clarify_if: user means distinct discussions }
  - { term: writeup, resolves_to: [ discussion_id ], default: discussion_level_grouping, clarify_if: user means corrective action only, PIP only, or all performance discussions }
  - { term: open_discussion, resolves_to: [ "discussion_state NOT IN ('Resolved', 'Archived')" ], default: open_discussions, clarify_if: user wants only a specific workflow state such as Employee Approval or Final Approval }
  - { term: resolved, resolves_to: [ "discussion_state = 'Resolved'", resolved_date ], default: resolved_discussions, clarify_if: user means manager-approved, final-approved, or archived }
  - { term: acknowledgment, resolves_to: [ employee_acknowledgment, employee_acknowledgment_date, manager_acknowledgment, manager_approval_date ], default: employee_and_manager_acknowledgment_fields, clarify_if: user wants only employee acknowledgment or only manager acknowledgment }
  - { term: monitoring_period, resolves_to: [ monitoring_period_days, monitoring_period_end_date ], default: monitoring_period_fields, clarify_if: user wants active monitoring periods only }
  - { term: uploaded_documents, resolves_to: [ document_uploads ], default: uploaded_filenames_only, clarify_if: user expects document contents, which are not stored in this table }
  - { term: current_employee_state, resolves_to: [ employee ], default: employee_table_current_state, clarify_if: user wants discussion workflow state instead }