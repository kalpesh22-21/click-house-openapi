database: dbpcm_warehouse
table: applicant_tracking_application
description: Applicant Tracking application table. One row per candidate application, not one row per candidate. Use for application pipeline, status, offer workflow, source attribution, and hired-employee ATS linkage.

grain: [ application_id ]

temporal:
  dimensions:
    - { name: application_event, role: event, date_col: application_date }
    - { name: disposition_event, role: event, date_col: disposition_date }
    - { name: offer_sent_event, role: event, date_col: offer_letter_sent_date }
    - { name: offer_response_event, role: event, date_col: offer_letter_accepted_rejected_date }
    - { name: offer_created_event, role: event, date_col: offer_letter_created_on_date }
    - { name: offer_approval_event, role: event, date_col: offer_letter_approval_date }
  default_pin: application_event

primary_key: [ application_id ]

join_keys:
  - { column: application_id, joins: candidate_education.application_id, cardinality: 1:N }
  - { column: application_id, joins: candidate_employment_history.application_id, cardinality: 1:N }
  - { column: employee_code, joins: employee.employee_code, cardinality: N:1 }

columns:
  client_code: { type: Nullable(String), description: Client/company code. }
  application_id: { type: Int32, description: Unique application identifier. }
  referral_source: { type: Nullable(String), client_defined: true, description: Referral source named on the application (CLIENT-DEFINED; resolve via resolveValues(referral_source, <concept>)). }
  application_date: { type: DateTime64(6), description: Date/time the application was started. }
  disposition: { type: Nullable(String), client_defined: true, description: Application outcome or disposition label (CLIENT-DEFINED; resolve via resolveValues(disposition, <concept>)). }
  disposition_date: { type: Nullable(DateTime64(6)), description: Date/time the disposition last changed. }
  work_flow_group_name: { type: Nullable(String), client_defined: true, description: Hiring workflow group (CLIENT-DEFINED; resolve via resolveValues(work_flow_group_name, <concept>)). }
  candidate_id: { type: Nullable(Int32), description: Stable candidate identifier across applications. }
  application_source: { type: Nullable(String), client_defined: true, description: Source channel for the application (CLIENT-DEFINED; resolve via resolveValues(application_source, <concept>)). }
  applicant_first_name: { type: Nullable(String), description: Applicant first name. }
  applicant_last_name: { type: Nullable(String), description: Applicant last name. }
  applicant_preferred_first_name: { type: Nullable(String), description: Applicant preferred first name. }
  applicant_preferred_last_name: { type: Nullable(String), description: Applicant preferred last name. }
  applicant_primary_phone: { type: Nullable(String), sensitive: true, description: Sensitive applicant phone number. }
  applicant_secondary_phone: { type: Nullable(String), sensitive: true, description: Sensitive applicant secondary phone number. }
  applicant_email_address: { type: Nullable(String), sensitive: true, description: Sensitive applicant email address. }
  applicant_birth_date: { type: Nullable(DateTime64(6)), sensitive: true, description: Sensitive applicant birth date. }
  applicant_full_street_address: { type: Nullable(String), sensitive: true, description: Sensitive applicant full street address. }
  applicant_street_address_1: { type: Nullable(String), sensitive: true, description: Sensitive applicant address line 1. }
  applicant_street_address_2: { type: Nullable(String), sensitive: true, description: Sensitive applicant address line 2. }
  applicant_city: { type: Nullable(String), description: Applicant city. }
  applicant_state: { type: Nullable(String), description: Applicant state. }
  applicant_zip_code: { type: Nullable(String), description: Applicant ZIP/postal code. }
  applicant_county: { type: Nullable(String), description: Applicant county. }
  application_status_enum:
    type: Nullable(String)
    observed_values: [ Hired, Offered, Active, Rejected, Knocked Out, Unknown Status, Declined Offer ]
    description: Current application status.
  application_type:
    type: Nullable(String)
    observed_values: [ Internal, External, Past Employee ]
    description: Application category.
  complete_incomplete:
    type: Nullable(String)
    observed_values: [ Complete, Incomplete ]
    description: Whether the application is complete.
  offer_letter_accepted_rejected_date: { type: Nullable(DateTime64(6)), description: Offer accepted/rejected timestamp. }
  offer_letter_status_enum:
    type: Nullable(String)
    observed_values: [ Approved, Not Sent, No Offer Letter, Offer Approval Pending, Offer Expired, Offer Incomplete, Offer Rejected, Offer Sent, Offer Signed ]
    description: Offer-letter workflow status.
  offer_letter_sent_date: { type: Nullable(DateTime64(6)), description: Offer-letter sent timestamp. }
  approval_step: { type: Nullable(String), description: Approval workflow step. }
  work_flow_step: { type: Nullable(String), description: Current workflow step. }
  offer_letter_created_on_date: { type: Nullable(DateTime64(6)), description: Offer-letter creation timestamp. }
  offer_letter_approval_date: { type: Nullable(DateTime64(6)), description: Offer-letter approval timestamp. }
  offer_version: { type: Nullable(String), description: Offer version. }
  application_job_wage_start: { type: "Nullable(Decimal(18, 6))", unit: USD, description: Lower bound of application job wage range. }
  application_job_wage_end: { type: "Nullable(Decimal(18, 6))", unit: USD, description: Upper bound of application job wage range. }
  hiring_process_step: { type: Nullable(String), description: Hiring process step. }
  user_assigned_to_step: { type: Nullable(String), description: User assigned to the current workflow step. }
  days_in_offer_status: { type: Nullable(Int32), unit: days, description: Aging in current offer status. }
  hours_in_offer_status: { type: Nullable(Int32), unit: hours, description: Aging in current offer status. }
  days_in_hiring_step: { type: Nullable(Int32), unit: days, description: Aging in current hiring step. }
  hours_in_hiring_step: { type: Nullable(Int32), unit: hours, description: Aging in current hiring step. }
  minutes_in_hiring_step: { type: Nullable(Int32), unit: minutes, description: Aging in current hiring step. }
  hours_in_new_hire_queue: { type: Nullable(Int32), unit: hours, description: Time in new-hire queue. }
  days_in_new_hire_queue: { type: Nullable(Int32), unit: days, description: Time in new-hire queue. }
  total_onboarding_hours: { type: Nullable(Int32), unit: hours, description: Total onboarding hours. }
  application_position_seat_code: { type: Nullable(String), description: Position seat code captured on the application. }
  application_position_seat_description: { type: Nullable(String), description: Position seat description captured on the application. }
  employee_code: { type: Nullable(String), description: Employee identifier when the application links to a hired/current employee. }

measures:
  application_count: { column: "*", agg: count, defined_over: "applications after temporal and status filters" }
  candidate_count: { column: candidate_id, agg: count_distinct, defined_over: "applications with candidate_id after temporal and status filters" }
  hired_application_count: { column: application_id, agg: count_distinct, defined_over: "application_status_enum = 'Hired'" }

rules:
  - { id: complete_applications, predicate: "complete_incomplete = 'Complete'", applies_when: completed application analysis, description: Restrict to completed applications. }
  - { id: hired_applications, predicate: "application_status_enum = 'Hired'", applies_when: hired application or conversion analysis, description: Restrict to applications marked hired. }
  - { id: active_applications, predicate: "application_status_enum = 'Active'", applies_when: active pipeline analysis, description: Restrict to active applications. }
  - { id: rejected_applications, predicate: "application_status_enum IN ('Rejected', 'Knocked Out')", applies_when: rejection analysis, description: Restrict to rejected/knocked-out applications. }
  - { id: offered_applications, predicate: "application_status_enum = 'Offered'", applies_when: offer-stage pipeline analysis, description: Restrict to offered applications. }
  - { id: declined_offer_applications, predicate: "application_status_enum = 'Declined Offer'", applies_when: declined-offer analysis, description: Restrict to declined-offer applications. }
  - { id: external_applications, predicate: "application_type = 'External'", applies_when: external applicant analysis, description: Restrict to external applications. }
  - { id: internal_applications, predicate: "application_type = 'Internal'", applies_when: internal applicant analysis, description: Restrict to internal applications. }
  - { id: past_employee_applications, predicate: "application_type = 'Past Employee'", applies_when: rehire/past-employee applicant analysis, description: Restrict to past-employee applications. }
  - { id: offer_signed, predicate: "offer_letter_status_enum = 'Offer Signed'", applies_when: accepted/signed offer analysis, description: Restrict to signed offers. }
  - { id: has_employee_link, predicate: "employee_code IS NOT NULL", applies_when: hired-employee ATS linkage, description: Restrict to applications linked to an employee record. }

ambiguities:
  - { term: applicant_count, resolves_to: [ "COUNT(DISTINCT candidate_id)" ], default: candidate_count, clarify_if: user means application count rather than unique candidates }
  - { term: application_count, resolves_to: [ "COUNT(*) or COUNT(DISTINCT application_id)" ], default: application_count, clarify_if: user means unique candidates }
  - { term: hire, resolves_to: [ "application_status_enum = 'Hired'" ], default: hired_applications, clarify_if: user wants offer signed, employee-linked records, or current employee state }
  - { term: submitted_application, resolves_to: [ "complete_incomplete = 'Complete'" ], default: complete_applications, clarify_if: user means started applications regardless of completion }
  - { term: current_employee_state, resolves_to: [ employee ], default: employee_table_current_state, clarify_if: user wants ATS application state instead }
  - { term: requisition_join, resolves_to: [ "no direct requisition_id is exposed on applicant_tracking_application" ], default: unavailable_without_mapping, clarify_if: user asks for application-to-requisition conversion without a supplied mapping }

