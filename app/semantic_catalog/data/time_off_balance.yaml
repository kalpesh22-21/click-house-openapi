database: dbpcm_warehouse
table: time_off_balance
source: mysql
description: >
  Employee accrual-plan balance records. For beginning balances and recorded taken
  amounts, use beginning_balance and taken_amount from this table, with the relevant
  plan and employee scope. Use time_off_request for event/workflow analysis; approved
  event hours are not interchangeable with recorded taken amounts. Do not infer
  period coverage or units from a request date in another table.
grain: []
grain_verifiable: false
primary_key: []
primary_key_note: Do not assume employee_code or employee_code plus accrual_code uniquely identifies a row.
join_keys:
  - column: employee_code
    joins: employee.employee_code
    cardinality: N:1
    implicit_join_scope: [client_code, proc_center]
mcp_projection:
  hidden_columns: [client_code, proc_center, employee_code_num, client_code_key]
columns:
  client_code:
    type: Nullable(String)
    description: Client/company code.
  proc_center:
    type: String
    description: Processing center.
  employee_code:
    type: String
    description: Employee identifier; join to employee within tenant scope.
  accrual_status:
    type: Nullable(String)
    description: Accrual plan status.
  accrual_code:
    type: Nullable(String)
    description: Client-defined accrual plan code; interpret with accrual_description.
  accrual_description:
    type: Nullable(String)
    description: Accrual plan description.
  award_frequency:
    type: Nullable(String)
    description: Accrual award frequency label.
  beginning_balance:
    type: Nullable(Decimal(18, 6))
    description: Beginning balance. Do not infer a current balance formula or unit
      without plan-specific definitions.
  accrued_amount:
    type: Nullable(Decimal(18, 6))
    description: Accrued amount. Do not infer a current balance formula or unit without
      plan-specific definitions.
  awarded_amount:
    type: Nullable(Decimal(18, 6))
    description: Awarded amount. Do not infer a current balance formula or unit without
      plan-specific definitions.
  taken_amount:
    type: Nullable(Decimal(18, 6))
    description: >
      Recorded taken amount for the accrual plan. Use for balance-based taken/usage
      questions; do not substitute approved event hours, which may include future
      requests. Do not infer a current balance formula, unit, or date-period usage
      without plan-specific definitions.
  accrual_date:
    type: Nullable(DateTime64(6))
    description: Accrual date.
  accrual_reset_date:
    type: Nullable(DateTime64(6))
    description: Accrual reset date.
  accrual_anniversary_date:
    type: Nullable(DateTime64(6))
    description: Accrual anniversary date.
  next_accrual_date:
    type: Nullable(DateTime64(6))
    description: Next accrual date.
  accrual_next_award_date:
    type: Nullable(DateTime64(6))
    description: Accrual next award date.
  accrual_award_start_date:
    type: Nullable(DateTime64(6))
    description: Accrual award start date.
  accrual_redeem_start_date:
    type: Nullable(DateTime64(6))
    description: Accrual redeem start date.
  accrual_schedule_type:
    type: Nullable(String)
    description: Display string of schedule types; not a numeric measure.

row_scope:
  implicit_filters: [client_code, proc_center]

rules:
- id: time_off_balance_employee_detail_population
  predicate: employee.employee_status IN ('Active', 'On Leave')
  applies_when: >
    Employee-detail requests, even with a period filter.
    Does not apply to period fact totals or aggregates, including by employee or department; use all accessible records.
  description: >
    Default to current Active and On Leave. Explicit user scope overrides this default.
    Apply per result and blueprint slot; disclose population briefly.
    Filter via a tenant-scoped employee semijoin to avoid duplicating records.
