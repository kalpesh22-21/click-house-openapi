  secondary_supervisor_email:
    type: Nullable(String)
    description: The email address of the Secondary Supervisor assigned to the employee's position seat
  tertiary_supervisor_email:
    type: Nullable(String)
    description: The email address of the Tertiary Supervisor assigned to the employee's position seat
  quaternary_supervisor_email:
    type: Nullable(String)
    description: The email address of the Quaternary Supervisor assigned to the employee's position seat
  manager_level_code:
