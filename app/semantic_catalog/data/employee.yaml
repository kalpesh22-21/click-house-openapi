database: dbpcm_warehouse
table: employee
region: workforce_employee
description: Current-state employee master table using the new ClickHouse DDL structure with snake_case column names only.
grain:
- employee_code
grain_verifiable: true
primary_key:
- employee_code
primary_key_note: Tenant-scoped employee key. employee_code must not be used across clients or processing centers by itself.
temporal:
  dimensions: []
  default_pin: null
join_keys:
- column: employee_code
  joins: payroll.employee_code
  join_on:
  - employee_code
  cardinality: 1:N
  description: Join Employee to Payroll using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
- column: department_code
  joins: department.department_code
  join_on:
  - department_code
  cardinality: N:1
  description: Join Employee to department using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
- column: primary_supervisor_ee_code
  joins: employee.employee_code
  join_on:
  - primary_supervisor_ee_code = employee_code
  cardinality: N:1
  description: Primary supervisor employee self-join using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
- column: secondary_supervisor_ee_code
  joins: employee.employee_code
  join_on:
  - secondary_supervisor_ee_code = employee_code
  cardinality: N:1
  description: Secondary supervisor employee self-join using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
- column: tertiary_supervisor_ee_code
  joins: employee.employee_code
  join_on:
  - tertiary_supervisor_ee_code = employee_code
  cardinality: N:1
  description: Tertiary supervisor employee self-join using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
- column: quaternary_supervisor_ee_code
  joins: employee.employee_code
  join_on:
  - quaternary_supervisor_ee_code = employee_code
  cardinality: N:1
  description: Quaternary supervisor employee self-join using tenant scope.
  implicit_join_scope:
  - client_code
  - proc_center
# Labor allocation join model — TEMPLATED join_key (overlay pattern form):
# the employee carries up to 20 INDEPENDENT labor-allocation dimension values in
# labor_allocation_key_1..labor_allocation_key_20. Each key column holds a join_key
# value that resolves to exactly one labor_allocation row (labor_allocation.join_key
# is unique within a tenant), from which the allocation code and description are read.
# The 20 keys are DISTINCT dimension slots (types 1..20) — the per-slot MEANING lives in
# each labor_allocation_key_N column's own description below — but they ALL join
# labor_allocation on join_key identically, so the JOIN is authored ONCE as a pattern
# entry (column_pattern + index_range) instead of 20 near-identical rows. The overlay
# (app/semantic_catalog/overlay.py) emits this as a SINGLE compact join_key carrying the
# pattern + range + join_on template + description; it is NOT expanded to 20 entries in
# getTableSchema. The model selects whichever key(s) 1..20 the question needs. Tenant
# scope (the RLS columns) is applied server-side by the ClickHouse row policy and is
# intentionally NOT part of the model-facing ON clause. Cardinality N:1.
- column_pattern: labor_allocation_key_{n}
  index_range: [1, 20]
  joins: labor_allocation.join_key
  join_on: labor_allocation_key_{n} = join_key
  cardinality: N:1
  description: Each labor_allocation_key_{n} (n=1..20) is a DISTINCT labor-allocation dimension (see each column's own description for what it represents); join the specific key(s) the question needs to labor_allocation on join_key to resolve its code/description.
columns:
  employee_code:
    type: String
    description: The unique primary identifier associated with the employee across Paycom
  clock_sequence:
    type: Nullable(String)
    description: An optional employee identifier used for imports and reporting. This is an alphanumeric field that can be
      up to 15 characters.
  employee_gl_code:
    type: Nullable(String)
    description: The unique primary identifier associated with General Ledger reporting
  badge_number:
    type: Nullable(String)
    description: Badge numbers are the numbers that an employee will use when logging in to a kiosk or hardware clock. Badge
      numbers must be unique. Employees without badge numbers may not be able to interact with kiosks or hardware clocks.
      Badge numbers are not required for employees to use Web Time Clocks or Web Time Sheets.
  employee_name:
    type: Nullable(String)
    description: This is the employee's full name in the format of Last Name, First Name Middle Initial
  legal_employee_name:
    type: Nullable(String)
    description: This is the employees legal full name.
  first_name:
    type: Nullable(String)
    description: This is the first name of the employee.
  middle_name:
    type: Nullable(String)
    description: This is the optional middle name of the employee
  middle_initial:
    type: Nullable(String)
    description: The first letter of the employee's optional middle initial.
  last_name:
    type: Nullable(String)
    description: This is the last name or family name of the employee.
  suffix:
    type: Nullable(String)
    description: A suffix in a person's name is a word or letters added to the end of a name to provide additional information
      about a person's status, background, or profession. Examples of suffixes in names include Jr., Sr., III, and PhD.
  nickname:
    type: Nullable(String)
    description: This is another accepted name to refer to the employee by. (nickname).
  preferred_first_name:
    type: Nullable(String)
    description: This is the employees preferred first name, this may be different than the employees legal first name
  preferred_middle_name:
    type: Nullable(String)
    description: This is the employees preferred middle name, this may be different than the employees legal middle name
  preferred_last_name:
    type: Nullable(String)
    description: This is the employees preferred last name, this may be different than the employees legal last name
  preferred_employee_suffix:
    type: Nullable(String)
    description: This is the employees preferred suffix. A suffix in a person's name is a word or letters added to the end
      of a name to provide additional information about a person's status, background, or profession. Examples of suffixes
      in names include Jr., Sr., III, and PhD.
  employee_status:
    type: Nullable(String)
    description: The employee status code indicating whether the employee is Active, Terminated, Inactive, On Leave, Deceased,
      Retired, Not Hired, or PreHire.
    values:
    - A
    - D
    - I
    - R
    - T
    - V
  hire_date:
    type: Nullable(DateTime64(6))
    description: This is the date the employee was hired in the company.
  most_recent_hire_date:
    type: Nullable(DateTime64(6))
    description: This is the most recent date the employee was hired, reflective of any rehires
  rehire_date:
    type: Nullable(DateTime64(6))
    description: This is the employees rehire date if they left the company or were terminated, and then they were hired again.
  termination_date:
    type: Nullable(DateTime64(6))
    description: This is the date the employee was terminated
  old_termination_date:
    type: Nullable(DateTime64(6))
    description: This is the date the employee was terminated before they were re-hired.
  term_reason:
    type: Nullable(String)
    description: This was the 3 character termination reason for why the employee was terminated
  seniority_date:
    type: Nullable(DateTime64(6))
    description: This is the date of an employees length of service (tenure) for an employee to be considered for PTO Accruals
      or Benefits eligibility.
  leave_absence_start:
    type: Nullable(DateTime64(6))
    description: This is the date the employee started Leave of Absence and became Inactive
  leave_absence_end:
    type: Nullable(DateTime64(6))
    description: This is the date the employee ended Leave of Absence and is no longer Inactive
  full_time_to_part_time_date:
    type: Nullable(DateTime64(6))
    description: This is the date the employee started working part time from working full time
  last_worked_date:
    type: Nullable(DateTime64(6))
    description: This is the date that the employee worked last
  department_code:
    type: Nullable(String)
    description: Employee home Department code. This is the code assigned to the department within company maintenance and
      is related to labor allocations.
    client_defined: true
    description_col: department_name
  department_name:
    type: Nullable(String)
    description: Employee Home Department description. This is the code assigned to the department within company maintenance
      and is related to labor allocations.
  lives_in_state:
    type: Nullable(String)
    description: The Lives In state is the state the employee lives in for their assigned tax profile.
  works_in_state:
    type: Nullable(String)
    description: The Works In state is the state the employee works in for their assigned tax profile.
  sui_state:
    type: Nullable(String)
    description: The Sui state is the state of their agency for state Unemployment Insurance for their assigned tax profile.
  local_tax_1:
    type: Nullable(String)
    description: The Local Tax 1 is the 3 character local tax code in the employee's tax profile
  date_of_birth:
    type: Nullable(DateTime64(6))
