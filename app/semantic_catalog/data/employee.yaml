    unit: USD
  annual_salary:
    type: Nullable(Decimal(18, 6))
    description: This is the annual salary of the employee. (Estimated for hourly employee). For a MEDIAN of this column,
      ClickHouse quantileExact(0.5) returns the UPPER middle value when the group has an even number of rows, not the average
      of the two middle values; for a true median use (quantileExactLow(0.5)(annual_salary) + quantileExactHigh(0.5)(annual_salary))
