rules:
- id: active_employee
  predicate: employee_status = 'A'
  applies_when: User asks for active/current active employees.
  description: Restrict to active employees.
- id: exclude_not_hired_default
  predicate: employee_status != 'N' OR employee_status IS NULL
  applies_when: Default employee analysis without an explicit status filter.
  description: Exclude not-hired records by default.
- id: rehired_not_terminated
  predicate: termination_date IS NULL OR most_recent_hire_date IS NULL OR most_recent_hire_date < termination_date
  applies_when: Termination-status evaluation.
  description: Apply with the requested termination-state filter and account for rehire timing.
- id: missing_date_sentinel
  predicate: <date_column> != toDateTime64('1900-01-01 00:00:00', 6)
  applies_when: Filtering for populated employee dates on fields that use default date sentinels.
  description: Several nullable DateTime64 fields use 1900-01-01 00:00:00.000000 as a missing/default date rather than NULL.
ambiguities:
- term: hire_date
  resolves_to:
  - hire_date
  - most_recent_hire_date
  - rehire_date
  default: hire_date
  clarify_if: The question distinguishes original hire from most recent hire or rehire.
- term: supervisor
  resolves_to:
  - primary_supervisor_ee_code
  - secondary_supervisor_ee_code
  - tertiary_supervisor_ee_code
  - quaternary_supervisor_ee_code
  default: primary_supervisor_ee_code
  clarify_if: A non-primary supervisor level is intended.
- term: department
  resolves_to:
  - department_code
  - department_name
  - department.department_name
  default: department_name for display and department_code for filtering
  clarify_if: Conformed dimensional attributes are required.
- term: labor_allocation
  resolves_to:
  - labor_allocation_key_1
  - labor_allocation_key_2
  - labor_allocation_key_3
  - labor_allocation_key_4
  - labor_allocation_key_5
  - labor_allocation_key_6
  - labor_allocation_key_7
  - labor_allocation_key_8
  - labor_allocation_key_9
  - labor_allocation_key_10
  - labor_allocation_key_11
  - labor_allocation_key_12
  - labor_allocation_key_13
  - labor_allocation_key_14
  - labor_allocation_key_15
  - labor_allocation_key_16
  - labor_allocation_key_17
  - labor_allocation_key_18
  - labor_allocation_key_19
  - labor_allocation_key_20
  default: Use the specifically requested allocation type
  clarify_if: The allocation type number is not identified.
schema_notes:
- employee_pay_type and position_pay_type are LowCardinality(Nullable(String)).
- labor_allocation_key_1 through labor_allocation_key_20 join independently to labor_allocation using client_code + proc_center
  + join_key.
- Date fields with observed 1900-01-01 00:00:00.000000 sentinel values include rehire_date, termination_date, old_termination_date,
  seniority_date, leave_absence_start, leave_absence_end, full_time_to_part_time_date, last_worked_date, date_of_birth, and
  last_check_date.
mcp_projection:
  hidden_columns:
  - client_code
  - proc_center
  notes:
  - client_code and proc_center are enforced by row-level policy and omitted from exposed columns and joins.
row_scope:
  implicit_filters:
  - client_code
  - proc_center
  enforced_by: ClickHouse row policy