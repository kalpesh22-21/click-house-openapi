    - D
    - M
    - P
    - S
    - W
  marital_status_description:
    type: Nullable(String)
    description: This is the marital status for the employee, values could be Single, Married, Divorced, Widowed, or Domestic
      Partner. This could be used for benefits and tax purposes.
    values:
    - ''
    - Divorced
    - Domestic Partner
    - Married
    - Single
    - Widowed
  gender:
    type: Nullable(String)
    description: This is the gender reported by the employee
    values:
    - ''
    - Female
    - I do not wish to self-identify
    - Male
    - Non-Binary
  ethnic_background:
    type: Nullable(String)
    description: This is the ethnic background code reported by the employee
  country_code:
    type: Nullable(String)
    description: The 2-digit ISO country code associated with the employee's country of residence
