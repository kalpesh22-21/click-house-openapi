database: dbpcm_warehouse
table: accrual_balances
source: mysql
# Internal join-key contract; physical views must expose this encoding.
trino_join_keys:
  employee_code:
    column: employee_code_num
    encoding: employee_ascii4_be_v1
description: Employee accrual-plan balance records. Use accrual_events for individual time-off events.
grain: []
grain_verifiable: false
primary_key: []
primary_key_note: Do not assume employee_code or employee_code plus accrual_code uniquely identifies a row.
join_keys:
  - column: employee_code
    joins: employee.employee_code
    cardinality: N:1
    implicit_join_scope: [client_code, proc_center]
mcp_projection:
  hidden_columns: [client_code, proc_center, employee_code_num, client_code_key]
columns:
  client_code:
    type: Nullable(String)
    description: Client/company code.
  proc_center:
    type: String
    description: Processing center.
  employee_code:
    type: String
    description: Employee identifier; join to employee within tenant scope.
  accrual_status:
    type: Nullable(String)
    description: Accrual plan status.
  accrual_code:
    type: Nullable(String)
    description: Client-defined accrual plan code; interpret with accrual_description.
  accrual_description:
    type: Nullable(String)
    description: Accrual plan description.
  award_frequency:
    type: Nullable(String)
    description: Accrual award frequency label.
  beginning_balance:
    type: Nullable(Decimal(18, 6))
    description: Beginning balance. Do not infer a current balance formula or unit
      without plan-specific definitions.
  accrued_amount:
    type: Nullable(Decimal(18, 6))
    description: Accrued amount. Do not infer a current balance formula or unit without
      plan-specific definitions.
  awarded_amount:
    type: Nullable(Decimal(18, 6))
    description: Awarded amount. Do not infer a current balance formula or unit without
      plan-specific definitions.
  taken_amount:
    type: Nullable(Decimal(18, 6))
    description: Taken amount. Do not infer a current balance formula or unit without
      plan-specific definitions.
  accrual_date:
    type: Nullable(DateTime64(6))
    description: Accrual date.
  accrual_reset_date:
    type: Nullable(DateTime64(6))
    description: Accrual reset date.
  accrual_anniversary_date:
    type: Nullable(DateTime64(6))
    description: Accrual anniversary date.
  next_accrual_date:
    type: Nullable(DateTime64(6))
    description: Next accrual date.
  accrual_next_award_date:
    type: Nullable(DateTime64(6))
    description: Accrual next award date.
  accrual_award_start_date:
    type: Nullable(DateTime64(6))
    description: Accrual award start date.
  accrual_redeem_start_date:
    type: Nullable(DateTime64(6))
    description: Accrual redeem start date.
  accrual_schedule_type:
    type: Nullable(String)
    description: Display string of schedule types; not a numeric measure.
