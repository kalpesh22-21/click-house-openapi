id: kn-register-type
title: Payroll register types
doc_id: hr-glossary
status: validated
text: >
  register_type separates gross earnings (EARN), employee tax withholding (EETAX),
  employer taxes (ERTAX), deductions (DDUCT), employee benefit contributions (EEBEN),
  and net-pay distributions (NETPAYDIST). type_code identifies regular pay, overtime,
  bonuses and other specific items. Never sum all register types as payroll cost.
  EEBEN is not employer-paid benefits. EARN plus ERTAX covers gross pay and employer
  taxes, not complete employer cost; clarify the cost basis and period.
