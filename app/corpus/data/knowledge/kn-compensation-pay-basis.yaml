id: kn-compensation-pay-basis
title: Separate salaried and hourly compensation statistics
doc_id: hr-reporting-employee
status: validated
text: Use pay_type to classify employees, not whether salary is zero. Salary employees use recorded annual_salary;
  Hourly employees use recorded hourly_salary, expressed per hour. Never assume hours worked or convert hourly rates
  to annual salary. Keep annual salary and hourly rate statistics, rankings and comparisons separate, with separate
  columns and units. Do not sum hourly rates or compare them with annual salary thresholds. Actual paid earnings
  require payroll evidence. Preserve NULLs and separate unknown pay types. Use matching updated blueprints.
