id: bp-payroll-summary
intent: Payroll amount, source line count and distinct employee count by company, department or pay-date month.
  Required register_type enum and half-open pay-date period [start,end); select EARN for gross earnings. Optional
  type_code, employee status, department and employee. Earnings represent finalized total_earning after period close;
  use total_earning for in-progress earnings and never add both for the same covered earnings. Preaggregate payroll
  per employee/month before LEFT JOIN; unmatched employees retained unless employee filters supplied. Does not prove
  complete months or zero-fill missing months; no implicit earnings filter.
slots_summary: group_by, register_type, period, type_code, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_date
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - month
- name: register_type
  type: enum
  required: true
  enum_values:
  - EARN
  - EETAX
  - DDUCT
  - NETPAYDIST
  - EEBEN
  - ERTAX
  binds_to: dbpcm_warehouse.payroll.register_type
- name: period
  type: period_range
  temporal_type: date
  required: true
- name: type_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.payroll.type_code
  optional_pattern: 'TRUE'
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Group
sql_template: |
  WITH p AS
    (SELECT employee_code,
            substring(toString(pay_date), 1, 7) AS month,
            sum(amount) AS amount,
            count(*) AS line_count
     FROM dbpcm_warehouse.payroll
     WHERE register_type = {register_type}
       AND type_code = {type_code}
       AND toDate(pay_date) >= toDate({period_start})
       AND toDate(pay_date) < toDate({period_end})
     GROUP BY employee_code,
              substring(toString(pay_date), 1, 7))
  SELECT CASE {group_by}
             WHEN 'department' THEN e.department_name
             WHEN 'month' THEN toString(p.month)
             ELSE 'Company'
         END AS `Group`,
         sum(CAST(p.amount AS Nullable(Decimal(38, 2)))) AS `Payroll Amount`,
         sum(CAST(p.line_count AS Nullable(Decimal(20, 0)))) AS `Source Line Count`,
         uniqExact(p.employee_code) AS `Employee Count`
  FROM p
  LEFT JOIN dbpcm_warehouse.employee e ON p.employee_code = e.employee_code
  WHERE e.employee_status = {employee_status}
    AND e.department_name = {department}
    AND e.employee_code = {employee}
  GROUP BY CASE {group_by}
               WHEN 'department' THEN e.department_name
               WHEN 'month' THEN toString(p.month)
               ELSE 'Company'
           END
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN `Group`
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN `Group`
                     END ASC
