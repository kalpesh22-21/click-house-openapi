id: bp-age-band-distribution
intent: Active employee headcount by age band with average and median workforce age, computed from date of birth
  at query time
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT multiIf(age < 25, 'Under 25', age < 35, '25-34', age < 45, '35-44', age < 55, '45-54', age < 65, '55-64', '65+') AS "Age Band",
         count(DISTINCT employee_code) AS "Headcount",
         round(avg(age), 1) AS "Avg Age In Band",
         round((quantileExactLow(0.5)(toFloat64(age)) + quantileExactHigh(0.5)(toFloat64(age))) / 2, 1) AS "Median Age In Band"
  FROM
    (SELECT employee_code,
            department_name,
            date_diff('year', date_of_birth, now()) AS age
     FROM dbpcm_warehouse.employee
     WHERE employee_status = 'Active'
       AND date_of_birth IS NOT NULL
       AND toDate32(date_of_birth) > toDate32('1900-01-01')
       AND department_name = {department})
  GROUP BY "Age Band"
  ORDER BY min(age) ASC
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
slots_summary: department
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.date_of_birth
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Age Band:
    kind: text
  Headcount:
    kind: integer
  Avg Age In Band:
    kind: number
    unit: years
    precision: 2
  Median Age In Band:
    kind: number
    unit: years
    precision: 2
