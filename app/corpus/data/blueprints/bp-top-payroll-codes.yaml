id: bp-top-payroll-codes
intent: Top-N payroll type codes by dollar amount within a chosen register family for a pay period
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    type_code AS "Type Code",
    round(SUM(amount), 2) AS "Total Amount"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type IN ({register}) AND pay_period_end_date = {period}
  GROUP BY
    type_code
  ORDER BY
    "Total Amount" DESC
  LIMIT {top_n}
slots:
- name: top_n
  type: positive_integer
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: register
  type: enum
  required: true
  enum_values:
  - EARN
  - DDUCT
  - EETAX
  - ERTAX
  - EEBEN
  - NETPAYDIST
  multiple: true
slots_summary: top_n, period, register
uses:
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Type Code:
    kind: identifier
  Total Amount:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Type Code
  measure_columns:
  - Total Amount
