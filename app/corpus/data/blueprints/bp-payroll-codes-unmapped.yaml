id: bp-payroll-codes-unmapped
intent: Payroll register earning type codes that have no corresponding mapping in the earning category dimension,
  flagged as uncategorized for timecard mapping
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    "Type Code"
  FROM (
    SELECT DISTINCT
      p.type_code AS "Type Code"
    FROM dbpcm_warehouse.payroll AS p
    LEFT JOIN (
      SELECT
        earn_code
      FROM dbpcm_warehouse.earning_category
    ) AS ec
      ON ec.earn_code = p.type_code
    WHERE
      p.register_type = 'EARN'
      AND p.pay_period_end_date = {period}
      AND ec.earn_code IS NULL
  ) AS results
  ORDER BY {order_by}
  LIMIT {top_n}
slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Type Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Type Code
    direction: ASC
  allowed_columns:
  - Type Code
slots_summary: top_n, period, order_by
uses:
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.earning_category.earn_code
column_formats:
  Type Code:
    kind: identifier
presentation:
  kind: table
