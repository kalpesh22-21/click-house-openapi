id: bp-employee-date-summary
intent: Counts of distinct employees with recorded original hire, most recent hire or termination dates in an explicit
  half-open period. Group by company, department, current status or event month. These are current employee records,
  not a complete employment-event history or turnover rate. Current-status filter is optional and may exclude rehired
  employees. No implicit active/terminated filter; no zero-filled months.
slots_summary: date_basis, group_by, period, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.department.department_name
slots:
- name: date_basis
  type: enum
  required: true
  enum_values:
  - original_hire
  - most_recent_hire
  - termination
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
  - month
- name: period
  type: period_range
  temporal_type: date
  required: true
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Group
sql_template: |
  SELECT CASE
             WHEN {group_by} = 'month' THEN substring(toString(CASE
                                                      WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date
                                                      WHEN {date_basis} = 'termination' THEN e.termination_date
                                                      ELSE e.hire_date
                                                  END), 1, 7)
             WHEN {group_by} = 'department' THEN e.department_name
             WHEN {group_by} = 'status' THEN e.employee_status
             ELSE 'Company'
         END AS `Group`,
         uniqExact(e.employee_code) AS `Employee Count`
  FROM dbpcm_warehouse.employee e
  WHERE e.employee_status = {employee_status}
    AND e.department_name = {department}
    AND e.employee_code = {employee}
    AND (CASE
             WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date
             WHEN {date_basis} = 'termination' THEN e.termination_date
             ELSE e.hire_date
         END) >= toDate({period_start})
    AND (CASE
             WHEN {date_basis} = 'most_recent_hire' THEN e.most_recent_hire_date
             WHEN {date_basis} = 'termination' THEN e.termination_date
             ELSE e.hire_date
         END) < toDate({period_end})
  GROUP BY `Group`
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN `Group`
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN `Group`
                     END ASC
column_formats:
  Group:
    kind: text
  Employee Count:
    kind: integer
