id: bp-employer-tax-summary
intent: Total employer payroll tax and breakdown by tax type code for a pay period, from payroll register employer-tax
  lines
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    type_code AS "Tax Code",
    round(SUM(amount), 2) AS "Total Employer Tax"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type = 'ERTAX' AND pay_period_end_date = {period}
  GROUP BY
    type_code
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Employer Tax DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Employer Tax
    direction: DESC
  allowed_columns:
  - Tax Code
  - Total Employer Tax
slots_summary: period, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Tax Code:
    kind: identifier
  Total Employer Tax:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - Tax Code
  measure_columns:
  - Total Employer Tax
