id: bp-retroactive-change-share
intent: Count and share of retroactive employee master-data changes where the effective date precedes the record
  date by more than a specified number of days, grouped by changed field
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  /* Output aliases are Title-Case display names; consumers keying on column names */
  /* must use the quoted aliases. */
  SELECT
    changed_field AS "Changed Field",
    count() AS "Retroactive Changes",
    round(
      count() * 100.0 / nullIf(
        (
          SELECT
            count()
          FROM dbpcm_warehouse.employee_change
          WHERE
            change_time_added >= addMonths(today(), -{win})
            AND NOT (
              effective_date IS NULL
            )
        ),
        0
      ),
      2
    ) AS "Share Pct"
  FROM dbpcm_warehouse.employee_change
  WHERE
    change_time_added >= addMonths(today(), -{win})
    AND NOT (
      effective_date IS NULL
    )
    AND DATE_DIFF(DAY, effective_date, change_time_added) > {lag_days}
  GROUP BY
    changed_field
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: lag_days
  type: positive_integer
  required: true
- name: win
  type: relative_window
  required: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Retroactive Changes DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Retroactive Changes
    direction: DESC
  allowed_columns:
  - Changed Field
  - Retroactive Changes
  - Share Pct
slots_summary: lag_days, win, max_rows, order_by
uses:
- dbpcm_warehouse.employee_change.effective_date
- dbpcm_warehouse.employee_change.change_time_added
- dbpcm_warehouse.employee_change.changed_field
column_formats:
  Changed Field:
    kind: text
  Retroactive Changes:
    kind: integer
  Share Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Changed Field
  measure_columns:
  - Retroactive Changes
