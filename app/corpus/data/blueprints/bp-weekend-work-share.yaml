id: bp-weekend-work-share
intent: Weekend versus weekday paid hours share by month from total_earning, the authoritative hours source, showing
  weekend percentage and totals
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT formatDateTime(toStartOfMonth(punch_date), '%Y-%m') AS "Month",
         round(SUM(earn_hours), 2) AS "Total Hours",
         round(SUMIf(earn_hours, dayOfWeek(punch_date) IN (6, 7)), 2) AS "Weekend Hours",
         round(SUMIf(earn_hours, dayOfWeek(punch_date) NOT IN (6, 7)), 2) AS "Weekday Hours",
         round(100 * SUMIf(earn_hours, dayOfWeek(punch_date) IN (6, 7)) / nullIf(SUM(earn_hours), 0), 2) AS "Weekend Share Pct"
  FROM
    (SELECT punch_date,
            earn_hours
     FROM dbpcm_warehouse.total_earning)
  WHERE punch_date >= today() - toIntervalMonth({win})
  GROUP BY "Month"
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Month"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Month"
                     END ASC
slots:
- name: win
  type: relative_window
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: win, order_direction
uses:
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_hours
column_formats:
  Month:
    kind: text
  Total Hours:
    kind: number
    unit: hours
    precision: 2
  Weekend Hours:
    kind: number
    unit: hours
    precision: 2
  Weekday Hours:
    kind: number
    unit: hours
    precision: 2
  Weekend Share Pct:
    kind: percent
    scale: percent
    precision: 2
