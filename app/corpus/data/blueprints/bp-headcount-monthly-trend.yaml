id: bp-headcount-monthly-trend
intent: End-of-month active headcount and monthly termination trend reconstructed from hire and termination dates
  over the last N months
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(dateTrunc('MONTH', month_end), '%Y-%m') AS "Month",
    countIf(
      hire_date <= month_end
      AND (
        termination_date IS NULL
        OR toDate32(termination_date) <= toDate32('1900-01-01')
        OR termination_date > month_end
      )
    ) AS "Active Headcount",
    countIf(
      termination_date >= dateTrunc('MONTH', month_end)
      AND termination_date <= month_end
      AND NOT (
        termination_date IS NULL
      )
      AND toDate32(termination_date) > toDate32('1900-01-01')
      AND (
        most_recent_hire_date IS NULL OR most_recent_hire_date < termination_date
      )
    ) AS "Terms In Month"
  FROM (
    SELECT
      toLastDayOfMonth(addMonths(anchor.latest_hire, -toInt32(number))) AS month_end
    FROM (
      SELECT
        max(hire_date) AS latest_hire
      FROM dbpcm_warehouse.employee
      WHERE
        toDate32(hire_date) > toDate32('1900-01-01')
    ) AS anchor
    CROSS JOIN (
      SELECT
        arrayJoin(range(0, toInt32({win}))) AS number
    ) AS seq
  ) AS months
  CROSS JOIN dbpcm_warehouse.employee AS e
  WHERE
    NOT (
      hire_date IS NULL
    ) AND toDate32(hire_date) > toDate32('1900-01-01')
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Active Headcount
  - Terms In Month
slots_summary: win, order_by
uses:
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.employee.most_recent_hire_date
column_formats:
  Month:
    kind: text
  Active Headcount:
    kind: integer
  Terms In Month:
    kind: integer
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Active Headcount
  - Terms In Month
