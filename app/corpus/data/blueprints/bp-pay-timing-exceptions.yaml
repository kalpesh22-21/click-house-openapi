id: bp-pay-timing-exceptions
intent: Employees paid after termination or active employees not paid within N days
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    department_name AS "Department",
    employee_status AS "Status",
    termination_date AS "Termination Date",
    last_check_date AS "Last Check Date",
    multiIf(employee_status = 'Terminated', 'Paid After Termination', 'Active Not Paid') AS "Exception Type"
  FROM dbpcm_warehouse.employee
  WHERE
    department_name IN ({department})
    AND (
      (
        employee_status = 'Terminated'
        AND (
          most_recent_hire_date IS NULL OR most_recent_hire_date < termination_date
        )
        AND NOT (
          last_check_date IS NULL
        )
        AND toDate32(last_check_date) > toDate32('1900-01-01')
        AND NOT (
          termination_date IS NULL
        )
        AND toDate32(termination_date) > toDate32('1900-01-01')
        AND last_check_date > termination_date
      )
      OR (
        employee_status = 'Active'
        AND (
          NOT (
            NOT (
              last_check_date IS NULL
            )
            AND toDate32(last_check_date) > toDate32('1900-01-01')
          )
          OR last_check_date < now() - INTERVAL (
            {days_since_pay}
          ) DAY
        )
      )
    )
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: days_since_pay
  type: positive_integer
  required: true
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Exception Type ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Exception Type
    direction: ASC
  allowed_columns:
  - Employee Code
  - Department
  - Status
  - Termination Date
  - Last Check Date
  - Exception Type
slots_summary: days_since_pay, department, max_rows, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.employee.last_check_date
column_formats:
  Employee Code:
    kind: identifier
  Department:
    kind: text
  Status:
    kind: text
  Termination Date:
    kind: date
  Last Check Date:
    kind: datetime
  Exception Type:
    kind: text
presentation:
  kind: table
