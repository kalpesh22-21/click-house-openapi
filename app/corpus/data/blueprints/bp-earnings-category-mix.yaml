id: bp-earnings-category-mix
intent: Category mix showing percent share of total earnings dollars and paid hours by earning category for a punch
  date window, preserving uncategorized rows
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  WITH totals AS (
    SELECT
      SUM(earn_amount) AS all_dollars,
      SUM(earn_hours) AS all_hours
    FROM dbpcm_warehouse.total_earning
    WHERE
      punch_date >= toDate({period_start}) AND punch_date < toDate({period_end})
  )
  SELECT
    ifNull(ec.category_name, 'Uncategorized') AS "Category",
    round(SUM(te.earn_amount), 2) AS "Total Dollars",
    round(SUM(te.earn_hours), 2) AS "Total Hours",
    round(
      SUM(te.earn_amount) * 100.0 / nullIf((
        SELECT
          all_dollars
        FROM totals
      ), 0),
      2
    ) AS "Dollar Pct",
    round(
      SUM(te.earn_hours) * 100.0 / nullIf((
        SELECT
          all_hours
        FROM totals
      ), 0),
      2
    ) AS "Hours Pct"
  FROM (
    SELECT
      punch_date,
      earn_amount,
      earn_hours,
      earn_code
    FROM dbpcm_warehouse.total_earning
  ) AS te
  LEFT JOIN (
    SELECT
      earn_code,
      category_name
    FROM dbpcm_warehouse.earning_category
  ) AS ec
    ON ec.earn_code = te.earn_code
  WHERE
    te.punch_date >= toDate({period_start})
    AND te.punch_date < toDate({period_end})
    AND (
      {metric} = 'dollars' OR {metric} = 'hours'
    )
  GROUP BY
    ifNull(ec.category_name, 'Uncategorized')
  ORDER BY {order_by}
slots:
- name: period
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: metric
  type: enum
  required: true
  enum_values:
  - dollars
  - hours
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Dollar Pct DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Dollar Pct
    direction: DESC
  allowed_columns:
  - Category
  - Total Dollars
  - Total Hours
  - Dollar Pct
  - Hours Pct
slots_summary: period, metric, order_by
uses:
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Category:
    kind: text
  Total Dollars:
    kind: currency
    currency: USD
  Total Hours:
    kind: number
    unit: hours
    precision: 2
  Dollar Pct:
    kind: percent
    scale: percent
    precision: 2
  Hours Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Category
  measure_columns:
  - Total Dollars
