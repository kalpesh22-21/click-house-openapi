id: bp-employee-day-clock-span
intent: Employee-day first actual clock-in, last actual clock-out and matched-pair count, with paid hours. Clock
  span may contain unpaid gaps; it is not hours worked, a single shift or a lateness finding. Days are assigned
  by recorded punch_date; midnight ownership is not inferred. Optional punch-type filters restrict which pairs contribute.
  Required half-open punch-date period and resolved table_source prevent accidental cross-source double counting.
  FINAL deduplicates storage versions, not overlapping real-world events. Department means recorded labor-allocation
  department code, not current home department. No scheduled shift, tardiness or overtime policy is inferred. Observed
  first/last dates do not prove completeness; missing days/months are not zero-filled.
slots_summary: period, source, employee, department, hours_type, pay_class, in_type, out_type
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.punch_pair.department_code
- dbpcm_warehouse.punch_pair.earn_hours
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.hours_type
- dbpcm_warehouse.punch_pair.in_punch_time
- dbpcm_warehouse.punch_pair.in_punch_type
- dbpcm_warehouse.punch_pair.out_punch_time
- dbpcm_warehouse.punch_pair.out_punch_type
- dbpcm_warehouse.punch_pair.pay_class_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.punch_pair.table_source
slots:
- name: period
  type: period_range
  temporal_type: date
  required: true
- name: source
  type: entity
  required: true
  binds_to: dbpcm_warehouse.punch_pair.table_source
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.employee_code
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.department_code
  optional_pattern: 'TRUE'
- name: hours_type
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.hours_type
  optional_pattern: 'TRUE'
- name: pay_class
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.pay_class_code
  optional_pattern: 'TRUE'
- name: in_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.in_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - ID
  - IL
  - IB
  - IX
- name: out_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.out_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - OD
  - OL
  - OB
  - OX
result_grain:
- Employee Code
- Punch Date
sql_template: 'SELECT employee_code AS `Employee Code`, punch_date AS `Punch Date`, min(in_punch_time) AS `First
  Clock In`, max(out_punch_time) AS `Last Clock Out`, count(*) AS `Pair Count`, sum(earn_hours) AS `Paid Hours`

  FROM dbpcm_warehouse.punch_pair FINAL

  WHERE punch_date >= toDate({period_start}) AND punch_date < toDate({period_end}) AND table_source = {source} AND
  employee_code = {employee} AND department_code = {department} AND hours_type = {hours_type} AND pay_class_code
  = {pay_class} AND in_punch_type = {in_type} AND out_punch_type = {out_type}

  GROUP BY employee_code, punch_date ORDER BY employee_code, punch_date'
