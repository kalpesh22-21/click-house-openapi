id: bp-rehired-employees
intent: Terminated-then-rehired employees with rehire event history — employees who left and came back, showing
  previous termination and rehire dates within a calendar window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    department_name AS "Department",
    old_termination_date AS "Old Termination Date",
    ifNull(rehire_date, most_recent_hire_date) AS "Rehire Date",
    DATE_DIFF(DAY, old_termination_date, ifNull(rehire_date, most_recent_hire_date)) AS "Days Between"
  FROM dbpcm_warehouse.employee
  WHERE
    NOT (
      old_termination_date IS NULL
    )
    AND toDate32(old_termination_date) > toDate32('1900-01-01')
    AND (
      (
        NOT (
          rehire_date IS NULL
        )
        AND toDate32(rehire_date) > toDate32('1900-01-01')
        AND rehire_date > old_termination_date
      )
      OR (
        NOT (
          most_recent_hire_date IS NULL
        )
        AND most_recent_hire_date > old_termination_date
      )
    )
    AND ifNull(rehire_date, most_recent_hire_date) >= {window_start}
    AND ifNull(rehire_date, most_recent_hire_date) < {window_end}
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Rehire Date DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Rehire Date
    direction: DESC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Old Termination Date
  - Rehire Date
  - Days Between
slots_summary: top_n, window, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.old_termination_date
- dbpcm_warehouse.employee.rehire_date
- dbpcm_warehouse.employee.most_recent_hire_date
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Old Termination Date:
    kind: datetime
  Rehire Date:
    kind: datetime
  Days Between:
    kind: number
    unit: days
    precision: 2
presentation:
  kind: table
