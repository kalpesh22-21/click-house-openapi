id: bp-approved-timeoff-hours
intent: Approved time-off hours by department or company-wide for a request-date window, counting only Approved
  status Time Off Request events
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.department_name AS "Department",
    round(SUM(t.hours), 2) AS "Approved Hours"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = t.employee_code
  WHERE
    t.status = 'Approved'
    AND t.event_type = 'Time Off Request'
    AND NOT (
      t.hours IS NULL
    )
    AND (
      toDate32(t.request_date) >= {window_start}
      AND toDate32(t.request_date) < {window_end}
    )
    AND e.department_name IN ({dept})
  GROUP BY
    e.department_name
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: dept
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Approved Hours DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Approved Hours
    direction: DESC
  allowed_columns:
  - Department
  - Approved Hours
slots_summary: top_n, window, dept, order_by
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Approved Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Approved Hours
