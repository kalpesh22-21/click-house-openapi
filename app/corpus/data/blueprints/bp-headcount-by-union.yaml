id: bp-headcount-by-union
intent: Headcount of employees by union membership — break down the workforce by union code affiliation (labor-relations
  lens)
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT ifNull(nullIf(union_code, ''), 'Unspecified') AS "Union Code",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
  GROUP BY "Union Code"
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC, "Union Code"
slots:
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.union_code
- dbpcm_warehouse.employee.employee_status
column_formats:
  Union Code:
    kind: identifier
  Headcount:
    kind: integer
