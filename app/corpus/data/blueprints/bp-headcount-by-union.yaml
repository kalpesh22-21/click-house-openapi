id: bp-headcount-by-union
intent: Headcount of employees by union membership — break down the workforce by union code affiliation (labor-relations
  lens)
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    ifNull(nullIf(union_code, ''), 'Unspecified') AS "Union Code",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
  GROUP BY
    "Union Code"
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Union Code
  - Headcount
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.union_code
- dbpcm_warehouse.employee.employee_status
column_formats:
  Union Code:
    kind: identifier
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Union Code
  measure_columns:
  - Headcount
