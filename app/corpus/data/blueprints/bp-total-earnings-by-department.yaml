id: bp-total-earnings-by-department
intent: Total earnings for a department, resolving the earnings register codes dynamically
slots_summary: top_n, department, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: department
  type: string
  required: true
  binds_to: dbpcm_warehouse.department.department_name
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Earnings
    direction: DESC
  allowed_columns:
  - Department
  - Total Earnings
uses_rules:
- id: gross_earnings
  resolve_via: resolveValues(register_type, 'earnings')
  table: dbpcm_warehouse.payroll
  binds: earn_codes
result_grain:
- Department
sql_template: |+
  SELECT
    e.department_name AS "Department",
    SUM(p.amount) AS "Total Earnings"
  FROM dbpcm_warehouse.payroll AS p
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = p.employee_code
  WHERE
    p.register_type IN {earn_codes} AND e.department_name IN ({department})
  GROUP BY
    e.department_name
  ORDER BY {order_by}
  LIMIT {top_n}

column_formats:
  Department:
    kind: text
  Total Earnings:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Total Earnings
