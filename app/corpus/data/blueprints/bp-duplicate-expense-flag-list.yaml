id: bp-duplicate-expense-flag-list
intent: Expenses flagged as potential duplicates for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT employee_code AS "Employee Code",
         round(toFloat64(SUM(amount_approved)), 2) AS "Flagged Amount",
         count() AS "Flagged Expenses"
  FROM dbpcm_warehouse.expense
  WHERE potential_duplicate_expense = 'Yes'
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
  GROUP BY employee_code
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Flagged Amount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Flagged Amount"
                     END ASC, "Employee Code"
  LIMIT {max_rows}
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: expense_window, max_rows, order_direction
uses:
- dbpcm_warehouse.expense.potential_duplicate_expense
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.employee_code
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Employee Code:
    kind: identifier
  Flagged Amount:
    kind: currency
    currency: USD
    precision: 2
  Flagged Expenses:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Employee Code
  measure_columns:
  - Flagged Amount
