id: bp-headcount-by-works-in-state
intent: Active headcount per works-in state with a lives-elsewhere breakdown
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT works_in_state AS "Works In State",
         count(DISTINCT employee_code) AS "Headcount",
         countIf(lives_in_state IS NOT NULL
                 AND lives_in_state != ''
                 AND lives_in_state != works_in_state) AS "Lives Elsewhere"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND works_in_state = {work_state}
  GROUP BY works_in_state
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC
slots:
- name: work_state
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.works_in_state
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: work_state, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.works_in_state
- dbpcm_warehouse.employee.lives_in_state
- dbpcm_warehouse.employee.employee_status
