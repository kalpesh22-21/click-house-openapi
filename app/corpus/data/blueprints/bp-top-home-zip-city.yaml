id: bp-top-home-zip-city
intent: Top-N employee home zip codes by active headcount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT primary_zip_postal_code AS "Zip Code",
         any(primary_city_municipality) AS "City",
         any(primary_state_province) AS "State",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND primary_zip_postal_code IS NOT NULL
    AND primary_zip_postal_code != ''
  GROUP BY primary_zip_postal_code
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC, "Zip Code"
  LIMIT {top_n}
slots:
- name: top_n
  type: relative_window
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: top_n, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.primary_zip_postal_code
- dbpcm_warehouse.employee.primary_city_municipality
- dbpcm_warehouse.employee.primary_state_province
- dbpcm_warehouse.employee.employee_status
column_formats:
  Zip Code:
    kind: identifier
  City:
    kind: text
  State:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Zip Code
  measure_columns:
  - Headcount
