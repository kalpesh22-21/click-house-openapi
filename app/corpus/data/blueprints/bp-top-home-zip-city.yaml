id: bp-top-home-zip-city
intent: Top-N employee home zip codes by active headcount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    primary_zip_postal_code AS "Zip Code",
    any(primary_city_municipality) AS "City",
    any(primary_state_province) AS "State",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND NOT (
      primary_zip_postal_code IS NULL
    )
    AND primary_zip_postal_code <> ''
  GROUP BY
    primary_zip_postal_code
  ORDER BY
    "Headcount" DESC,
    "Zip Code"
  LIMIT {top_n}
slots:
- name: top_n
  type: relative_window
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
slots_summary: top_n
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.primary_zip_postal_code
- dbpcm_warehouse.employee.primary_city_municipality
- dbpcm_warehouse.employee.primary_state_province
- dbpcm_warehouse.employee.employee_status
column_formats:
  Zip Code:
    kind: identifier
  City:
    kind: text
  State:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Zip Code
  measure_columns:
  - Headcount
