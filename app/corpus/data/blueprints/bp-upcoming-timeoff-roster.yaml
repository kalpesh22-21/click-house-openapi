id: bp-upcoming-timeoff-roster
intent: Roster of employees with approved time-off requests in the next N days for coverage planning, optionally
  filtered by department
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    t.employee_code AS "Employee Code",
    any(e.employee_name) AS "Employee Name",
    any(e.department_name) AS "Department",
    toDate32(t.request_date) AS "Request Date",
    t.earn_description AS "Leave Type",
    round(SUM(t.hours), 2) AS "Hours"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = t.employee_code
  WHERE
    t.status = 'Approved'
    AND t.event_type IN ({event_type})
    AND toDate32(t.request_date) >= today()
    AND toDate32(t.request_date) <= today() + INTERVAL (
      {win}
    ) DAY
    AND e.department_name IN ({dept})
  GROUP BY
    t.employee_code,
    toDate32(t.request_date),
    t.earn_description
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: win
  type: relative_window
  required: true
- name: dept
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Request Date ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Request Date
    direction: ASC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Request Date
  - Leave Type
  - Hours
slots_summary: top_n, win, dept, event_type, order_by
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.earn_description
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Request Date:
    kind: date
  Leave Type:
    kind: text
  Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: table
