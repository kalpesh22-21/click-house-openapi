id: bp-expense-line-size-distribution
intent: Size distribution of approved expense amounts in fixed amount bands for a payment date window, one row per
  band in amount order. Expenses without an approved amount are excluded. Optional single-account filter.
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT concat('$', toString(toInt32(floor(toFloat64(amount_approved) / {band}) * {band})), ' to under $', toString(toInt32(floor(toFloat64(amount_approved) / {band}) * {band} + {band}))) AS "Amount Band",
         count() AS "Expense Count"
  FROM dbpcm_warehouse.expense
  WHERE expense_status IN ('Approved',
                           'Paid',
                           'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date <= {expense_window_end}
    AND amount_approved IS NOT NULL
    AND expense_account_description = {account}
  GROUP BY floor(toFloat64(amount_approved) / {band})
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN floor(toFloat64(amount_approved) / {band})
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN floor(toFloat64(amount_approved) / {band})
                     END ASC
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
- name: band
  type: positive_integer
  required: true
  description: Whole-dollar band width. Use the requested width; otherwise choose one that gives roughly 10 to 25 bands.
- name: account
  type: entity
  required: false
  binds_to: dbpcm_warehouse.expense.expense_account_description
  optional_pattern: 'TRUE'
  description: Omit for all accounts. Bind one expense account description to show that account's line sizes only.
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the amount bands. Defaults to ASC (smallest band first).
result_grain:
- Amount Band
slots_summary: expense_window, band, account, order_direction
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_account_description
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Amount Band:
    kind: text
  Expense Count:
    kind: integer
