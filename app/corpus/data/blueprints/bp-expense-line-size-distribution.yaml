id: bp-expense-line-size-distribution
intent: Size distribution of approved expense amounts in fixed amount bands for a payment date window, one row per
  band in amount order. Expenses without an approved amount are excluded. Optional single-account filter.
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    CONCAT(
      '$',
      toString(toInt32(FLOOR(toFloat64(amount_approved) / {band}) * {band})),
      ' to under $',
      toString(toInt32(FLOOR(toFloat64(amount_approved) / {band}) * {band} + {band}))
    ) AS "Amount Band",
    count() AS "Expense Count",
    toInt32(FLOOR(toFloat64(amount_approved) / {band}) * {band}) AS "Band Start"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
    AND NOT (
      amount_approved IS NULL
    )
    AND expense_account_description IN ({account})
  GROUP BY
    FLOOR(toFloat64(amount_approved) / {band})
  ORDER BY {order_by}
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: band
  type: positive_integer
  required: true
  description: Whole-dollar band width. Use the requested width; otherwise choose one that gives roughly 10 to 25
    bands.
- name: account
  type: entity
  required: false
  binds_to: dbpcm_warehouse.expense.expense_account_description
  optional_pattern: 'TRUE'
  description: Omit for all accounts. Bind one expense account description to show that account's line sizes only.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Band Start ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Band Start
    direction: ASC
  allowed_columns:
  - Amount Band
  - Expense Count
  - Band Start
result_grain:
- Amount Band
slots_summary: expense_window, band, account, order_by
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_account_description
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Amount Band:
    kind: text
  Expense Count:
    kind: integer
  Band Start:
    kind: number
presentation:
  kind: bars
  category_columns:
  - Amount Band
  measure_columns:
  - Expense Count
