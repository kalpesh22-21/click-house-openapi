id: bp-unused-leave-roster
intent: Employees holding positive accrual balances who have zero approved time-off requests year-to-date
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    b.employee_code AS "Employee Code",
    any(e.employee_name) AS "Employee Name",
    any(e.department_name) AS "Department",
    round(SUM(b.beginning_balance + b.accrued_amount - b.taken_amount), 2) AS "Balance Hours"
  FROM dbpcm_warehouse.time_off_balance AS b
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = b.employee_code
  WHERE
    b.beginning_balance + b.accrued_amount - b.taken_amount > 0
    AND NOT (
      b.employee_code IN (
        SELECT DISTINCT
          employee_code
        FROM dbpcm_warehouse.time_off_request
        WHERE
          status = 'Approved'
          AND event_type IN ({event_type})
          AND NOT (
            request_date IS NULL
          )
          AND toDate32(request_date) >= dateTrunc('YEAR', today())
      )
    )
  GROUP BY
    b.employee_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Balance Hours DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Balance Hours
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Balance Hours
slots_summary: top_n, event_type, order_by
uses:
- dbpcm_warehouse.time_off_balance.employee_code
- dbpcm_warehouse.time_off_balance.beginning_balance
- dbpcm_warehouse.time_off_balance.accrued_amount
- dbpcm_warehouse.time_off_balance.taken_amount
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Balance Hours:
    kind: number
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Employee Name
  measure_columns:
  - Balance Hours
