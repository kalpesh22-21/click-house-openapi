id: bp-expense-per-capita
intent: Per-capita approved expense spend by department for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    COALESCE(e.department_name, x.department_description) AS "Department",
    round(toFloat64(SUM(x.amount_approved)), 2) AS "Approved Spend",
    count(DISTINCT e.employee_code) AS "Active Headcount",
    round(toFloat64(SUM(x.amount_approved)) / nullIf(count(DISTINCT e.employee_code), 0), 2) AS "Per Capita Spend"
  FROM dbpcm_warehouse.expense AS x
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = x.employee_code AND e.employee_status = 'Active'
  WHERE
    x.expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND x.expense_paid_date >= {expense_window_start}
    AND x.expense_paid_date < {expense_window_end}
  GROUP BY
    COALESCE(e.department_name, x.department_description)
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Per Capita Spend DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Per Capita Spend
    direction: DESC
  allowed_columns:
  - Department
  - Approved Spend
  - Active Headcount
  - Per Capita Spend
slots_summary: top_n, expense_window, order_by
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
- dbpcm_warehouse.expense.department_description
- dbpcm_warehouse.expense.employee_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Department:
    kind: text
  Approved Spend:
    kind: currency
    currency: USD
    precision: 2
  Active Headcount:
    kind: integer
  Per Capita Spend:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Approved Spend
