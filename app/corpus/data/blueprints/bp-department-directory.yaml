id: bp-department-directory
intent: Complete department dictionary with codes, names, active headcount and total headcount including zero-employee
  departments
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    d.department_code AS "Department Code",
    d.department_name AS "Department",
    countIf(e.employee_status = 'Active') AS "Active Headcount",
    count(DISTINCT e.employee_code) AS "Total Headcount"
  FROM dbpcm_warehouse.department AS d
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON e.department_code = d.department_code
  GROUP BY
    d.department_code,
    d.department_name
  ORDER BY {order_by}
slots:
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Department ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Department
    direction: ASC
  allowed_columns:
  - Department Code
  - Department
  - Active Headcount
  - Total Headcount
slots_summary: order_by
uses:
- dbpcm_warehouse.department.department_code
- dbpcm_warehouse.department.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_code
column_formats:
  Department Code:
    kind: identifier
  Department:
    kind: text
  Active Headcount:
    kind: integer
  Total Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Active Headcount
