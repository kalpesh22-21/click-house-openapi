id: bp-expense-cycle-time
intent: Median expense reimbursement cycle time by month, submission to approval and approval to payment
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(dateTrunc('MONTH', expense_paid_date), '%Y-%m') AS "Month",
    count() AS "Expense Count",
    round(
      (
        quantileExactLow(0.5)(DATE_DIFF(DAY, date_time_submitted, approved_date)) + quantileExactHigh(0.5)(DATE_DIFF(DAY, date_time_submitted, approved_date))
      ) / 2,
      1
    ) AS "Median Submission To Approval",
    round(
      (
        quantileExactLow(0.5)(DATE_DIFF(DAY, approved_date, expense_paid_date)) + quantileExactHigh(0.5)(DATE_DIFF(DAY, approved_date, expense_paid_date))
      ) / 2,
      1
    ) AS "Median Approval To Payment"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND NOT (
      date_time_submitted IS NULL
    )
    AND toDate32(date_time_submitted) > toDate32('1900-01-01')
    AND NOT (
      approved_date IS NULL
    )
    AND toDate32(approved_date) > toDate32('1900-01-01')
    AND NOT (
      expense_paid_date IS NULL
    )
    AND toDate32(expense_paid_date) > toDate32('1900-01-01')
    AND expense_paid_date >= (
      SELECT
        addMonths(dateTrunc('MONTH', max(expense_paid_date)), -{window_months})
      FROM dbpcm_warehouse.expense
      WHERE
        expense_status IN ('Approved', 'Paid', 'Marked as Paid')
        AND NOT (
          expense_paid_date IS NULL
        )
        AND toDate32(expense_paid_date) > toDate32('1900-01-01')
    )
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: window_months
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Expense Count
  - Median Submission To Approval
  - Median Approval To Payment
slots_summary: window_months, order_by
uses:
- dbpcm_warehouse.expense.date_time_submitted
- dbpcm_warehouse.expense.approved_date
- dbpcm_warehouse.expense.expense_paid_date
- dbpcm_warehouse.expense.expense_status
column_formats:
  Month:
    kind: text
  Expense Count:
    kind: integer
  Median Submission To Approval:
    kind: number
    unit: days
    precision: 2
  Median Approval To Payment:
    kind: number
    unit: days
    precision: 2
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Expense Count
  - Median Submission To Approval
  - Median Approval To Payment
