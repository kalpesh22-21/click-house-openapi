id: bp-headcount-by-hire-era
intent: Active headcount and average tenure split by hire era around a supplied window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    multiIf(
      hire_date < {era_window_start},
      'Pre Era',
      hire_date < {era_window_end},
      'Era',
      'Post Era'
    ) AS "Hire Era",
    count(DISTINCT employee_code) AS "Headcount",
    round(avg(DATE_DIFF(DAY, hire_date, now()) / 365.25), 1) AS "Avg Tenure Years"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
  GROUP BY
    "Hire Era"
  ORDER BY {order_by}
slots:
- name: era_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Hire Era ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Hire Era
    direction: ASC
  allowed_columns:
  - Hire Era
  - Headcount
  - Avg Tenure Years
slots_summary: era_window, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.employee_status
column_formats:
  Hire Era:
    kind: text
  Headcount:
    kind: integer
  Avg Tenure Years:
    kind: number
    unit: years
    precision: 2
presentation:
  kind: donut
  category_columns:
  - Hire Era
  measure_columns:
  - Headcount
