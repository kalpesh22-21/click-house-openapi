id: bp-punch-coverage-gap
intent: Coverage metric showing the share of active employees who had at least one punch in the last N days, with
  counts of punchers and non-punchers
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    count(DISTINCT e.employee_code) AS "Active Employees",
    count(DISTINCT pp.employee_code) AS "Employees With Punches",
    count(DISTINCT e.employee_code) - count(DISTINCT pp.employee_code) AS "Employees Without Punches",
    round(
      100.0 * count(DISTINCT pp.employee_code) / nullIf(count(DISTINCT e.employee_code), 0),
      2
    ) AS "Coverage Pct"
  FROM dbpcm_warehouse.employee AS e
  LEFT JOIN (
    SELECT DISTINCT
      employee_code
    FROM dbpcm_warehouse.punch_pair
    WHERE
      punch_date >= today() - {win}
  ) AS pp
    ON pp.employee_code = e.employee_code
  WHERE
    e.employee_status = 'Active'
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Active Employees ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Active Employees
    direction: ASC
  allowed_columns:
  - Active Employees
  - Employees With Punches
  - Employees Without Punches
  - Coverage Pct
slots_summary: win, order_by
uses:
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
column_formats:
  Active Employees:
    kind: integer
  Employees With Punches:
    kind: integer
  Employees Without Punches:
    kind: integer
  Coverage Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: facts
  measure_columns:
  - Active Employees
  - Employees With Punches
  - Employees Without Punches
  - Coverage Pct
