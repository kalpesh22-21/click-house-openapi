id: bp-employee-tenure-summary
intent: Elapsed years from original or most recent hire date to a supplied ISO YYYY-MM-DD reference_date, using
  calendar days / 365.25. Company/department/current-status groups, average/min/max and valid-date count. Excludes
  NULL, dates at/before 1900-01-01 and future hire dates. all-status elapsed time does NOT stop at termination and
  is not historical active headcount. Date is explicit, not inferred from today. Defaults to Active + On Leave;
  employee_status selects another status or All to remove the filter.
slots_summary: group_by, hire_basis, reference_date, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
- name: hire_basis
  type: enum
  required: true
  enum_values:
  - original_hire
  - most_recent_hire
- name: reference_date
  type: string
  temporal_type: date
  required: true
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: e.employee_status IN ('Active', 'On Leave')
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Group
sql_template: |
  SELECT CASE {group_by}
             WHEN 'department' THEN e.department_name
             WHEN 'status' THEN e.employee_status
             ELSE 'Company'
         END AS `Group`,
         count(*) AS `Valid Hire Date Count`,
         avg(dateDiff('day', CASE {hire_basis}
                                 WHEN 'most_recent_hire' THEN e.most_recent_hire_date
                                 ELSE e.hire_date
                             END, toDate({reference_date})) / 365.25) AS `Average Elapsed Years`,
         min(dateDiff('day', CASE {hire_basis}
                                 WHEN 'most_recent_hire' THEN e.most_recent_hire_date
                                 ELSE e.hire_date
                             END, toDate({reference_date})) / 365.25) AS `Minimum Elapsed Years`,
         max(dateDiff('day', CASE {hire_basis}
                                 WHEN 'most_recent_hire' THEN e.most_recent_hire_date
                                 ELSE e.hire_date
                             END, toDate({reference_date})) / 365.25) AS `Maximum Elapsed Years`
  FROM dbpcm_warehouse.employee e
  WHERE (e.employee_status = {employee_status}
         OR {employee_status} = 'All')
    AND e.department_name = {department}
    AND e.employee_code = {employee}
    AND (CASE {hire_basis}
             WHEN 'most_recent_hire' THEN e.most_recent_hire_date
             ELSE e.hire_date
         END) > toDate('1900-01-01')
    AND (CASE {hire_basis}
             WHEN 'most_recent_hire' THEN e.most_recent_hire_date
             ELSE e.hire_date
         END) <= toDate({reference_date})
  GROUP BY CASE {group_by}
               WHEN 'department' THEN e.department_name
               WHEN 'status' THEN e.employee_status
               ELSE 'Company'
           END
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN `Group`
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN `Group`
                     END ASC
column_formats:
  Group:
    kind: text
  Valid Hire Date Count:
    kind: integer
  Average Elapsed Years:
    kind: number
    unit: years
    precision: 2
  Minimum Elapsed Years:
    kind: number
    unit: years
    precision: 2
  Maximum Elapsed Years:
    kind: number
    unit: years
    precision: 2
