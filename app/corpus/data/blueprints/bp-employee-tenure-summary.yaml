id: bp-employee-tenure-summary
intent: Elapsed years from original or most recent hire date to a supplied ISO YYYY-MM-DD reference_date, using
  calendar days / 365.25. Company/department/current-status groups, average/min/max and valid-date count. Excludes
  NULL, dates at/before 1900-01-01 and future hire dates. all-status elapsed time does NOT stop at termination and
  is not historical active headcount. Date is explicit, not inferred from today. Defaults to Active + On Leave;
  employee_status selects another status or All to remove the filter.
slots_summary: group_by, hire_basis, reference_date, employee_status, department, employee, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
- name: hire_basis
  type: enum
  required: true
  enum_values:
  - original_hire
  - most_recent_hire
- name: reference_date
  type: string
  temporal_type: date
  required: true
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Group
    direction: ASC
  allowed_columns:
  - Group
  - Valid Hire Date Count
  - Average Elapsed Years
  - Minimum Elapsed Years
  - Maximum Elapsed Years
result_grain:
- Group
sql_template: |
  SELECT
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN e.employee_status
      ELSE 'Company'
    END AS "Group",
    count(*) AS "Valid Hire Date Count",
    avg(
      DATE_DIFF(
        DAY,
        CASE
          WHEN {hire_basis} = 'most_recent_hire'
          THEN e.most_recent_hire_date
          ELSE e.hire_date
        END,
        toDate({reference_date})
      ) / 365.25
    ) AS "Average Elapsed Years",
    min(
      DATE_DIFF(
        DAY,
        CASE
          WHEN {hire_basis} = 'most_recent_hire'
          THEN e.most_recent_hire_date
          ELSE e.hire_date
        END,
        toDate({reference_date})
      ) / 365.25
    ) AS "Minimum Elapsed Years",
    max(
      DATE_DIFF(
        DAY,
        CASE
          WHEN {hire_basis} = 'most_recent_hire'
          THEN e.most_recent_hire_date
          ELSE e.hire_date
        END,
        toDate({reference_date})
      ) / 365.25
    ) AS "Maximum Elapsed Years"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    (
      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
    AND e.department_name IN ({department})
    AND e.employee_code = {employee}
    AND (
      CASE
        WHEN {hire_basis} = 'most_recent_hire'
        THEN e.most_recent_hire_date
        ELSE e.hire_date
      END
    ) > toDate('1900-01-01')
    AND (
      CASE
        WHEN {hire_basis} = 'most_recent_hire'
        THEN e.most_recent_hire_date
        ELSE e.hire_date
      END
    ) <= toDate({reference_date})
  GROUP BY
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN e.employee_status
      ELSE 'Company'
    END
  ORDER BY {order_by}
column_formats:
  Group:
    kind: text
  Valid Hire Date Count:
    kind: integer
  Average Elapsed Years:
    kind: number
    unit: years
    precision: 2
  Minimum Elapsed Years:
    kind: number
    unit: years
    precision: 2
  Maximum Elapsed Years:
    kind: number
    unit: years
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Group
  measure_columns:
  - Valid Hire Date Count
  by_group_by:
    company: figure
