id: bp-dol-status-per-work-location
intent: Pivoted Full Time / Part Time / Seasonal / None active counts per work location
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT work_location_description AS "Work Location",
         countIf(dol_status_description = 'Full Time') AS "Full Time",
         countIf(dol_status_description = 'Part Time') AS "Part Time",
         countIf(dol_status_description = 'Seasonal') AS "Seasonal",
         countIf(dol_status_description = 'None') AS "None",
         count(*) AS "Total"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND work_location_description = {location}
  GROUP BY work_location_description
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Total"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Total"
                     END ASC
slots:
- name: location
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.work_location_description
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: location, order_direction
uses:
- dbpcm_warehouse.employee.work_location_description
- dbpcm_warehouse.employee.dol_status_description
- dbpcm_warehouse.employee.employee_status
column_formats:
  Work Location:
    kind: text
  Full Time:
    kind: integer
  Part Time:
    kind: integer
  Seasonal:
    kind: integer
  None:
    kind: integer
  Total:
    kind: integer
