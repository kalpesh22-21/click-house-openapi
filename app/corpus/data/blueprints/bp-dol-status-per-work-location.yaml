id: bp-dol-status-per-work-location
intent: Pivoted Full Time / Part Time / Seasonal / None active counts per work location
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    work_location_description AS "Work Location",
    countIf(dol_status_description = 'Full Time') AS "Full Time",
    countIf(dol_status_description = 'Part Time') AS "Part Time",
    countIf(dol_status_description = 'Seasonal') AS "Seasonal",
    countIf(dol_status_description = 'None') AS "None",
    count(*) AS "Total"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND work_location_description IN ({location})
  GROUP BY
    work_location_description
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: location
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.work_location_description
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total
    direction: DESC
  allowed_columns:
  - Work Location
  - Full Time
  - Part Time
  - Seasonal
  - None
  - Total
slots_summary: top_n, location, order_by
uses:
- dbpcm_warehouse.employee.work_location_description
- dbpcm_warehouse.employee.dol_status_description
- dbpcm_warehouse.employee.employee_status
column_formats:
  Work Location:
    kind: text
  Full Time:
    kind: integer
  Part Time:
    kind: integer
  Seasonal:
    kind: integer
  None:
    kind: integer
  Total:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Work Location
  measure_columns:
  - Full Time
