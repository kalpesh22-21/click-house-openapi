id: bp-hires-projection
intent: Projected number of hires over the next N months at the current hiring pace (run-rate over a trailing window)
  — counts by original hire date; rehires are not re-counted
slots_summary: window_months, horizon_months
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.hire_date
- dbpcm_warehouse.employee.employee_status
slots:
- name: window_months
  type: relative_window
  required: true
  min_value: 2
  max_value: 36
- name: horizon_months
  type: relative_window
  required: true
  min_value: 1
  max_value: 24
result_grain: []
window_anchor: data
sql_template: |
  SELECT COUNT(DISTINCT employee_code) AS "Hires In Window",
         round(COUNT(DISTINCT employee_code) / {window_months}, 1) AS "Average Monthly Hires",
         round(COUNT(DISTINCT employee_code) / {window_months} * {horizon_months}) AS "Projected Hires"
  FROM dbpcm_warehouse.employee
  WHERE hire_date >= addMonths(
                                 (SELECT toStartOfMonth(max(hire_date))
                                  FROM dbpcm_warehouse.employee
                                  WHERE employee_status != 'N'
                                    OR employee_status IS NULL), 1) - INTERVAL {window_months} MONTH
    AND (employee_status != 'N'
         OR employee_status IS NULL)
column_formats:
  Hires In Window:
    kind: integer
  Average Monthly Hires:
    kind: number
  Projected Hires:
    kind: number
presentation:
  kind: facts
  measure_columns:
  - Hires In Window
  - Average Monthly Hires
  - Projected Hires
