id: bp-overtime-hours-dollars
intent: Overtime dollars and hours by department from timecard earnings, resolved via the Overtime earning category,
  for a date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    e.department_name AS "Department",
    round(SUM(te.earn_amount), 2) AS "Overtime Dollars",
    round(SUM(te.earn_hours), 2) AS "Overtime Hours"
  FROM (
    SELECT
      punch_date,
      earn_amount,
      earn_hours,
      earn_code,
      employee_code
    FROM dbpcm_warehouse.total_earning
  ) AS te
  JOIN (
    SELECT
      earn_code,
      category_name
    FROM dbpcm_warehouse.earning_category
  ) AS ec
    ON ec.earn_code = te.earn_code
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = te.employee_code
  WHERE
    ec.category_name = 'Overtime'
    AND (
      te.punch_date >= {period_start} AND te.punch_date < {period_end}
    )
  GROUP BY
    e.department_name
  ORDER BY {order_by}
slots:
- name: period
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Overtime Dollars DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Overtime Dollars
    direction: DESC
  allowed_columns:
  - Department
  - Overtime Dollars
  - Overtime Hours
slots_summary: period, order_by
uses:
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Overtime Dollars:
    kind: currency
    currency: USD
  Overtime Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Overtime Dollars
