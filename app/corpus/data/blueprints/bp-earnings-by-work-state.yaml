id: bp-earnings-by-work-state
intent: Gross earnings by employee works-in-state for a pay period, with optional state filter, reflecting tax-situs
  work location
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.works_in_state AS "Work State",
    round(SUM(p.amount), 2) AS "Gross Earnings"
  FROM dbpcm_warehouse.payroll AS p
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = p.employee_code
  WHERE
    p.register_type = 'EARN'
    AND p.pay_period_end_date = {period}
    AND e.works_in_state IN ({state})
  GROUP BY
    e.works_in_state
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: state
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.works_in_state
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Gross Earnings DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Gross Earnings
    direction: DESC
  allowed_columns:
  - Work State
  - Gross Earnings
slots_summary: top_n, period, state, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.works_in_state
column_formats:
  Work State:
    kind: text
  Gross Earnings:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - Work State
  measure_columns:
  - Gross Earnings
