id: bp-future-termination-roster
intent: Employees with future termination dates already on the roster, upcoming planned departures
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    department_name AS "Department",
    employee_status AS "Status",
    termination_date AS "Termination Date"
  FROM dbpcm_warehouse.employee
  WHERE
    NOT (
      termination_date IS NULL
    )
    AND toDate32(termination_date) > toDate32('1900-01-01')
    AND termination_date > now()
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Termination Date ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Termination Date
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Status
  - Termination Date
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.termination_date
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Status:
    kind: text
  Termination Date:
    kind: date
presentation:
  kind: table
