id: bp-expenses-unreconciled-to-payroll
intent: Paid expenses that lack a payroll transaction tie for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT expense_status AS "Expense Status",
         count() AS "Line Count",
         round(toFloat64(SUM(amount_approved)), 2) AS "Total Amount"
  FROM dbpcm_warehouse.expense
  WHERE expense_status = 'Paid'
    AND payroll_transaction_number = ''
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date <= {expense_window_end}
  GROUP BY expense_status
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Total Amount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Total Amount"
                     END ASC
  LIMIT {max_rows}
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
- name: max_rows
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: expense_window, max_rows, order_direction
uses:
- dbpcm_warehouse.expense.payroll_transaction_number
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
