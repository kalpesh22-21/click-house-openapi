id: bp-expenses-unreconciled-to-payroll
intent: Paid expenses that lack a payroll transaction tie for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    expense_status AS "Expense Status",
    count() AS "Expense Count",
    round(toFloat64(SUM(amount_approved)), 2) AS "Total Amount"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_status = 'Paid'
    AND payroll_transaction_number = ''
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
  GROUP BY
    expense_status
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Amount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Amount
    direction: DESC
  allowed_columns:
  - Expense Status
  - Expense Count
  - Total Amount
slots_summary: expense_window, max_rows, order_by
uses:
- dbpcm_warehouse.expense.payroll_transaction_number
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Expense Status:
    kind: text
  Expense Count:
    kind: integer
  Total Amount:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Expense Status
  measure_columns:
  - Expense Count
