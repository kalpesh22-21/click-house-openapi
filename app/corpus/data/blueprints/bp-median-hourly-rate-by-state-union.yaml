id: bp-median-hourly-rate-by-state-union
intent: True median base hourly rate per works-in state and union flag for active employees
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    works_in_state AS "Works In State",
    multiIf(union_code IS NULL OR union_code = '', 'Non-Union', 'Union') AS "Union Flag",
    round(
      (
        quantileExactLow(0.5)(toFloat64(rate_1)) + quantileExactHigh(0.5)(toFloat64(rate_1))
      ) / 2,
      2
    ) AS "Median Hourly Rate",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND rate_1 > 0 AND works_in_state IN ({work_state})
  GROUP BY
    works_in_state,
    "Union Flag"
  ORDER BY {order_by}
slots:
- name: work_state
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.works_in_state
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Works In State ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Works In State
    direction: ASC
  allowed_columns:
  - Works In State
  - Union Flag
  - Median Hourly Rate
  - Headcount
slots_summary: work_state, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.works_in_state
- dbpcm_warehouse.employee.union_code
- dbpcm_warehouse.employee.rate_1
- dbpcm_warehouse.employee.employee_status
column_formats:
  Works In State:
    kind: text
  Union Flag:
    kind: text
  Median Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
  Headcount:
    kind: integer
presentation:
  kind: table
