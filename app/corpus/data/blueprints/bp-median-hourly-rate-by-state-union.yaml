id: bp-median-hourly-rate-by-state-union
intent: True median base hourly rate per works-in state and union flag for active employees
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT works_in_state AS "Works In State",
         multiIf(union_code IS NULL
                 OR union_code = '', 'Non-Union', 'Union') AS "Union Flag",
         round((quantileExactLow(0.5)(toFloat64(rate_1)) + quantileExactHigh(0.5)(toFloat64(rate_1))) / 2, 2) AS "Median Hourly Rate",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND rate_1 > 0
    AND works_in_state = {work_state}
  GROUP BY works_in_state,
           "Union Flag"
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN works_in_state
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN works_in_state
                     END ASC, "Union Flag"
slots:
- name: work_state
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.works_in_state
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
slots_summary: work_state, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.works_in_state
- dbpcm_warehouse.employee.union_code
- dbpcm_warehouse.employee.rate_1
- dbpcm_warehouse.employee.employee_status
