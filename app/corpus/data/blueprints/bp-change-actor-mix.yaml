id: bp-change-actor-mix
intent: Monthly counts of employee master-data changes grouped by the actor user type, distinguishing client administrators
  from employee users and regular users
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  -- Output aliases are Title-Case display names; consumers keying on column names
  -- must use the quoted aliases.

  SELECT formatDateTime(toStartOfMonth(change_time_added), '%Y-%m') AS "Month",
         change_by_usertype AS "User Type",
         count() AS "Change Events"
  FROM dbpcm_warehouse.employee_change
  WHERE change_time_added >= addMonths(today(), -{win})
  GROUP BY "Month",
           change_by_usertype
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Change Events"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Change Events"
                     END ASC, "Month",
                              "User Type"
  LIMIT {max_rows}
slots:
- name: win
  type: relative_window
  required: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: win, max_rows, order_direction
uses:
- dbpcm_warehouse.employee_change.change_by_usertype
- dbpcm_warehouse.employee_change.change_time_added
column_formats:
  Month:
    kind: text
  User Type:
    kind: text
  Change Events:
    kind: integer
