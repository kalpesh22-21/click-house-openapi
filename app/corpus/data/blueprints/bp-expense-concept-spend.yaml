id: bp-expense-concept-spend
intent: Expense spend matched to a user-supplied concept via rule or account descriptions for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    coalesce(expense_rule_description, expense_account_description) AS "Matched Description",
    round(toFloat64(SUM(amount_approved)), 2) AS "Approved Spend"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
    AND (
      expense_rule_description ILIKE CONCAT('%', {concept}, '%')
      OR expense_account_description ILIKE CONCAT('%', {concept}, '%')
    )
  GROUP BY
    coalesce(expense_rule_description, expense_account_description)
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: concept
  type: string
  required: true
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Approved Spend DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Approved Spend
    direction: DESC
  allowed_columns:
  - Matched Description
  - Approved Spend
slots_summary: concept, expense_window, max_rows, order_by
uses:
- dbpcm_warehouse.expense.expense_account_description
- dbpcm_warehouse.expense.expense_rule_description
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Matched Description:
    kind: text
  Approved Spend:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Matched Description
  measure_columns:
  - Approved Spend
