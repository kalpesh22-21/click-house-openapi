id: bp-workforce-composition
intent: Active workforce composition by employment type and DOL status with percent share of active headcount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    employment_type AS "Employment Type",
    dol_status_description AS "DOL Status",
    count(DISTINCT employee_code) AS "Headcount",
    round(
      100 * count(DISTINCT employee_code) / sum(count(DISTINCT employee_code)) OVER (),
      2
    ) AS "Share Pct"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND department_name IN ({department})
  GROUP BY
    employment_type,
    dol_status_description
  ORDER BY {order_by}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Employment Type
  - DOL Status
  - Headcount
  - Share Pct
slots_summary: department, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employment_type
- dbpcm_warehouse.employee.dol_status_description
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employment Type:
    kind: text
  DOL Status:
    kind: text
  Headcount:
    kind: integer
  Share Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: table
