id: bp-holiday-work-audit
intent: Total paid hours and employee counts on company-observed holiday dates from total_earning using runtime-resolved
  holiday earn codes
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    te.punch_date AS "Punch Date",
    count(DISTINCT te.employee_code) AS "Employees",
    round(SUM(te.earn_hours), 2) AS "Total Hours"
  FROM (
    SELECT
      employee_code,
      punch_date,
      earn_hours,
      earn_code
    FROM dbpcm_warehouse.total_earning
  ) AS te
  WHERE
    (
      te.punch_date >= {window_start} AND te.punch_date < {window_end}
    )
    AND te.earn_code IN ({concept})
  GROUP BY
    te.punch_date
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: concept
  type: string
  required: true
  binds_to: dbpcm_warehouse.total_earning.earn_code
  multiple: true
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Hours DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Hours
    direction: DESC
  allowed_columns:
  - Punch Date
  - Employees
  - Total Hours
slots_summary: concept, window, max_rows, order_by
uses:
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
column_formats:
  Punch Date:
    kind: date
  Employees:
    kind: integer
  Total Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: line
  category_columns:
  - Punch Date
  measure_columns:
  - Employees
  - Total Hours
