id: bp-employee-coverage-matrix
intent: Multi-source employee coverage matrix showing which employees have roster entries, punch pairs, payroll
  lines, and timecard earnings, ordered by coverage gap count descending
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  WITH punchers AS (
    SELECT DISTINCT
      employee_code AS employee_code,
      1 AS has_punches
    FROM dbpcm_warehouse.punch_pair
    WHERE
      punch_date >= addMonths(today(), -12)
  ), payrollers AS (
    SELECT DISTINCT
      employee_code AS employee_code,
      1 AS has_payroll
    FROM dbpcm_warehouse.payroll
    WHERE
      pay_period_end_date >= addMonths(today(), -12)
  ), earners AS (
    SELECT DISTINCT
      employee_code AS employee_code,
      1 AS has_earnings
    FROM dbpcm_warehouse.total_earning
    WHERE
      punch_date >= addMonths(today(), -12)
  )
  SELECT
    e.employee_code AS "Employee Code",
    e.employee_name AS "Employee Name",
    e.department_name AS "Department",
    e.employee_status AS "Employee Status",
    1 AS "Has Roster",
    COALESCE(p.has_punches, 0) AS "Has Punches",
    COALESCE(pl.has_payroll, 0) AS "Has Payroll",
    COALESCE(te.has_earnings, 0) AS "Has Earnings",
    (
      COALESCE(p.has_punches, 0) + COALESCE(pl.has_payroll, 0) + COALESCE(te.has_earnings, 0)
    ) AS "Coverage Score",
    (
      3 - COALESCE(p.has_punches, 0) - COALESCE(pl.has_payroll, 0) - COALESCE(te.has_earnings, 0)
    ) AS "Gap Count"
  FROM dbpcm_warehouse.employee AS e
  LEFT JOIN punchers AS p
    ON p.employee_code = e.employee_code
  LEFT JOIN payrollers AS pl
    ON pl.employee_code = e.employee_code
  LEFT JOIN earners AS te
    ON te.employee_code = e.employee_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Gap Count DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Gap Count
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Employee Status
  - Has Roster
  - Has Punches
  - Has Payroll
  - Has Earnings
  - Coverage Score
  - Gap Count
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Employee Status:
    kind: text
  Has Roster:
    kind: integer
  Has Punches:
    kind: integer
  Has Payroll:
    kind: integer
  Has Earnings:
    kind: integer
  Coverage Score:
    kind: integer
  Gap Count:
    kind: integer
presentation:
  kind: table
