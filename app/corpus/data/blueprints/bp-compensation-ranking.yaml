id: bp-compensation-ranking
intent: Top N highest-paid employees separately within Salary and Hourly pay types. Salary uses recorded annual
  salary; Hourly uses hourly_salary * 2080 estimated annual compensation (40 hours/week, 52 weeks/year, excludes
  overtime). This is current compensation, not actual payroll earnings. Defaults to Active + On Leave; top_n applies
  to each pay type.
slots_summary: top_n, employee_status, department
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.hourly_salary
- dbpcm_warehouse.department.department_name
slots:
- name: top_n
  type: positive_integer
  required: true
  min_value: 1
  max_value: 1000
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
result_grain:
- Pay Type
- Rank
sql_template: |
  WITH compensation AS (
    SELECT
      e.employee_code,
      e.employee_name,
      e.department_name,
      e.pay_type,
      e.hourly_salary,
      CASE
        WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
        THEN e.annual_salary
        WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
        THEN e.hourly_salary * 2080
        ELSE NULL
      END AS annual_compensation
    FROM dbpcm_warehouse.employee AS e
    WHERE
      (
        e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
      )
      AND e.department_name IN ({department})
  ), ranked AS (
    SELECT
      employee_code,
      employee_name,
      department_name,
      pay_type,
      hourly_salary,
      annual_compensation,
      row_number() OVER (PARTITION BY pay_type ORDER BY annual_compensation DESC, employee_code) AS compensation_rank
    FROM compensation
    WHERE
      NOT (
        annual_compensation IS NULL
      )
  )
  SELECT
    pay_type AS "Pay Type",
    compensation_rank AS "Rank",
    employee_code AS "Employee Code",
    employee_name AS "Employee Name",
    department_name AS "Department",
    annual_compensation AS "Annual Compensation",
    hourly_salary AS "Hourly Rate"
  FROM ranked
  WHERE
    compensation_rank <= {top_n}
  ORDER BY
    pay_type,
    compensation_rank
uses_rules:
- default_employee_population
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Rank:
    kind: integer
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Annual Compensation:
    kind: currency
    currency: USD
    precision: 2
  Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
presentation:
  kind: table
