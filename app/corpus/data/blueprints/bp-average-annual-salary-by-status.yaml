id: bp-average-annual-salary-by-status
intent: Average recorded annual salary for Salary employees and recorded hourly rate for Hourly employees, separately
  by pay type, filtered by employee status. Never annualize hourly pay. Defaults to Active + On Leave.
slots_summary: employee_status, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.hourly_salary
slots:
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  multiple: true
  default:
  - Active
  - On Leave
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Pay Type ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Pay Type
    direction: ASC
  allowed_columns:
  - Pay Type
  - Compensation Basis
  - Average Annual Salary
  - Average Hourly Rate
sql_template: |
  SELECT
    pay_type AS "Pay Type",
    CASE
      WHEN pay_type = 'Hourly'
      THEN 'Recorded hourly rate (per hour)'
      WHEN pay_type = 'Salary'
      THEN 'Recorded annual salary'
      ELSE 'Unknown compensation basis'
    END AS "Compensation Basis",
    avg(
      CASE WHEN pay_type = 'Salary' AND annual_salary > 0 THEN annual_salary ELSE NULL END
    ) AS "Average Annual Salary",
    avg(
      CASE WHEN pay_type = 'Hourly' AND hourly_salary > 0 THEN hourly_salary ELSE NULL END
    ) AS "Average Hourly Rate"
  FROM dbpcm_warehouse.employee
  WHERE
    (
      employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
  GROUP BY
    pay_type
  ORDER BY {order_by}
result_grain:
- Pay Type
uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Average Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Average Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
presentation:
  kind: table
