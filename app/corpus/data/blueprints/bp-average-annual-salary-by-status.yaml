id: bp-average-annual-salary-by-status
intent: Average annual compensation by pay type, filtered by employee status. Salary uses annual_salary; Hourly
  uses hourly_salary and estimated annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes
  overtime). Keep pay types separate. Defaults to Active + On Leave; employee_status overrides or All removes the
  filter.
slots_summary: employee_status
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.employee_pay_type
- dbpcm_warehouse.employee.hourly_salary
slots:
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  optional_pattern: employee_status IN ('Active', 'On Leave')
sql_template: |
  SELECT employee_pay_type AS `Pay Type`,
         CASE
             WHEN employee_pay_type = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'
             WHEN employee_pay_type = 'Salary' THEN 'Recorded annual salary'
             ELSE 'Unknown compensation basis'
         END AS `Compensation Basis`,
         avg(CASE
                 WHEN employee_pay_type = 'Salary' THEN annual_salary
                 WHEN employee_pay_type = 'Hourly' THEN hourly_salary * 2080
                 ELSE NULL
             END) AS `Average Annual Compensation`,
         avg(CASE
                 WHEN employee_pay_type = 'Hourly' THEN hourly_salary
                 ELSE NULL
             END) AS `Average Hourly Rate`
  FROM dbpcm_warehouse.employee
  WHERE (employee_status = {employee_status}
         OR {employee_status} = 'All')
  GROUP BY employee_pay_type
result_grain:
- Pay Type
uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Average Annual Compensation:
    kind: currency
    currency: USD
    precision: 2
  Average Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
