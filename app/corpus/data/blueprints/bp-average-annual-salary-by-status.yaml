id: bp-average-annual-salary-by-status
intent: Calculate the average annual salary per employee filtered by employee status. Defaults to Active + On Leave;
  employee_status selects another status or All to remove the filter.
slots_summary: employee_status
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
slots:
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  optional_pattern: employee_status IN ('Active', 'On Leave')
sql_template: SELECT avg(annual_salary) AS average_annual_salary_per_employee FROM dbpcm_warehouse.employee WHERE
  (employee_status = {employee_status} OR {employee_status} = 'All')
resolves:
  average annual salary per employee: dbpcm_warehouse.employee.annual_salary
