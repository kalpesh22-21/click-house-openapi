id: bp-salary-exact-median
intent: Exact median, average, minimum and maximum recorded annual salary and recorded hourly rate, separately by
  pay type and company, department or status. salary_population selects positive values by default or recorded values
  including zeros; NULLs excluded. Never annualize hourly rates. Defaults to Active + On Leave.
slots_summary: group_by, salary_population, employee_status, department, employee, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.hourly_salary
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
- name: salary_population
  type: enum
  required: true
  enum_values:
  - recorded
  - positive
  description: Use positive unless the user explicitly asks to include recorded zeros. A zero is not a recorded
    rate; an Hourly employee with hourly_salary 0 or a Salary employee with annual_salary 0 has no compensation
    on record.
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Group
    direction: ASC
  allowed_columns:
  - Pay Type
  - Compensation Basis
  - Group
  - Known Compensation Count
  - Exact Median Annual Salary
  - Exact Median Hourly Rate
  - Average Annual Salary
  - Minimum Annual Salary
  - Minimum Hourly Rate
  - Maximum Annual Salary
  - Maximum Hourly Rate
  - Average Hourly Rate
result_grain:
- Group
- Pay Type
sql_template: |
  SELECT
    e.pay_type AS "Pay Type",
    CASE
      WHEN e.pay_type = 'Hourly'
      THEN 'Recorded hourly rate (per hour)'
      WHEN e.pay_type = 'Salary'
      THEN 'Recorded annual salary'
      ELSE 'Unknown compensation basis'
    END AS "Compensation Basis",
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN e.employee_status
      ELSE 'Company'
    END AS "Group",
    count(
      (
        CASE
          WHEN e.pay_type = 'Salary'
          THEN e.annual_salary
          WHEN e.pay_type = 'Hourly'
          THEN e.hourly_salary
          ELSE NULL
        END
      )
    ) AS "Known Compensation Count",
    (
      quantileExactLow(0.5)((
        CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END
      )) + quantileExactHigh(0.5)((
        CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END
      ))
    ) / 2 AS "Exact Median Annual Salary",
    (
      quantileExactLow(0.5)((
        CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END
      )) + quantileExactHigh(0.5)((
        CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END
      ))
    ) / 2 AS "Exact Median Hourly Rate",
    avg((
      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END
    )) AS "Average Annual Salary",
    min((
      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END
    )) AS "Minimum Annual Salary",
    min((
      CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END
    )) AS "Minimum Hourly Rate",
    max((
      CASE WHEN e.pay_type = 'Salary' THEN e.annual_salary ELSE NULL END
    )) AS "Maximum Annual Salary",
    max((
      CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END
    )) AS "Maximum Hourly Rate",
    avg(CASE WHEN e.pay_type = 'Hourly' THEN e.hourly_salary ELSE NULL END) AS "Average Hourly Rate"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    (
      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
    AND e.department_name IN ({department})
    AND e.employee_code = {employee}
    AND NOT (
      (
        CASE
          WHEN e.pay_type = 'Salary'
          THEN e.annual_salary
          WHEN e.pay_type = 'Hourly'
          THEN e.hourly_salary
          ELSE NULL
        END
      ) IS NULL
    )
    AND (
      {salary_population} = 'recorded'
      OR (
        CASE
          WHEN e.pay_type = 'Salary'
          THEN e.annual_salary
          WHEN e.pay_type = 'Hourly'
          THEN e.hourly_salary
          ELSE NULL
        END
      ) > 0
    )
  GROUP BY
    e.pay_type,
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN e.employee_status
      ELSE 'Company'
    END
  ORDER BY {order_by}
uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Group:
    kind: text
  Known Compensation Count:
    kind: integer
  Exact Median Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Exact Median Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
  Average Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Minimum Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Minimum Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
  Maximum Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Maximum Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
  Average Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
presentation:
  kind: table
