id: bp-earning-category-dictionary
intent: Full earning category dimension mapping with each earn code and its assigned category label, zero-slot static
  lookup
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    earn_code AS "Earn Code",
    category_name AS "Category"
  FROM dbpcm_warehouse.earning_category
  ORDER BY {order_by}
slots:
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Category ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Category
    direction: ASC
  allowed_columns:
  - Earn Code
  - Category
slots_summary: order_by
uses:
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Earn Code:
    kind: identifier
  Category:
    kind: text
presentation:
  kind: table
