id: bp-unpaid-active-employees
intent: Active employees who have no payroll earnings register line in a given pay period, identifying unpaid active
  roster entries
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.employee_code AS "Employee Code",
    e.employee_name AS "Employee Name",
    e.department_name AS "Department"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    e.employee_status = 'Active'
    AND NOT (
      e.employee_code IN (
        SELECT DISTINCT
          p.employee_code
        FROM dbpcm_warehouse.payroll AS p
        WHERE
          p.register_type = 'EARN' AND p.pay_period_end_date = {period}
      )
    )
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
slots_summary: top_n, period, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
presentation:
  kind: table
