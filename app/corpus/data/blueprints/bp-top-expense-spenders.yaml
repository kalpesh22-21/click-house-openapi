id: bp-top-expense-spenders
intent: Top N employees by approved expense spend for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    e.employee_code AS "Employee Code",
    any(e.employee_name) AS "Employee Name",
    round(toFloat64(SUM(x.amount_approved)), 2) AS "Approved Spend"
  FROM dbpcm_warehouse.expense AS x
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = x.employee_code
  WHERE
    x.expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND x.expense_paid_date >= {expense_window_start}
    AND x.expense_paid_date < {expense_window_end}
  GROUP BY
    e.employee_code
  ORDER BY
    "Approved Spend" DESC,
    "Employee Code"
  LIMIT {top_n}
slots:
- name: top_n
  type: positive_integer
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
slots_summary: top_n, expense_window
uses:
- dbpcm_warehouse.expense.employee_code
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Approved Spend:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Employee Name
  measure_columns:
  - Approved Spend
