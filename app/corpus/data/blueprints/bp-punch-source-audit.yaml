id: bp-punch-source-audit
intent: Monthly count of punch pairs by ingestion source ARCHIVED versus FREEZE, showing pair counts per source
  per month
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(addDays(punch_date, 1 - toDayOfMonth(punch_date)), '%Y-%m') AS "Month",
    table_source AS "Table Source",
    count() AS "Pair Count"
  FROM (
    SELECT
      punch_date,
      table_source
    FROM dbpcm_warehouse.punch_pair
  )
  WHERE
    punch_date >= today() - toIntervalMonth({win})
  GROUP BY
    "Month",
    table_source
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Table Source
  - Pair Count
slots_summary: win, order_by
uses:
- dbpcm_warehouse.punch_pair.table_source
- dbpcm_warehouse.punch_pair.punch_date
column_formats:
  Month:
    kind: text
  Table Source:
    kind: text
  Pair Count:
    kind: integer
presentation:
  kind: table
