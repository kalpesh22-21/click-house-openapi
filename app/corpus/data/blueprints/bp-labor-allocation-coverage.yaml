id: bp-labor-allocation-coverage
intent: Coverage audit comparing active employees with and without labor allocation key 1 populated
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT "Mapping Status", "Headcount"
  FROM (
  SELECT
    'Set' AS "Mapping Status",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND NOT (
      labor_allocation_key_1 IS NULL
    )
    AND labor_allocation_key_1 <> ''
  UNION ALL
  SELECT
    'Not Set' AS "Mapping Status",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND (
      labor_allocation_key_1 IS NULL OR labor_allocation_key_1 = ''
    )
  ) AS coverage
  ORDER BY {order_by}
slots:
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Mapping Status
  - Headcount
slots_summary: order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.labor_allocation_key_1
column_formats:
  Mapping Status:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Mapping Status
  measure_columns:
  - Headcount
