id: bp-accrual-event-summary
intent: Accrual event/day row counts, event hours and distinct employees by company, department, workflow status,
  event type, event-date month or department_status (department and status together). Includes all event types and
  leave categories unless explicitly filtered. Required half-open requested-for-date period [start,end); optional
  workflow status enum, resolved event_type and earn_code strings, employee status, department and employee. No
  implicit Approved or PTO filter. COUNT counts event/day rows, not distinct multi-day requests. Approved hours
  are not taken balance usage. LEFT JOIN preserves unmatched events unless employee filters supplied; does not zero-fill
  periods or prove full coverage. For time-off-taken questions bind event_status=Approved and event_type=Time Off
  Request, plus the requested category/date scope; assume these requests were taken and disclose it. Offer a separate
  payroll-paid-hours check without executing it unless requested.
slots_summary: group_by, period, event_status, event_type, earn_code, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.earn_code
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
  - event_type
  - month
  - department_status
- name: period
  type: period_range
  temporal_type: date
  required: true
- name: event_status
  type: enum
  required: false
  enum_values:
  - Approved
  - Requested
  - Denied
  - Removed
  - Calendar Only
  binds_to: dbpcm_warehouse.time_off_request.status
  optional_pattern: 'TRUE'
- name: event_type
  type: entity
  required: false
  binds_to: dbpcm_warehouse.time_off_request.event_type
  optional_pattern: 'TRUE'
- name: earn_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.time_off_request.earn_code
  optional_pattern: 'TRUE'
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Group
- Event Status
sql_template: |
  WITH a AS
    (SELECT employee_code,
            status,
            event_type,
            SUBSTRING(toString(request_date), 1, 7) AS month,
            count(*) AS event_rows,
            sum(hours) AS hours
     FROM dbpcm_warehouse.time_off_request
     WHERE status = {event_status}
       AND event_type = {event_type}
       AND earn_code = {earn_code}
       AND toDate(request_date) >= toDate({period_start})
       AND toDate(request_date) < toDate({period_end})
     GROUP BY employee_code,
              status,
              event_type,
              SUBSTRING(toString(request_date), 1, 7))
  SELECT CASE {group_by}
             WHEN 'department' THEN e.department_name
             WHEN 'department_status' THEN e.department_name
             WHEN 'status' THEN a.status
             WHEN 'event_type' THEN a.event_type
             WHEN 'month' THEN toString(a.month)
             ELSE 'Company'
         END AS "Group",
         CASE
             WHEN {group_by} = 'department_status' THEN a.status
             ELSE 'All selected statuses'
         END AS "Event Status",
         sum(CAST(a.event_rows AS Nullable(Decimal(20, 0)))) AS "Event Day Rows",
         sum(CAST(a.hours AS Nullable(Decimal(38, 6)))) AS "Event Hours",
         uniqExact(a.employee_code) AS "Employee Count"
  FROM a
  LEFT JOIN dbpcm_warehouse.employee AS e ON a.employee_code = e.employee_code
  WHERE e.employee_status = {employee_status}
    AND e.department_name = {department}
    AND e.employee_code = {employee}
  GROUP BY CASE {group_by}
               WHEN 'department' THEN e.department_name
               WHEN 'department_status' THEN e.department_name
               WHEN 'status' THEN a.status
               WHEN 'event_type' THEN a.event_type
               WHEN 'month' THEN toString(a.month)
               ELSE 'Company'
           END,
           CASE
               WHEN {group_by} = 'department_status' THEN a.status
               ELSE 'All selected statuses'
           END
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Group"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Group"
                     END ASC, "Event Status"
column_formats:
  Group:
    kind: text
  Event Status:
    kind: text
  Event Day Rows:
    kind: integer
  Event Hours:
    kind: number
    unit: hours
    precision: 2
  Employee Count:
    kind: integer
