id: bp-accrual-event-summary
intent: Accrual event days, event hours and distinct employees by company, department, workflow status, event type,
  event-date month or department_status (department and status together). Includes all event types and leave categories
  unless explicitly filtered. Required half-open requested-for-date period [start,end); optional workflow status
  enum, resolved event_type and earn_code strings, employee status, department and employee. No implicit Approved
  or PTO filter. COUNT counts event/day rows, not distinct multi-day requests. Approved hours are not taken balance
  usage. LEFT JOIN preserves unmatched events unless employee filters supplied; does not zero-fill periods or prove
  full coverage. For time-off-taken questions bind event_status=Approved and event_type=Time Off Request, plus the
  requested category/date scope; assume these requests were taken and disclose it. Offer a separate payroll-paid-hours
  check without executing it unless requested.
slots_summary: group_by, period, event_status, event_type, earn_code, employee_status, department, employee, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.earn_code
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
  - event_type
  - month
  - department_status
- name: period
  type: period_range
  temporal_type: date
  required: true
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: event_status
  type: enum
  required: false
  enum_values:
  - Approved
  - Requested
  - Denied
  - Removed
  - Calendar Only
  binds_to: dbpcm_warehouse.time_off_request.status
  optional_pattern: 'TRUE'
  multiple: true
- name: event_type
  type: entity
  required: false
  binds_to: dbpcm_warehouse.time_off_request.event_type
  optional_pattern: 'TRUE'
  multiple: true
- name: earn_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.time_off_request.earn_code
  optional_pattern: 'TRUE'
  multiple: true
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
  multiple: true
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Group
    direction: ASC
  allowed_columns:
  - Group
  - Event Status
  - Event Days
  - Event Hours
  - Employee Count
result_grain:
- Group
- Event Status
sql_template: |
  WITH a AS (
    SELECT
      employee_code,
      status,
      event_type,
      SUBSTRING(toString(request_date), 1, 7) AS month,
      count(*) AS event_rows,
      sum(hours) AS hours
    FROM dbpcm_warehouse.time_off_request
    WHERE
      status IN ({event_status})
      AND event_type IN ({event_type})
      AND earn_code IN ({earn_code})
      AND toDate(request_date) >= toDate({period_start})
      AND toDate(request_date) < toDate({period_end})
    GROUP BY
      employee_code,
      status,
      event_type,
      SUBSTRING(toString(request_date), 1, 7)
  )
  SELECT
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'department_status'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN a.status
      WHEN {group_by} = 'event_type'
      THEN a.event_type
      WHEN {group_by} = 'month'
      THEN toString(a.month)
      ELSE 'Company'
    END AS "Group",
    CASE
      WHEN {group_by} = 'department_status'
      THEN a.status
      ELSE 'All selected statuses'
    END AS "Event Status",
    sum(CAST(a.event_rows AS Nullable(Decimal(20, 0)))) AS "Event Days",
    sum(CAST(a.hours AS Nullable(Decimal(38, 6)))) AS "Event Hours",
    uniqExact(a.employee_code) AS "Employee Count"
  FROM a
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON a.employee_code = e.employee_code
  WHERE
    e.employee_status IN ({employee_status})
    AND e.department_name IN ({department})
    AND e.employee_code = {employee}
  GROUP BY
    CASE
      WHEN {group_by} = 'department'
      THEN e.department_name
      WHEN {group_by} = 'department_status'
      THEN e.department_name
      WHEN {group_by} = 'status'
      THEN a.status
      WHEN {group_by} = 'event_type'
      THEN a.event_type
      WHEN {group_by} = 'month'
      THEN toString(a.month)
      ELSE 'Company'
    END,
    CASE
      WHEN {group_by} = 'department_status'
      THEN a.status
      ELSE 'All selected statuses'
    END
  ORDER BY {order_by}
column_formats:
  Group:
    kind: text
  Event Status:
    kind: text
  Event Days:
    kind: integer
  Event Hours:
    kind: number
    unit: hours
    precision: 2
  Employee Count:
    kind: integer
presentation:
  kind: table
