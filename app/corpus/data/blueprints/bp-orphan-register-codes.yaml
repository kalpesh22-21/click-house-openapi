id: bp-orphan-register-codes
intent: Payroll register employee codes that have no match in the employee roster, a data-quality orphan audit
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    p.employee_code AS "Employee Code",
    count() AS "Pay Items"
  FROM dbpcm_warehouse.payroll AS p
  WHERE
    NOT (
      p.employee_code IN (
        SELECT DISTINCT
          employee_code
        FROM dbpcm_warehouse.employee
      )
    )
    AND p.pay_period_end_date = {period}
  GROUP BY
    p.employee_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Pay Items DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Pay Items
    direction: DESC
  allowed_columns:
  - Employee Code
  - Pay Items
slots_summary: top_n, period, order_by
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.employee.employee_code
column_formats:
  Employee Code:
    kind: identifier
  Pay Items:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Employee Code
  measure_columns:
  - Pay Items
