id: bp-records-per-status
intent: Employee record counts per employee status including Not Hired records
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    employee_status AS "Employee Status",
    count() AS "Employee Records"
  FROM dbpcm_warehouse.employee
  WHERE
    department_name IN ({department})
  GROUP BY
    employee_status
  ORDER BY {order_by}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Records DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Records
    direction: DESC
  allowed_columns:
  - Employee Status
  - Employee Records
slots_summary: department, order_by
uses:
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Status:
    kind: text
  Employee Records:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Employee Status
  measure_columns:
  - Employee Records
