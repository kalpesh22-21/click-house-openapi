id: bp-departments-above-company-average-salary
intent: Departments whose average salary exceeds the company-wide average. Defaults to Active + On Leave; employee_status
  selects another status or All to remove the filter.
slots_summary: employee_status
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
result_grain:
- Department
composes:
- order: 0
  output:
    company_avg: scalar
  sql_template: |
    SELECT AVG(annual_salary) AS company_avg
    FROM dbpcm_warehouse.employee
    WHERE (employee_status = {employee_status} OR {employee_status} = 'All')
- order: 1
  feeds_from:
  - 0
  consumes:
    company_avg: $0.company_avg
  output: {}
  sql_template: |
    SELECT department_name AS department, AVG(annual_salary) AS dept_avg
    FROM dbpcm_warehouse.employee
    WHERE (employee_status = {employee_status} OR {employee_status} = 'All')
    GROUP BY department_name
    HAVING AVG(annual_salary) > {company_avg}
slots:
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  optional_pattern: employee_status IN ('Active', 'On Leave')
