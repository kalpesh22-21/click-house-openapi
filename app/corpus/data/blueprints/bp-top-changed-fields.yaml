id: bp-top-changed-fields
intent: Top employee master-data changed fields ranked by total change-event count within a trailing month window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  /* Output aliases are Title-Case display names; consumers keying on column names */
  /* must use the quoted aliases. */
  SELECT
    changed_field AS "Changed Field",
    count() AS "Change Events"
  FROM dbpcm_warehouse.employee_change
  WHERE
    change_time_added >= addMonths(today(), -{win})
  GROUP BY
    changed_field
  ORDER BY
    "Change Events" DESC,
    "Changed Field"
  LIMIT {max_rows}
slots:
- name: win
  type: relative_window
  required: true
- name: max_rows
  type: positive_integer
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
slots_summary: win, max_rows
uses:
- dbpcm_warehouse.employee_change.changed_field
- dbpcm_warehouse.employee_change.change_time_added
column_formats:
  Changed Field:
    kind: text
  Change Events:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Changed Field
  measure_columns:
  - Change Events
