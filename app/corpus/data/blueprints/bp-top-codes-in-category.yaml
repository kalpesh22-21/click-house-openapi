id: bp-top-codes-in-category
intent: Top-N earn codes by earnings dollars within a specific earning category, using earn descriptions for display
  labels
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT te.earn_code AS "Earn Code",
         any(te.earn_code_description) AS "Description",
         round(SUM(te.earn_amount), 2) AS "Total Dollars",
         round(SUM(te.earn_hours), 2) AS "Total Hours"
  FROM
    (SELECT punch_date,
            earn_amount,
            earn_code,
            earn_code_description,
            earn_hours
     FROM dbpcm_warehouse.total_earning) AS te
  JOIN
    (SELECT earn_code,
            category_name
     FROM dbpcm_warehouse.earning_category FINAL) AS ec ON ec.earn_code = te.earn_code
  WHERE ec.category_name = {concept}
    AND te.punch_date >= toDate('2023-01-01')
    AND te.punch_date <= toDate('2026-12-31')
  GROUP BY te.earn_code
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Total Dollars"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Total Dollars"
                     END ASC, "Earn Code"
  LIMIT {top_n}
slots:
- name: concept
  type: string
  required: true
  binds_to: dbpcm_warehouse.earning_category.category_name
- name: top_n
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: concept, top_n, order_direction
uses:
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.total_earning.earn_code_description
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Earn Code:
    kind: identifier
  Description:
    kind: text
  Total Dollars:
    kind: currency
    currency: USD
  Total Hours:
    kind: number
    unit: hours
    precision: 2
