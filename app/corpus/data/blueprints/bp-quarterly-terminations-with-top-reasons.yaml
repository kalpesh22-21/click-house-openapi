id: bp-quarterly-terminations-with-top-reasons
intent: Terminations per quarter within a window, ranked to the top-N termination reasons per quarter
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    "Quarter",
    "Term Reason",
    "Terms",
    "Quarter Total"
  FROM (
    SELECT
      "Quarter",
      "Term Reason",
      "Terms",
      sum("Terms") OVER (PARTITION BY "Quarter") AS "Quarter Total",
      row_number() OVER (PARTITION BY "Quarter" ORDER BY "Terms" DESC) AS reason_rank
    FROM (
      SELECT
        dateTrunc('QUARTER', termination_date) AS "Quarter",
        ifNull(nullIf(term_reason, ''), 'Unspecified') AS "Term Reason",
        count(DISTINCT employee_code) AS "Terms"
      FROM dbpcm_warehouse.employee
      WHERE
        employee_status = 'Terminated'
        AND termination_date >= {term_window_start}
        AND termination_date < {term_window_end}
        AND NOT (
          termination_date IS NULL
        )
        AND toDate32(termination_date) > toDate32('1900-01-01')
        AND (
          most_recent_hire_date IS NULL OR most_recent_hire_date < termination_date
        )
      GROUP BY
        "Quarter",
        "Term Reason"
    )
  )
  WHERE
    reason_rank <= {top_n}
  ORDER BY
    "Quarter" DESC,
    "Terms" DESC
slots:
- name: term_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: top_n
  type: relative_window
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
slots_summary: term_window, top_n
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.employee.term_reason
column_formats:
  Quarter:
    kind: date
  Term Reason:
    kind: text
  Terms:
    kind: integer
  Quarter Total:
    kind: integer
presentation:
  kind: table
