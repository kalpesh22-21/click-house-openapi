id: bp-employees-in-inactive-seats
intent: Active employees assigned to position seats with inactive or disabled seat status
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    department_name AS "Department",
    position_code AS "Position Code",
    position_seat_number AS "Seat Number",
    status_position_seat AS "Seat Status"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND department_name IN ({department})
    AND status_position_seat IN ('I', 'D')
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Position Code
  - Seat Number
  - Seat Status
slots_summary: department, max_rows, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.position_code
- dbpcm_warehouse.employee.position_seat_number
- dbpcm_warehouse.employee.status_position_seat
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Position Code:
    kind: identifier
  Seat Number:
    kind: identifier
  Seat Status:
    kind: text
presentation:
  kind: table
