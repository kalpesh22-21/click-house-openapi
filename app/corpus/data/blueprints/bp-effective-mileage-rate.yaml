id: bp-effective-mileage-rate
intent: Effective mileage rate by expense rule for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    expense_rule_description AS "Expense Rule",
    round(toFloat64(SUM(amount_approved)), 2) AS "Total Approved",
    round(toFloat64(SUM(approved_miles)), 2) AS "Total Miles",
    round(toFloat64(SUM(amount_approved)) / nullIf(toFloat64(SUM(approved_miles)), 0), 4) AS "Effective Rate"
  FROM dbpcm_warehouse.expense
  WHERE
    (
      submitted_miles > 0 OR approved_miles > 0
    )
    AND expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
  GROUP BY
    expense_rule_description
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Approved DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Approved
    direction: DESC
  allowed_columns:
  - Expense Rule
  - Total Approved
  - Total Miles
  - Effective Rate
slots_summary: expense_window, max_rows, order_by
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.approved_miles
- dbpcm_warehouse.expense.expense_rule_description
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
- dbpcm_warehouse.expense.submitted_miles
column_formats:
  Expense Rule:
    kind: text
  Total Approved:
    kind: currency
    currency: USD
    precision: 2
  Total Miles:
    kind: number
    unit: miles
    precision: 2
  Effective Rate:
    kind: currency
    currency: USD
    unit: per mile
    precision: 4
presentation:
  kind: bars
  category_columns:
  - Expense Rule
  measure_columns:
  - Total Approved
