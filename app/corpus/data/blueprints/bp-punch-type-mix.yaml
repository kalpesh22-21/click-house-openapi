id: bp-punch-type-mix
intent: Breakdown of punch pair counts by In punch type and Out punch type for a given date window, using punch-level
  event data only
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    in_punch_type AS "In Punch Type",
    out_punch_type AS "Out Punch Type",
    count() AS "Pair Count"
  FROM dbpcm_warehouse.punch_pair
  WHERE
    (
      punch_date >= {window_start} AND punch_date < {window_end}
    )
  GROUP BY
    in_punch_type,
    out_punch_type
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Pair Count DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Pair Count
    direction: DESC
  allowed_columns:
  - In Punch Type
  - Out Punch Type
  - Pair Count
slots_summary: window, max_rows, order_by
uses:
- dbpcm_warehouse.punch_pair.in_punch_type
- dbpcm_warehouse.punch_pair.out_punch_type
- dbpcm_warehouse.punch_pair.punch_date
column_formats:
  In Punch Type:
    kind: text
  Out Punch Type:
    kind: text
  Pair Count:
    kind: integer
presentation:
  kind: table
