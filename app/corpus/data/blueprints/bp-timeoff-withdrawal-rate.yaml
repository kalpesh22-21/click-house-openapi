id: bp-timeoff-withdrawal-rate
intent: Removed or withdrawn time-off request rate by department, with denominator counting all active workflow
  statuses
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT e.department_name AS "Department",
         COUNT(*) AS "Total Requests",
         COUNTIf(t.status = 'Removed') AS "Removed Requests",
         round((COUNTIf(t.status = 'Removed') / nullIf(COUNT(*), 0)) * 100, 2) AS "Withdrawal Rate Pct"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e ON e.employee_code = t.employee_code
  WHERE t.status IN ('Approved',
                     'Denied',
                     'Removed',
                     'Requested')
    AND toDate32(t.request_date) BETWEEN {window_start} AND {window_end}
  GROUP BY e.department_name
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Withdrawal Rate Pct"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Withdrawal Rate Pct"
                     END ASC, "Department"
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: window, order_direction
uses:
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Total Requests:
    kind: integer
  Removed Requests:
    kind: integer
  Withdrawal Rate Pct:
    kind: percent
    scale: percent
    precision: 2
