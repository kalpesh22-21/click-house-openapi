id: bp-timeoff-withdrawal-rate
intent: Removed or withdrawn time-off request rate by department, with denominator counting all active workflow
  statuses
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.department_name AS "Department",
    COUNT(*) AS "Total Requests",
    countIf(t.status = 'Removed') AS "Removed Requests",
    round((
      countIf(t.status = 'Removed') / nullIf(COUNT(*), 0)
    ) * 100, 2) AS "Withdrawal Rate Pct"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = t.employee_code
  WHERE
    t.status IN ('Approved', 'Denied', 'Removed', 'Requested')
    AND t.event_type IN ({event_type})
    AND (
      toDate32(t.request_date) >= {window_start}
      AND toDate32(t.request_date) < {window_end}
    )
  GROUP BY
    e.department_name
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Withdrawal Rate Pct DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Withdrawal Rate Pct
    direction: DESC
  allowed_columns:
  - Department
  - Total Requests
  - Removed Requests
  - Withdrawal Rate Pct
slots_summary: top_n, window, event_type, order_by
uses:
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Total Requests:
    kind: integer
  Removed Requests:
    kind: integer
  Withdrawal Rate Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Total Requests
