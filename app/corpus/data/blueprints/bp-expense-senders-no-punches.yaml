id: bp-expense-senders-no-punches
intent: Employees who submitted expense activity but have zero punched timecard records over the trailing N months
  — based on expense submission time, not payment time; includes unpaid submissions
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    "Employee Code",
    "Employee Name",
    "Department"
  FROM (
    SELECT DISTINCT
      e.employee_code AS "Employee Code",
      e.employee_name AS "Employee Name",
      e.department_name AS "Department"
    FROM dbpcm_warehouse.expense AS ex
    JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = ex.employee_code
    WHERE
      toDate(ex.date_time_submitted) >= addMonths(today(), -{win})
      AND NOT (
        ex.employee_code IN (
          SELECT DISTINCT
            employee_code
          FROM dbpcm_warehouse.punch_pair
          WHERE
            punch_date >= addMonths(today(), -{win})
        )
      )
  ) AS results
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
slots_summary: top_n, win, order_by
uses:
- dbpcm_warehouse.expense.employee_code
- dbpcm_warehouse.expense.date_time_submitted
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
presentation:
  kind: table
