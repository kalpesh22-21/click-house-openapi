id: bp-timeoff-by-leave-type
intent: Approved time-off hours grouped by earn code concept resolved dynamically via earn_code, or all earn codes
  when no concept is provided
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT t.earn_description AS "Earn Description",
         t.earn_code AS "Earn Code",
         round(SUM(t.hours), 2) AS "Approved Hours"
  FROM dbpcm_warehouse.time_off_request AS t
  WHERE t.status = 'Approved'
    AND t.event_type = {event_type}
    AND t.hours IS NOT NULL
    AND (toDate32(t.request_date) >= {window_start} AND toDate32(t.request_date) < {window_end})
    AND t.earn_description = {concept}
  GROUP BY t.earn_description,
           t.earn_code
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Approved Hours"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Approved Hours"
                     END ASC
slots:
- name: concept
  type: string
  required: false
  binds_to: dbpcm_warehouse.time_off_request.earn_description
  optional_pattern: 'TRUE'
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and end 2026-04-01; for a complete day, end is the next day.
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default: Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
slots_summary: concept, window, order_direction, event_type
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.earn_code
- dbpcm_warehouse.time_off_request.earn_description
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.request_date
column_formats:
  Earn Description:
    kind: text
  Earn Code:
    kind: identifier
  Approved Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Earn Description
  measure_columns:
  - Approved Hours
