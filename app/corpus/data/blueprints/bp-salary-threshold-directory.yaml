id: bp-salary-threshold-directory
intent: Employee directory filtered by a whole-currency annual compensation threshold, ordered by annual compensation
  descending by default. row_limit caps the entire directory; this is not a top-N-per-pay-type ranking. Salary uses
  annual_salary; Hourly uses hourly_salary and estimated annual compensation = hourly_salary * 2080 (40 hours/week,
  52 weeks/year; excludes overtime). Keep pay types separate. Defaults to Active + On Leave; employee_status overrides
  or All removes the filter.
slots_summary: comparison, salary, row_limit, employee_status, department, employee, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.hourly_salary
- dbpcm_warehouse.department.department_name
slots:
- name: comparison
  type: enum
  required: true
  enum_values:
  - above
  - at_least
  - equal
  - below
- name: salary
  type: nonnegative_integer
  required: true
  min_value: 0
  max_value: 1000000000
- name: row_limit
  type: positive_integer
  required: true
  min_value: 1
  max_value: 1000
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Annual Compensation DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Annual Compensation
    direction: DESC
  allowed_columns:
  - Pay Type
  - Compensation Basis
  - Employee Code
  - Department
  - Status
  - Annual Compensation
  - Hourly Rate
result_grain:
- Employee Code
sql_template: |+
  SELECT
    e.pay_type AS "Pay Type",
    CASE
      WHEN e.pay_type = 'Hourly'
      THEN 'Estimated annual compensation (2080 hours)'
      WHEN e.pay_type = 'Salary'
      THEN 'Recorded annual salary'
      ELSE 'Unknown compensation basis'
    END AS "Compensation Basis",
    e.employee_code AS "Employee Code",
    e.department_name AS "Department",
    e.employee_status AS "Status",
    (
      CASE
        WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
        THEN e.annual_salary
        WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
        THEN e.hourly_salary * 2080
        ELSE NULL
      END
    ) AS "Annual Compensation",
    e.hourly_salary AS "Hourly Rate"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    (
      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
    AND e.department_name IN ({department})
    AND e.employee_code = {employee}
    AND (
      (
        {comparison} = 'above'
        AND (
          CASE
            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
            THEN e.annual_salary
            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
            THEN e.hourly_salary * 2080
            ELSE NULL
          END
        ) > {salary}
      )
      OR (
        {comparison} = 'at_least'
        AND (
          CASE
            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
            THEN e.annual_salary
            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
            THEN e.hourly_salary * 2080
            ELSE NULL
          END
        ) >= {salary}
      )
      OR (
        {comparison} = 'equal'
        AND (
          CASE
            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
            THEN e.annual_salary
            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
            THEN e.hourly_salary * 2080
            ELSE NULL
          END
        ) = {salary}
      )
      OR (
        {comparison} = 'below'
        AND (
          CASE
            WHEN e.pay_type = 'Salary' AND e.annual_salary > 0
            THEN e.annual_salary
            WHEN e.pay_type = 'Hourly' AND e.hourly_salary > 0
            THEN e.hourly_salary * 2080
            ELSE NULL
          END
        ) < {salary}
      )
    )
  ORDER BY {order_by}
  LIMIT {row_limit}

uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Employee Code:
    kind: identifier
  Department:
    kind: text
  Status:
    kind: text
  Annual Compensation:
    kind: currency
    currency: USD
    precision: 2
  Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
presentation:
  kind: table
