id: bp-supervision-anomalies
intent: Self-supervising and missing-primary-supervisor anomaly audit for active employees.
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    "Employee Code",
    "Name",
    "Department",
    "Supervisor Code",
    "Supervisor Name",
    "Anomaly Type"
  FROM (
    SELECT
      employee_code AS "Employee Code",
      employee_name AS "Name",
      department_name AS "Department",
      primary_supervisor_ee_code AS "Supervisor Code",
      primary_supervisor_name AS "Supervisor Name",
      'Self-Supervising' AS "Anomaly Type"
    FROM dbpcm_warehouse.employee
    WHERE
      employee_status = 'Active'
      AND NOT (
        primary_supervisor_ee_code IS NULL
      )
      AND primary_supervisor_ee_code <> ''
      AND primary_supervisor_ee_code = employee_code
    UNION ALL
    SELECT
      employee_code AS "Employee Code",
      employee_name AS "Name",
      department_name AS "Department",
      primary_supervisor_ee_code AS "Supervisor Code",
      primary_supervisor_name AS "Supervisor Name",
      'Missing Supervisor' AS "Anomaly Type"
    FROM dbpcm_warehouse.employee
    WHERE
      employee_status = 'Active'
      AND (
        primary_supervisor_ee_code IS NULL OR primary_supervisor_ee_code = ''
      )
  ) AS anomalies
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Anomaly Type ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Anomaly Type
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Supervisor Code
  - Supervisor Name
  - Anomaly Type
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.primary_supervisor_ee_code
- dbpcm_warehouse.employee.primary_supervisor_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Supervisor Code:
    kind: identifier
  Supervisor Name:
    kind: text
  Anomaly Type:
    kind: text
presentation:
  kind: table
