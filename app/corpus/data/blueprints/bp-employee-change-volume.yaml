id: bp-employee-change-volume
intent: Monthly counts of employee master-data changes by changed field, including both effective and non-effective
  logged changes
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  /* Output aliases are Title-Case display names; consumers keying on column names */
  /* must use the quoted aliases. */
  SELECT
    formatDateTime(dateTrunc('MONTH', change_time_added), '%Y-%m') AS "Month",
    changed_field AS "Changed Field",
    count() AS "Change Events"
  FROM dbpcm_warehouse.employee_change
  WHERE
    change_time_added >= addMonths(today(), -{win})
  GROUP BY
    "Month",
    changed_field
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: win
  type: relative_window
  required: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Changed Field
  - Change Events
slots_summary: win, max_rows, order_by
uses:
- dbpcm_warehouse.employee_change.changed_field
- dbpcm_warehouse.employee_change.change_time_added
column_formats:
  Month:
    kind: text
  Changed Field:
    kind: text
  Change Events:
    kind: integer
presentation:
  kind: table
