id: bp-employee-benefits-summary
intent: Total employee benefit contributions and breakdown by benefit type code for a pay period, from payroll register
  benefit lines
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    type_code AS "Benefit Code",
    round(SUM(amount), 2) AS "Total Benefit Contributions"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type = 'EEBEN' AND pay_period_end_date = {period}
  GROUP BY
    type_code
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Benefit Contributions DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Benefit Contributions
    direction: DESC
  allowed_columns:
  - Benefit Code
  - Total Benefit Contributions
slots_summary: period, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Benefit Code:
    kind: identifier
  Total Benefit Contributions:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - Benefit Code
  measure_columns:
  - Total Benefit Contributions
