id: bp-timecard-earnings-all-history
intent: All-history timecard earnings and hours per earn code from total_earning, spanning all available punch dates,
  with optional employee or date-window filter
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    earn_code AS "Earn Code",
    round(SUM(earn_amount), 2) AS "Total Earnings",
    round(SUM(earn_hours), 2) AS "Total Hours"
  FROM dbpcm_warehouse.total_earning
  WHERE
    employee_code = {ee}
    AND (
      punch_date >= {window_start} AND punch_date < {window_end}
    )
  GROUP BY
    earn_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: ee
  type: string
  required: false
  binds_to: dbpcm_warehouse.total_earning.employee_code
  optional_pattern: 'TRUE'
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Earnings
    direction: DESC
  allowed_columns:
  - Earn Code
  - Total Earnings
  - Total Hours
slots_summary: top_n, ee, window, order_by
uses:
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.employee_code
column_formats:
  Earn Code:
    kind: identifier
  Total Earnings:
    kind: currency
    currency: USD
    precision: 2
  Total Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Earn Code
  measure_columns:
  - Total Earnings
