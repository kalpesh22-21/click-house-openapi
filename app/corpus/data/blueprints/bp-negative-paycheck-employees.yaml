id: bp-negative-paycheck-employees
intent: Employees and pay periods where net pay is negative, flagging reversals and adjustments that result in a
  negative net-pay amount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    p.employee_code AS "Employee Code",
    e.employee_name AS "Employee Name",
    e.department_name AS "Department",
    p.pay_period_end_date AS "Pay Period End",
    round(SUMIf(p.amount, p.register_type = 'EARN'), 2) AS "Gross Earnings",
    round(SUMIf(p.amount, p.register_type = 'NETPAYDIST'), 2) AS "Net Pay"
  FROM dbpcm_warehouse.payroll AS p
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = p.employee_code
  WHERE
    (
      p.pay_period_end_date >= {window_start}
      AND p.pay_period_end_date < {window_end}
    )
  GROUP BY
    p.employee_code,
    e.employee_name,
    e.department_name,
    p.pay_period_end_date
  HAVING
    "Gross Earnings" < 0 OR "Net Pay" < 0
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Pay Period End DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Pay Period End
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Pay Period End
  - Gross Earnings
  - Net Pay
slots_summary: top_n, window, order_by
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Pay Period End:
    kind: date
  Gross Earnings:
    kind: currency
    currency: USD
  Net Pay:
    kind: currency
    currency: USD
presentation:
  kind: table
