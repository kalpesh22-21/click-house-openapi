id: bp-negative-paycheck-employees
intent: Employees and pay periods where net pay is negative, flagging reversals and adjustments that result in a
  negative net-pay amount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT p.employee_code AS "Employee Code",
         e.employee_name AS "Employee Name",
         e.department_name AS "Department",
         p.pay_period_end_date AS "Pay Period End",
         round(SUMIf(p.amount, p.register_type = 'EARN'), 2) AS "Gross Earnings",
         round(SUMIf(p.amount, p.register_type = 'NETPAYDIST'), 2) AS "Net Pay"
  FROM dbpcm_warehouse.payroll p
  LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = p.employee_code
  WHERE p.pay_period_end_date BETWEEN {window_start} AND {window_end}
  GROUP BY p.employee_code,
           e.employee_name,
           e.department_name,
           p.pay_period_end_date
  HAVING "Gross Earnings" < 0
  OR "Net Pay" < 0
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Pay Period End"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Pay Period End"
                     END ASC, p.employee_code
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: window, order_direction
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Pay Period End:
    kind: date
  Gross Earnings:
    kind: currency
    currency: USD
  Net Pay:
    kind: currency
    currency: USD
