id: bp-missing-emergency-contacts
intent: Active employees missing a primary emergency contact phone
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    department_name AS "Department",
    primary_phone AS "Primary Phone"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND department_name IN ({department})
    AND (
      primary_emergency_contact_phone IS NULL OR primary_emergency_contact_phone = ''
    )
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Primary Phone
slots_summary: department, max_rows, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.primary_phone
- dbpcm_warehouse.employee.primary_emergency_contact_phone
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Primary Phone:
    kind: identifier
presentation:
  kind: table
