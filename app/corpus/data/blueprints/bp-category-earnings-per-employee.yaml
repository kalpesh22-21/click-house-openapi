id: bp-category-earnings-per-employee
intent: Per-employee earnings dollars for a specific earning category over a date window, including all employees
  with matching earnings, ranked by amount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    te.employee_code AS "Employee Code",
    any(e.employee_name) AS "Employee Name",
    any(e.department_name) AS "Department",
    round(SUM(te.earn_amount), 2) AS "Total Dollars"
  FROM (
    SELECT
      employee_code,
      punch_date,
      earn_amount,
      earn_code
    FROM dbpcm_warehouse.total_earning
  ) AS te
  JOIN (
    SELECT
      earn_code,
      category_name
    FROM dbpcm_warehouse.earning_category
  ) AS ec
    ON ec.earn_code = te.earn_code
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = te.employee_code
  WHERE
    ec.category_name IN ({concept})
    AND (
      te.punch_date >= {window_start} AND te.punch_date < {window_end}
    )
  GROUP BY
    te.employee_code
  ORDER BY {order_by}
  LIMIT {top_n}
slots:
- name: concept
  type: string
  required: true
  binds_to: dbpcm_warehouse.earning_category.category_name
  multiple: true
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: top_n
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Dollars DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Dollars
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Total Dollars
slots_summary: concept, window, top_n, order_by
uses:
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Total Dollars:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - Employee Name
  measure_columns:
  - Total Dollars
