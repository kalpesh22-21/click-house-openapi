id: bp-punch-anomalies
intent: Matched In/Out punch pairs with a missing In punch or missing Out punch edge detected via sentinel timestamps
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    "Employee Code",
    "Employee Name",
    "Punch Date",
    "Anomaly Type"
  FROM (
    SELECT
      pp.employee_code AS "Employee Code",
      any(e.employee_name) AS "Employee Name",
      pp.punch_date AS "Punch Date",
      'Missing Out Punch' AS "Anomaly Type"
    FROM (
      SELECT
        employee_code,
        punch_date,
        in_punch_time,
        out_punch_time
      FROM dbpcm_warehouse.punch_pair
    ) AS pp
    LEFT JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = pp.employee_code
    WHERE
      NOT (
        pp.in_punch_time IS NULL
      )
      AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')
      AND NOT (
        NOT (
          pp.out_punch_time IS NULL
        )
        AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')
      )
      AND (
        pp.punch_date >= {window_start} AND pp.punch_date < {window_end}
      )
    GROUP BY
      pp.employee_code,
      pp.punch_date
    UNION ALL
    SELECT
      pp.employee_code AS "Employee Code",
      any(e.employee_name) AS "Employee Name",
      pp.punch_date AS "Punch Date",
      'Missing In Punch' AS "Anomaly Type"
    FROM (
      SELECT
        employee_code,
        punch_date,
        in_punch_time,
        out_punch_time
      FROM dbpcm_warehouse.punch_pair
    ) AS pp
    LEFT JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = pp.employee_code
    WHERE
      NOT (
        pp.out_punch_time IS NULL
      )
      AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')
      AND NOT (
        NOT (
          pp.in_punch_time IS NULL
        )
        AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')
      )
      AND (
        pp.punch_date >= {window_start} AND pp.punch_date < {window_end}
      )
    GROUP BY
      pp.employee_code,
      pp.punch_date
  ) AS anomalies
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Punch Date DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Punch Date
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Punch Date
  - Anomaly Type
slots_summary: window, max_rows, order_by
uses:
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.punch_pair.in_punch_time
- dbpcm_warehouse.punch_pair.out_punch_time
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Punch Date:
    kind: date
  Anomaly Type:
    kind: text
presentation:
  kind: table
