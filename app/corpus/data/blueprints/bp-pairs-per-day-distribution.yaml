id: bp-pairs-per-day-distribution
intent: Distribution of punch pair counts per employee per day showing how many days had 1 pair, 2 pairs, or 3 or
  more pairs
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT ppd.ppd AS "Pairs Per Day",
         count() AS "Employee-Days"
  FROM
    (SELECT employee_code,
            punch_date,
            CASE
                WHEN count() = 1 THEN '1 pair'
                WHEN count() = 2 THEN '2 pairs'
                ELSE '3+ pairs'
            END AS ppd
     FROM
       (SELECT employee_code,
               punch_date
        FROM dbpcm_warehouse.punch_pair)
     WHERE (punch_date >= {window_start} AND punch_date < {window_end})
     GROUP BY employee_code,
              punch_date) AS ppd
  GROUP BY ppd
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN CASE "Pairs Per Day"
                                                        WHEN '1 pair' THEN 1
                                                        WHEN '2 pairs' THEN 2
                                                        ELSE 3
                                                    END
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN CASE "Pairs Per Day"
                                                                 WHEN '1 pair' THEN 1
                                                                 WHEN '2 pairs' THEN 2
                                                                 ELSE 3
                                                             END
                     END ASC
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and end 2026-04-01; for a complete day, end is the next day.
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
slots_summary: window, order_direction
uses:
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.punch_date
column_formats:
  Pairs Per Day:
    kind: integer
  Employee-Days:
    kind: integer
presentation:
  kind: donut
  category_columns:
  - Pairs Per Day
  measure_columns:
  - Employee-Days
