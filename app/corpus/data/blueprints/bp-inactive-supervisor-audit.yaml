id: bp-inactive-supervisor-audit
intent: Active employees whose primary supervisor status is not active, supervisor inactivity audit
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.employee_code AS "Employee Code",
    e.employee_name AS "Name",
    e.department_name AS "Department",
    e.primary_supervisor_ee_code AS "Supervisor Code",
    s.employee_name AS "Supervisor Name",
    s.employee_status AS "Supervisor Status"
  FROM dbpcm_warehouse.employee AS e
  JOIN dbpcm_warehouse.employee AS s
    ON s.employee_code = e.primary_supervisor_ee_code
  WHERE
    e.employee_status = 'Active'
    AND NOT (
      e.primary_supervisor_ee_code IS NULL
    )
    AND e.primary_supervisor_ee_code <> ''
    AND s.employee_status <> 'Active'
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Supervisor Code
  - Supervisor Name
  - Supervisor Status
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.primary_supervisor_ee_code
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Supervisor Code:
    kind: identifier
  Supervisor Name:
    kind: text
  Supervisor Status:
    kind: text
presentation:
  kind: table
