id: bp-future-dated-position-changes
intent: Active employees with position or seat effective dates inside a forward window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    position_code AS "Position Code",
    position_seat_number AS "Seat Number",
    effective_date_position_info AS "Position Effective",
    effective_date_position_seat AS "Seat Effective"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND (
      (
        effective_date_position_info >= {change_window_start}
        AND effective_date_position_info < {change_window_end}
      )
      OR (
        effective_date_position_seat >= {change_window_start}
        AND effective_date_position_seat < {change_window_end}
      )
    )
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: change_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Position Effective ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Position Effective
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Position Code
  - Seat Number
  - Position Effective
  - Seat Effective
slots_summary: top_n, change_window, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.position_code
- dbpcm_warehouse.employee.position_seat_number
- dbpcm_warehouse.employee.effective_date_position_info
- dbpcm_warehouse.employee.effective_date_position_seat
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Position Code:
    kind: identifier
  Seat Number:
    kind: identifier
  Position Effective:
    kind: datetime
  Seat Effective:
    kind: datetime
presentation:
  kind: table
