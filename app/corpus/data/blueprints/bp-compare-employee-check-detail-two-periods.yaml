id: bp-compare-employee-check-detail-two-periods
intent: Compare a single employee's two paychecks line-item by line-item across two pay periods, with per-item deltas
slots_summary: employee, period_a, period_b
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.type_code_description
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_hours
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
slots:
- name: employee
  type: string
  required: true
  binds_to: dbpcm_warehouse.payroll.employee_code
- name: period_a
  type: period
  temporal_type: date
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
- name: period_b
  type: period
  temporal_type: date
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
result_grain:
- Register Type
- Type Code
composes:
- order: 0
  output:
    detail_a: table
  ref:
    blueprint: bp-employee-check-detail-for-period
    slots:
      employee: employee
      period: period_a
- order: 1
  output:
    detail_b: table
  ref:
    blueprint: bp-employee-check-detail-for-period
    slots:
      employee: employee
      period: period_b
- order: 2
  feeds_from:
  - 0
  - 1
  consumes:
    detail_a: $0
    detail_b: $1
  output: {}
  sql_template: |
    SELECT coalesce(a."Register Type", b."Register Type") AS "Register Type",
           coalesce(a."Type Code", b."Type Code") AS "Type Code",
           coalesce(a."Type Code Description", b."Type Code Description") AS "Type Code Description",
           coalesce(a."Amount", 0) AS "Amount Period A",
           coalesce(b."Amount", 0) AS "Amount Period B",
           coalesce(b."Amount", 0) - coalesce(a."Amount", 0) AS "Amount Change",
           coalesce(a."Hours", 0) AS "Hours Period A",
           coalesce(b."Hours", 0) AS "Hours Period B"
    FROM scratch.detail_a AS a
    FULL OUTER JOIN scratch.detail_b AS b ON a."Register Type" = b."Register Type"
    AND a."Type Code" = b."Type Code"
    ORDER BY coalesce(a."Register Type", b."Register Type"),
             coalesce(a."Type Code", b."Type Code")
column_formats:
  Register Type:
    kind: text
  Type Code:
    kind: identifier
  Type Code Description:
    kind: text
  Amount Period A:
    kind: currency
    currency: USD
    precision: 2
  Amount Period B:
    kind: currency
    currency: USD
    precision: 2
  Amount Change:
    kind: currency
    currency: USD
    precision: 2
  Hours Period A:
    kind: number
    unit: hours
    precision: 2
  Hours Period B:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: table
