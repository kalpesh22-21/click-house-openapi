id: bp-compare-employee-check-detail-two-periods
intent: Compare a single employee's two paychecks line-item by line-item across two pay periods, with per-item deltas
slots_summary: employee, period_a, period_b
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.type_code_description
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_hours
slots:
- name: employee
  type: string
  required: true
  binds_to: dbpcm_warehouse.payroll.employee_code
- name: period_a
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
- name: period_b
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
result_grain:
- register_type
- type_code
# Nodes 0 and 1 REFERENCE bp-employee-check-detail-for-period rather than repeating
# its SQL: the two per-period detail queries differed only in which pay-period slot
# they filtered on. The consumer's corpus loader resolves each `ref` and INLINES that
# blueprint's SQL at load, renaming its `{period}` bind site to `{period_a}` /
# `{period_b}` per the `slots` map — so the executor still sees two ordinary inline
# nodes and this file cannot drift from the blueprint it composes.
#
# `employee: employee` is written out even though the names match: a reference never
# binds a slot implicitly. After inlining only THIS blueprint's slot declarations
# exist (slots resolve once per blueprint, before the DAG walk), so an implicit bind
# would let a rename here silently re-point the referenced filter.
#
# `uses` must cover everything a reference reads — the loader refuses the load
# otherwise. Both lists happen to be identical here; that is the union rule holding,
# not a coincidence worth relying on.
composes:
- order: 0
  output:
    detail_a: table
  ref:
    blueprint: bp-employee-check-detail-for-period
    slots:
      employee: employee
      period: period_a
- order: 1
  output:
    detail_b: table
  ref:
    blueprint: bp-employee-check-detail-for-period
    slots:
      employee: employee
      period: period_b
- order: 2
  feeds_from:
  - 0
  - 1
  consumes:
    detail_a: $0
    detail_b: $1
  output: {}
  sql_template: |
    SELECT coalesce(a.register_type, b.register_type) AS register_type,
           coalesce(a.type_code, b.type_code) AS type_code,
           coalesce(a.type_code_description, b.type_code_description) AS type_code_description,
           coalesce(a.amount, 0) AS amount_a,
           coalesce(b.amount, 0) AS amount_b,
           coalesce(b.amount, 0) - coalesce(a.amount, 0) AS amount_delta,
           coalesce(a.hours, 0) AS hours_a,
           coalesce(b.hours, 0) AS hours_b
    FROM scratch.detail_a AS a
    FULL OUTER JOIN scratch.detail_b AS b
      ON a.register_type = b.register_type AND a.type_code = b.type_code
    ORDER BY coalesce(a.register_type, b.register_type),
             coalesce(a.type_code, b.type_code)
