id: bp-register-type-breakdown
intent: Split of the payroll register across register types for a pay period — EARN earnings, EETAX employee taxes,
  DDUCT deductions, EEBEN benefits, ERTAX employer taxes, NETPAYDIST net pay — showing dollars by register type
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    register_type AS "Register Type",
    round(SUM(amount), 2) AS "Total Amount"
  FROM dbpcm_warehouse.payroll
  WHERE
    pay_period_end_date = {period}
  GROUP BY
    register_type
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Amount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Amount
    direction: DESC
  allowed_columns:
  - Register Type
  - Total Amount
slots_summary: period, order_by
uses:
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Register Type:
    kind: text
  Total Amount:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Register Type
  measure_columns:
  - Total Amount
