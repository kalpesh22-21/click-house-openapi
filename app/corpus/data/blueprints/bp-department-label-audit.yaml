id: bp-department-label-audit
intent: Department label normalization audit showing employee department names not present in the official department
  dimension with affected employee counts
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.department_name AS "Department Name",
    count(DISTINCT e.employee_code) AS "Affected Employees"
  FROM dbpcm_warehouse.employee AS e
  LEFT JOIN dbpcm_warehouse.department AS d
    ON d.department_name = e.department_name
  WHERE
    d.department_name IS NULL
    AND NOT (
      e.department_name IS NULL
    )
    AND e.department_name <> ''
  GROUP BY
    e.department_name
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Affected Employees DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Affected Employees
    direction: DESC
  allowed_columns:
  - Department Name
  - Affected Employees
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.department.department_name
column_formats:
  Department Name:
    kind: text
  Affected Employees:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Department Name
  measure_columns:
  - Affected Employees
