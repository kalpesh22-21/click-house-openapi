id: bp-missing-receipts
intent: Missing receipt count and share by expense rule for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    expense_rule AS "Expense Rule",
    any(expense_rule_description) AS "Rule Description",
    countIf(receipt_attached = 'No') AS "Missing Receipts",
    round(toFloat64(countIf(receipt_attached = 'No')) / nullIf(count(), 0), 4) AS "Missing Share"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
  GROUP BY
    expense_rule
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: top_n
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Missing Receipts DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Missing Receipts
    direction: DESC
  allowed_columns:
  - Expense Rule
  - Rule Description
  - Missing Receipts
  - Missing Share
slots_summary: expense_window, top_n, order_by
uses:
- dbpcm_warehouse.expense.receipt_attached
- dbpcm_warehouse.expense.expense_rule
- dbpcm_warehouse.expense.expense_rule_description
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Expense Rule:
    kind: text
  Rule Description:
    kind: text
  Missing Receipts:
    kind: integer
  Missing Share:
    kind: percent
    scale: ratio
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Rule Description
  measure_columns:
  - Missing Receipts
