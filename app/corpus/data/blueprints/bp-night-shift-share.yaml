id: bp-night-shift-share
intent: Night-shift hours share by department using total_earning earn_hours where the shift date is identified
  by In punch time between configurable night-start and night-end hours
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  WITH night_dates AS (
    SELECT DISTINCT
      pp.employee_code,
      pp.punch_date
    FROM (
      SELECT
        employee_code,
        punch_date,
        in_punch_time
      FROM dbpcm_warehouse.punch_pair
    ) AS pp
    WHERE
      (
        pp.punch_date >= {window_start} AND pp.punch_date < {window_end}
      )
      AND NOT (
        pp.in_punch_time IS NULL
      )
      AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')
      AND (
        toHour(pp.in_punch_time) >= {night_start}
        OR toHour(pp.in_punch_time) < {night_end}
      )
  ), dept_total AS (
    SELECT
      e.department_name AS dept,
      SUM(te.earn_hours) AS total_hours
    FROM (
      SELECT
        employee_code,
        punch_date,
        earn_hours
      FROM dbpcm_warehouse.total_earning
    ) AS te
    JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = te.employee_code
    WHERE
      (
        te.punch_date >= {window_start} AND te.punch_date < {window_end}
      )
    GROUP BY
      e.department_name
  ), dept_night AS (
    SELECT
      e.department_name AS dept,
      SUM(te.earn_hours) AS night_hours
    FROM night_dates AS nd
    JOIN (
      SELECT
        employee_code,
        punch_date,
        earn_hours
      FROM dbpcm_warehouse.total_earning
    ) AS te
      ON te.employee_code = nd.employee_code AND te.punch_date = nd.punch_date
    JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = te.employee_code
    GROUP BY
      e.department_name
  )
  SELECT
    COALESCE(d.dept, n.dept) AS "Department",
    round(COALESCE(d.total_hours, 0), 2) AS "Total Hours",
    round(COALESCE(n.night_hours, 0), 2) AS "Night Hours",
    round(100.0 * COALESCE(n.night_hours, 0) / nullIf(COALESCE(d.total_hours, 0), 0), 2) AS "Night Share Pct"
  FROM dept_total AS d
  FULL OUTER JOIN dept_night AS n
    ON n.dept = d.dept
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: night_start
  type: positive_integer
  required: true
- name: night_end
  type: positive_integer
  required: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Night Share Pct DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Night Share Pct
    direction: DESC
  allowed_columns:
  - Department
  - Total Hours
  - Night Hours
  - Night Share Pct
slots_summary: window, night_start, night_end, max_rows, order_by
uses:
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.in_punch_time
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Total Hours:
    kind: number
    unit: hours
    precision: 2
  Night Hours:
    kind: number
    unit: hours
    precision: 2
  Night Share Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Total Hours
