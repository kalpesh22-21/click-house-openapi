id: bp-employee-directory
intent: Filtered active-employee directory with identity, contact, title and pay columns
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    work_email AS "Work Email",
    position_title_position_info AS "Title",
    department_name AS "Department",
    badge_number AS "Badge",
    pay_basis AS "Pay Basis",
    employment_type AS "Employment Type",
    primary_supervisor_name AS "Supervisor"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND department_name IN ({department})
    AND pay_basis IN ({pay_basis})
    AND employment_type IN ({employment_type})
    AND primary_supervisor_name IN ({supervisor})
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: pay_basis
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.pay_basis
  optional_pattern: 'TRUE'
  multiple: true
- name: employment_type
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.employment_type
  optional_pattern: 'TRUE'
  multiple: true
- name: supervisor
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.primary_supervisor_name
  optional_pattern: 'TRUE'
  multiple: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Name ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Name
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Work Email
  - Title
  - Department
  - Badge
  - Pay Basis
  - Employment Type
  - Supervisor
slots_summary: department, pay_basis, employment_type, supervisor, max_rows, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.work_email
- dbpcm_warehouse.employee.position_title_position_info
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.badge_number
- dbpcm_warehouse.employee.pay_basis
- dbpcm_warehouse.employee.employment_type
- dbpcm_warehouse.employee.primary_supervisor_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Work Email:
    kind: text
  Title:
    kind: text
  Department:
    kind: text
  Badge:
    kind: identifier
  Pay Basis:
    kind: text
  Employment Type:
    kind: text
  Supervisor:
    kind: text
presentation:
  kind: table
