id: bp-supervisor-chain-depth
intent: Distribution of populated supervisor-level counts (0-4) across active employees
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    toString(depth) AS "Chain Depth",
    count() AS "Headcount",
    round(100 * count() / sum(count()) OVER (), 2) AS "Share Pct"
  FROM (
    SELECT
      employee_code,
      toUInt8(
        (
          NOT (
            primary_supervisor_ee_code IS NULL
          ) AND primary_supervisor_ee_code <> ''
        )
      ) + toUInt8(
        (
          NOT (
            secondary_supervisor_ee_code IS NULL
          )
          AND secondary_supervisor_ee_code <> ''
        )
      ) + toUInt8(
        (
          NOT (
            tertiary_supervisor_ee_code IS NULL
          )
          AND tertiary_supervisor_ee_code <> ''
        )
      ) + toUInt8(
        (
          NOT (
            quaternary_supervisor_ee_code IS NULL
          )
          AND quaternary_supervisor_ee_code <> ''
        )
      ) AS depth
    FROM dbpcm_warehouse.employee
    WHERE
      employee_status = 'Active'
  )
  GROUP BY
    depth
  ORDER BY {order_by}
slots:
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Chain Depth ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Chain Depth
    direction: ASC
  allowed_columns:
  - Chain Depth
  - Headcount
  - Share Pct
slots_summary: order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.primary_supervisor_ee_code
- dbpcm_warehouse.employee.secondary_supervisor_ee_code
- dbpcm_warehouse.employee.tertiary_supervisor_ee_code
- dbpcm_warehouse.employee.quaternary_supervisor_ee_code
- dbpcm_warehouse.employee.employee_status
column_formats:
  Chain Depth:
    kind: integer
  Headcount:
    kind: integer
  Share Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: donut
  category_columns:
  - Chain Depth
  measure_columns:
  - Headcount
