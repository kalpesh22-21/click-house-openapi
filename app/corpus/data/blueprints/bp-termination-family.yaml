id: bp-termination-family
intent: Employees with a recorded termination date in a half-open period, with the total matching employee count
  before the display limit. Includes same-day/later rehires and employees no longer currently Terminated. Apply
  current status only when explicitly requested. For counts/grouped summaries use bp-employee-date-summary with
  date_basis=termination.
slots_summary: period, row_limit, employee_status, department, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.department.department_name
slots:
- name: period
  type: period_range
  temporal_type: date
  required: true
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: row_limit
  type: positive_integer
  required: true
  min_value: 1
  max_value: 1000
- name: employee_status
  description: Omit for all recorded terminations in the period; set only when current status is explicitly requested.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
  multiple: true
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Termination Date DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Termination Date
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Current Status
  - Termination Date
  - Total Matching Employees
result_grain:
- Employee Code
sql_template: |+
  SELECT
    e.employee_code AS "Employee Code",
    e.employee_name AS "Employee Name",
    e.department_name AS "Department",
    e.employee_status AS "Current Status",
    e.termination_date AS "Termination Date",
    count(*) OVER () AS "Total Matching Employees"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    e.termination_date >= {period_start}
    AND e.termination_date < {period_end}
    AND (
      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
    AND e.department_name IN ({department})
  ORDER BY {order_by}
  LIMIT {row_limit}

uses_rules:
- terminations_in_period
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Current Status:
    kind: text
  Termination Date:
    kind: date
  Total Matching Employees:
    kind: integer
presentation:
  kind: table
