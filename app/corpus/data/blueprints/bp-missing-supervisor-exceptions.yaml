id: bp-missing-supervisor-exceptions
intent: Active employees missing a primary supervisor assignment
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT employee_code AS "Employee Code",
         employee_name AS "Name",
         department_name AS "Department",
         position_title_position_info AS "Title",
         work_email AS "Work Email",
         primary_supervisor_name AS "Supervisor"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND department_name = {department}
    AND (primary_supervisor_ee_code IS NULL
         OR primary_supervisor_ee_code = '')
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN employee_code
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN employee_code
                     END ASC
  LIMIT {max_rows}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: max_rows
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
slots_summary: department, max_rows, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.position_title_position_info
- dbpcm_warehouse.employee.work_email
- dbpcm_warehouse.employee.primary_supervisor_ee_code
- dbpcm_warehouse.employee.primary_supervisor_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Title:
    kind: text
  Work Email:
    kind: text
  Supervisor:
    kind: text
