id: bp-post-termination-changes
intent: Employee master-data changes with an effective date after the employee's termination date, flagged as a
  post-termination audit anomaly
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  /* Output aliases are Title-Case display names; consumers keying on column names */
  /* must use the quoted aliases. */
  SELECT
    ec.employee_code AS "Employee Code",
    any(e.employee_name) AS "Name",
    ec.changed_field AS "Changed Field",
    count() AS "Post-Termination Changes"
  FROM (
    SELECT
      employee_code,
      effective_date,
      change_time_added,
      changed_field
    FROM dbpcm_warehouse.employee_change
  ) AS ec
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = ec.employee_code
  WHERE
    NOT (
      ec.effective_date IS NULL
    )
    AND (
      ec.change_time_added >= {window_start}
      AND ec.change_time_added < {window_end}
    )
    AND NOT (
      e.termination_date IS NULL
    )
    AND toDate32(e.termination_date) > toDate32('1900-01-01')
    AND ec.effective_date > e.termination_date
  GROUP BY
    ec.employee_code,
    ec.changed_field
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Post-Termination Changes DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Post-Termination Changes
    direction: DESC
  allowed_columns:
  - Employee Code
  - Name
  - Changed Field
  - Post-Termination Changes
slots_summary: window, max_rows, order_by
uses:
- dbpcm_warehouse.employee_change.employee_code
- dbpcm_warehouse.employee_change.effective_date
- dbpcm_warehouse.employee_change.change_time_added
- dbpcm_warehouse.employee_change.changed_field
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.termination_date
- dbpcm_warehouse.employee.employee_name
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Changed Field:
    kind: text
  Post-Termination Changes:
    kind: integer
presentation:
  kind: table
