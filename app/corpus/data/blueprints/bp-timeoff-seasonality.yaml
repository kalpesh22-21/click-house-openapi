id: bp-timeoff-seasonality
intent: Approved time-off hours bucketed by month and by day-of-week over a trailing N-month window based on request
  date
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(dateTrunc('MONTH', t.request_date), '%Y-%m') AS "Month",
    round(SUM(t.hours), 2) AS "Approved Hours"
  FROM dbpcm_warehouse.time_off_request AS t
  WHERE
    t.status = 'Approved'
    AND t.event_type IN ({event_type})
    AND NOT (
      t.hours IS NULL
    )
    AND t.request_date >= (
      SELECT
        MAX(request_date)
      FROM dbpcm_warehouse.time_off_request
    ) - INTERVAL (
      {win}
    ) MONTH
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Approved Hours
slots_summary: win, event_type, order_by
uses:
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
column_formats:
  Month:
    kind: text
  Approved Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Approved Hours
