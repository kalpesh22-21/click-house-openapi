id: bp-median-annual-salary
intent: True median annual salary of active Salary-pay-type employees with a recorded salary, overall or per department. Hourly employees are paid by rate and are not included
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT round((quantileExactLow(0.5)(toFloat64(annual_salary)) + quantileExactHigh(0.5)(toFloat64(annual_salary))) / 2, 2) AS "Median Annual Salary",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND pay_type = 'Salary'
    AND annual_salary > 0
    AND department_name = {department}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
slots_summary: department
uses:
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Median Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Headcount:
    kind: integer
