id: bp-headcount-by-pay-frequency
intent: Active employee headcount grouped by pay frequency schedule with optional department filter
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    ifNull(pay_frequency, 'Unspecified') AS "Pay Frequency",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND department_name IN ({department})
  GROUP BY
    pay_frequency
  ORDER BY {order_by}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Pay Frequency
  - Headcount
slots_summary: department, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.pay_frequency
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Pay Frequency:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Pay Frequency
  measure_columns:
  - Headcount
