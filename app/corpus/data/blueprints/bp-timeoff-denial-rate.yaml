id: bp-timeoff-denial-rate
intent: Time-off denial rate by department for decided requests (Approved plus Denied) over a request-date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT d."Department" AS "Department",
         d."Decided Requests" AS "Decided Requests",
         d."Denied Requests" AS "Denied Requests",
         round((d."Denied Requests" / nullIf(d."Decided Requests", 0)) * 100, 2) AS "Denial Rate Pct"
  FROM
    (SELECT e.department_name AS "Department",
            COUNT(*) AS "Decided Requests",
            COUNTIf(t.status = 'Denied') AS "Denied Requests"
     FROM dbpcm_warehouse.time_off_request AS t
     JOIN dbpcm_warehouse.employee AS e ON e.employee_code = t.employee_code
     WHERE t.status IN ('Approved',
                        'Denied')
       AND t.event_type = {event_type}
       AND (toDate32(t.request_date) >= {window_start} AND toDate32(t.request_date) < {window_end})
     GROUP BY e.department_name) AS d
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Denial Rate Pct"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Denial Rate Pct"
                     END ASC, "Department"
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and end 2026-04-01; for a complete day, end is the next day.
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default: Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
slots_summary: window, order_direction, event_type
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Decided Requests:
    kind: integer
  Denied Requests:
    kind: integer
  Denial Rate Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Decided Requests
