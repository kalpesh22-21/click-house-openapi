id: bp-employee-summary
intent: Employee headcount, salary sum/average/minimum/maximum and known-salary count, grouped by company, department
  or status. Optional status, department and employee filters; omit to include all. Salary statistics exclude NULLs;
  no implicit active-only filter. One employee row per authorized employee is required. No date-period or salary-threshold
  filter.
slots_summary: group_by, employee_status, department, employee
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - status
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
result_grain:
- Group
sql_template: "SELECT CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'status' THEN e.employee_status\
  \ ELSE 'Company' END AS `Group`,\n uniqExact(e.employee_code) AS `Employee Count`,\n count(e.annual_salary) AS\
  \ `Known Salary Count`,\n sum(e.annual_salary) AS `Salary Sum`, avg(e.annual_salary) AS `Average Salary`,\n min(e.annual_salary)\
  \ AS `Minimum Salary`, max(e.annual_salary) AS `Maximum Salary`\nFROM dbpcm_warehouse.employee e\nWHERE e.employee_status\
  \ = {employee_status} AND e.department_name = {department} AND e.employee_code = {employee}\nGROUP BY CASE {group_by}\
  \ WHEN 'department' THEN e.department_name WHEN 'status' THEN e.employee_status ELSE 'Company' END\nORDER BY `Group`\n"
