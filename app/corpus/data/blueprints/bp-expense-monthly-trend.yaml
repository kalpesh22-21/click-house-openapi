id: bp-expense-monthly-trend
intent: Monthly approved expense spend trend over the last N months with top account slice
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(dateTrunc('MONTH', expense_paid_date), '%Y-%m') AS "Month",
    round(toFloat64(SUM(amount_approved)), 2) AS "Total Approved Spend"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND expense_paid_date >= (
      SELECT
        addMonths(dateTrunc('MONTH', max(expense_paid_date)), -{window_months})
      FROM dbpcm_warehouse.expense
      WHERE
        expense_status IN ('Approved', 'Paid', 'Marked as Paid')
        AND toDate32(expense_paid_date) > toDate32('1900-01-01')
    )
    AND toDate32(expense_paid_date) > toDate32('1900-01-01')
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: window_months
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Total Approved Spend
slots_summary: window_months, order_by
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
- dbpcm_warehouse.expense.expense_account_description
column_formats:
  Month:
    kind: text
  Total Approved Spend:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Total Approved Spend
