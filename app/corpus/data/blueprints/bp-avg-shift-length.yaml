id: bp-avg-shift-length
intent: Average shift duration in hours from In/Out punch timestamps per punch pair by employee home department,
  using punch_pair event data only
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    e.department_name AS "Department",
    round(AVG(DATE_DIFF(MINUTE, pp.in_punch_time, pp.out_punch_time) / 60.0), 2) AS "Avg Shift Hours",
    count() AS "Pair Count"
  FROM (
    SELECT
      employee_code,
      punch_date,
      in_punch_time,
      out_punch_time
    FROM dbpcm_warehouse.punch_pair
  ) AS pp
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = pp.employee_code
  WHERE
    (
      pp.punch_date >= {window_start} AND pp.punch_date < {window_end}
    )
    AND NOT (
      pp.in_punch_time IS NULL
    )
    AND toDate32(pp.in_punch_time) > toDate32('1900-01-01')
    AND NOT (
      pp.out_punch_time IS NULL
    )
    AND toDate32(pp.out_punch_time) > toDate32('1900-01-01')
  GROUP BY
    e.department_name
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Avg Shift Hours DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Avg Shift Hours
    direction: DESC
  allowed_columns:
  - Department
  - Avg Shift Hours
  - Pair Count
slots_summary: window, max_rows, order_by
uses:
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.in_punch_time
- dbpcm_warehouse.punch_pair.out_punch_time
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Department:
    kind: text
  Avg Shift Hours:
    kind: number
    unit: hours
    precision: 2
  Pair Count:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Avg Shift Hours
