id: bp-average-salary-by-department
intent: Average recorded annual salary and recorded hourly rate by department and pay type, in separate columns.
  Never annualize hourly pay. Defaults to Active + On Leave.
slots_summary: top_n, department, employee_status, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.hourly_salary
- dbpcm_warehouse.department.department_name
slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Average Annual Salary DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Average Annual Salary
    direction: DESC
  allowed_columns:
  - Pay Type
  - Compensation Basis
  - Department
  - Average Annual Salary
  - Headcount
  - Average Hourly Rate
result_grain:
- Department
- Pay Type
sql_template: |
  SELECT
    pay_type AS "Pay Type",
    CASE
      WHEN pay_type = 'Hourly'
      THEN 'Recorded hourly rate (per hour)'
      WHEN pay_type = 'Salary'
      THEN 'Recorded annual salary'
      ELSE 'Unknown compensation basis'
    END AS "Compensation Basis",
    department_name AS "Department",
    AVG(
      (
        CASE WHEN pay_type = 'Salary' AND annual_salary > 0 THEN annual_salary ELSE NULL END
      )
    ) AS "Average Annual Salary",
    COUNT(DISTINCT employee_code) AS "Headcount",
    avg(
      CASE WHEN pay_type = 'Hourly' AND hourly_salary > 0 THEN hourly_salary ELSE NULL END
    ) AS "Average Hourly Rate"
  FROM dbpcm_warehouse.employee
  WHERE
    department_name IN ({department})
    AND (
      employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
  GROUP BY
    pay_type,
    department_name
  ORDER BY {order_by}
  LIMIT {top_n}
uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Department:
    kind: text
  Average Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Headcount:
    kind: integer
  Average Hourly Rate:
    kind: currency
    currency: USD
    precision: 2
    unit: per hour
presentation:
  kind: table
