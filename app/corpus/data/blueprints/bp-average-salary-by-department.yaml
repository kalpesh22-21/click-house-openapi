id: bp-average-salary-by-department
intent: Average annual salary and employee headcount by department; optional employee status and department; omitted
  department filter includes all departments. Average excludes NULL salaries; headcount includes them. Defaults
  to Active + On Leave; employee_status selects another status or All to remove the filter.
slots_summary: department, employee_status
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.employee_status
resolves:
  salary: annual_salary
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: employee_status IN ('Active', 'On Leave')
result_grain:
- Department
sql_template: "SELECT department_name AS department,\n       AVG(annual_salary) AS avg_salary,\n       COUNT(DISTINCT\
  \ employee_code) AS headcount\nFROM dbpcm_warehouse.employee\nWHERE department_name = {department}\n  AND (employee_status\
  \ = {employee_status} OR {employee_status} = 'All')\nGROUP BY department_name\n"
