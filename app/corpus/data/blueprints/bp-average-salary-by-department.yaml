id: bp-average-salary-by-department
intent: Average annual salary by department
slots_summary: department
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
resolves:
  salary: annual_salary
slots:
# `department` is OPTIONAL: when omitted, `optional_pattern` collapses the
# `department_name = {department}` predicate to TRUE (average salary for ALL
# departments, grouped). NOTE: the runtime applies optional_pattern only once
# executor "Slice C" lands; until then an omitted optional slot falls back to
# the raw loop. Works today when a department IS supplied.
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
result_grain:
- Department
sql_template: |
  SELECT department_name AS department,
         AVG(annual_salary) AS avg_salary,
         COUNT(DISTINCT employee_code) AS headcount
  FROM dbpcm_warehouse.employee
  WHERE department_name = {department}
  GROUP BY department_name
