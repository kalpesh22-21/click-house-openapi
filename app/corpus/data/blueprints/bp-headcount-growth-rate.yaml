id: bp-headcount-growth-rate
intent: Monthly hires, terminations and net headcount delta over the last N months
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(m.month_start, '%Y-%m') AS "Month",
    countIf(
      e.most_recent_hire_date >= m.month_start
      AND e.most_recent_hire_date <= m.month_end
      AND NOT (
        e.most_recent_hire_date IS NULL
      )
      AND toDate32(e.most_recent_hire_date) > toDate32('1900-01-01')
    ) AS "Hires",
    countIf(
      e.termination_date >= m.month_start
      AND e.termination_date <= m.month_end
      AND NOT (
        e.termination_date IS NULL
      )
      AND toDate32(e.termination_date) > toDate32('1900-01-01')
      AND (
        e.most_recent_hire_date IS NULL OR e.most_recent_hire_date < e.termination_date
      )
    ) AS "Terms",
    countIf(
      e.most_recent_hire_date >= m.month_start
      AND e.most_recent_hire_date <= m.month_end
      AND NOT (
        e.most_recent_hire_date IS NULL
      )
      AND toDate32(e.most_recent_hire_date) > toDate32('1900-01-01')
    ) - countIf(
      e.termination_date >= m.month_start
      AND e.termination_date <= m.month_end
      AND NOT (
        e.termination_date IS NULL
      )
      AND toDate32(e.termination_date) > toDate32('1900-01-01')
      AND (
        e.most_recent_hire_date IS NULL OR e.most_recent_hire_date < e.termination_date
      )
    ) AS "Net Delta"
  FROM (
    SELECT
      addMonths(dateTrunc('MONTH', anchor.latest_hire), -toInt32(number)) AS month_start,
      toLastDayOfMonth(addMonths(anchor.latest_hire, -toInt32(number))) AS month_end
    FROM (
      SELECT
        max(most_recent_hire_date) AS latest_hire
      FROM dbpcm_warehouse.employee
      WHERE
        toDate32(most_recent_hire_date) > toDate32('1900-01-01')
    ) AS anchor
    CROSS JOIN (
      SELECT
        arrayJoin(range(0, toInt32({win}))) AS number
    ) AS seq
  ) AS m
  CROSS JOIN dbpcm_warehouse.employee AS e
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Hires
  - Terms
  - Net Delta
slots_summary: win, order_by
uses:
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.employee.termination_date
column_formats:
  Month:
    kind: text
  Hires:
    kind: integer
  Terms:
    kind: integer
  Net Delta:
    kind: integer
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Hires
  - Terms
  - Net Delta
