id: bp-timeoff-funnel
intent: Time-off request lifecycle funnel counts by status over a request-date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT t.status AS "Status",
         COUNT(*) AS "Request Count"
  FROM dbpcm_warehouse.time_off_request AS t
  WHERE toDate32(t.request_date) BETWEEN {window_start} AND {window_end}
  GROUP BY t.status
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Request Count"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Request Count"
                     END ASC
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: window, order_direction
uses:
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.request_date
