id: bp-accrual-code-dictionary
intent: Distinct accrual codes with descriptions and counts of employees who hold each bank type
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    b.accrual_code AS "Accrual Code",
    any(b.accrual_description) AS "Accrual Description",
    COUNT(DISTINCT b.employee_code) AS "Holder Count"
  FROM dbpcm_warehouse.time_off_balance AS b
  WHERE
    NOT (
      b.accrual_code IS NULL
    ) AND b.accrual_code <> ''
  GROUP BY
    b.accrual_code
  ORDER BY {order_by}
slots:
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Holder Count DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Holder Count
    direction: DESC
  allowed_columns:
  - Accrual Code
  - Accrual Description
  - Holder Count
slots_summary: order_by
uses:
- dbpcm_warehouse.time_off_balance.accrual_code
- dbpcm_warehouse.time_off_balance.accrual_description
- dbpcm_warehouse.time_off_balance.employee_code
column_formats:
  Accrual Code:
    kind: identifier
  Accrual Description:
    kind: text
  Holder Count:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Accrual Code
  measure_columns:
  - Holder Count
