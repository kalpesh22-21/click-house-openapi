id: bp-pending-timeoff-queue
intent: Pending time-off requests queue with days waiting since submission, optionally filtered by department; Days
  Waiting is the oldest pending submission in each employee/request-date group
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT t.employee_code AS "Employee Code",
         any(e.employee_name) AS "Employee Name",
         any(e.department_name) AS "Department",
         toDate32(t.request_date) AS "Request Date",
         round(SUM(t.hours), 2) AS "Pending Hours",
         max(dateDiff('day', t.date_added, today())) AS "Days Waiting"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e ON e.employee_code = t.employee_code
  WHERE t.status = 'Requested'
    AND e.department_name = {dept}
    AND dateDiff('day', t.date_added, today()) >= {min_wait}
  GROUP BY t.employee_code,
           toDate32(t.request_date)
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Request Date"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Request Date"
                     END ASC
slots:
- name: dept
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: min_wait
  type: nonnegative_integer
  required: false
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: dept, min_wait, order_direction
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.date_added
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
