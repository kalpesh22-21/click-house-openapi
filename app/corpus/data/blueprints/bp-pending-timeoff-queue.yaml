id: bp-pending-timeoff-queue
intent: Pending time-off requests queue with days waiting since submission, optionally filtered by department; Days
  Waiting is the oldest pending submission in each employee/request-date group
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    t.employee_code AS "Employee Code",
    any(e.employee_name) AS "Employee Name",
    any(e.department_name) AS "Department",
    toDate32(t.request_date) AS "Request Date",
    round(SUM(t.hours), 2) AS "Pending Hours",
    max(DATE_DIFF(DAY, t.date_added, today())) AS "Days Waiting"
  FROM dbpcm_warehouse.time_off_request AS t
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = t.employee_code
  WHERE
    t.status = 'Requested'
    AND t.event_type IN ({event_type})
    AND e.department_name IN ({dept})
    AND DATE_DIFF(DAY, t.date_added, today()) >= {min_wait}
  GROUP BY
    t.employee_code,
    toDate32(t.request_date)
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: dept
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: min_wait
  type: nonnegative_integer
  required: false
  optional_pattern: 'TRUE'
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Days Waiting DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Days Waiting
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Department
  - Request Date
  - Pending Hours
  - Days Waiting
slots_summary: top_n, dept, min_wait, event_type, order_by
uses:
- dbpcm_warehouse.time_off_request.employee_code
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
- dbpcm_warehouse.time_off_request.date_added
- dbpcm_warehouse.time_off_request.hours
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Request Date:
    kind: date
  Pending Hours:
    kind: number
    unit: hours
    precision: 2
  Days Waiting:
    kind: number
    unit: days
    precision: 2
presentation:
  kind: table
