id: bp-hires-in-range
intent: New hires per month within an explicit start/end date range
slots_summary: hire_window
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.employee.employee_status
slots:
- name: hire_window
  type: period_range
  required: true
result_grain:
- month
sql_template: |
  SELECT toStartOfMonth(most_recent_hire_date) AS month,
         COUNT(DISTINCT employee_code) AS hires
  FROM dbpcm_warehouse.employee
  WHERE most_recent_hire_date >= {hire_window_start}
    AND most_recent_hire_date < {hire_window_end}
    AND (employee_status != 'N' OR employee_status IS NULL)
  GROUP BY toStartOfMonth(most_recent_hire_date)
