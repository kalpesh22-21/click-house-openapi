id: bp-ot-two-basis-tieout
intent: Reconcile payroll register overtime dollars against timecard overtime category dollars per pay period per
  employee, with variance and percentage difference
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  WITH period_bounds AS
    (SELECT any(pay_period_start_date) AS start_dt,
            any(pay_period_end_date) AS end_dt
     FROM dbpcm_warehouse.payroll
     WHERE pay_period_end_date = {period}),
       register_ot AS
    (SELECT employee_code,
            round(toFloat64(SUM(amount)), 2) AS reg_amount
     FROM dbpcm_warehouse.payroll
     WHERE register_type = 'EARN'
       AND type_code IN
         (SELECT earn_code
          FROM dbpcm_warehouse.earning_category FINAL
          WHERE category_name = {overtime_category})
       AND pay_period_end_date = {period}
     GROUP BY employee_code),
       te_ot AS
    (SELECT te.employee_code,
            round(toFloat64(SUM(te.earn_amount)), 2) AS te_amount
     FROM
       (SELECT employee_code,
               punch_date,
               earn_amount,
               earn_code
        FROM dbpcm_warehouse.total_earning) AS te
     CROSS JOIN period_bounds pb
     WHERE te.earn_code IN
         (SELECT earn_code
          FROM dbpcm_warehouse.earning_category FINAL
          WHERE category_name = {overtime_category})
       AND te.punch_date BETWEEN pb.start_dt AND pb.end_dt
     GROUP BY te.employee_code)
  SELECT COALESCE(r.employee_code, t.employee_code) AS "Employee Code",
         max(e.employee_name) AS "Employee Name", {period} AS "Pay Period End",
                                                   round(COALESCE(r.reg_amount, 0), 2) AS "Register OT",
                                                   round(COALESCE(t.te_amount, 0), 2) AS "Timecard OT",
                                                   round(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0), 2) AS "Difference",
                                                   round(abs(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0)) / nullIf(COALESCE(r.reg_amount, 0), 0) * 100, 2) AS "Pct Diff"
  FROM register_ot r
  FULL OUTER JOIN te_ot t ON t.employee_code = r.employee_code
  LEFT JOIN dbpcm_warehouse.employee e ON e.employee_code = COALESCE(r.employee_code, t.employee_code)
  GROUP BY COALESCE(r.employee_code, t.employee_code), {period}, r.reg_amount,
                                                                 t.te_amount
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN abs(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0))
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN abs(COALESCE(t.te_amount, 0) - COALESCE(r.reg_amount, 0))
                     END ASC
  LIMIT {top_n}
slots:
- name: period
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
- name: top_n
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
- name: overtime_category
  type: entity
  required: true
  binds_to: dbpcm_warehouse.earning_category.category_name
  description: Resolve the requested overtime concept to this client's category label; do not invent earning codes.
slots_summary: period, top_n, order_direction, overtime_category
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.pay_period_start_date
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Pay Period End:
    kind: date
  Register OT:
    kind: currency
    currency: USD
    precision: 2
  Timecard OT:
    kind: currency
    currency: USD
    precision: 2
  Difference:
    kind: currency
    currency: USD
    precision: 2
  Pct Diff:
    kind: percent
    scale: percent
    precision: 2
