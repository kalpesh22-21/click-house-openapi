id: bp-payroll-duplicate-line-audit
intent: Candidate duplicate payroll register lines grouped by employee, period, register type, type code, and amount,
  with occurrence counts
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    pay_period_end_date AS "Pay Period End",
    register_type AS "Register Type",
    type_code AS "Type Code",
    amount AS "Amount",
    count() AS "Duplicate Count"
  FROM dbpcm_warehouse.payroll
  WHERE
    pay_period_end_date = {period}
  GROUP BY
    employee_code,
    pay_period_end_date,
    register_type,
    type_code,
    amount
  HAVING
    count() > 1
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Duplicate Count DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Duplicate Count
    direction: DESC
  allowed_columns:
  - Employee Code
  - Pay Period End
  - Register Type
  - Type Code
  - Amount
  - Duplicate Count
slots_summary: top_n, period, order_by
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Employee Code:
    kind: identifier
  Pay Period End:
    kind: date
  Register Type:
    kind: text
  Type Code:
    kind: identifier
  Amount:
    kind: currency
    currency: USD
    precision: 2
  Duplicate Count:
    kind: integer
presentation:
  kind: table
