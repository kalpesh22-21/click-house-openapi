id: bp-shift-differential-spend
intent: Shift-differential dollars and hours from the payroll register, resolving earn codes dynamically against
  type_code for a date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    round(SUM(p.amount), 2) AS "Shift Differential Dollars",
    round(SUM(p.type_hours), 2) AS "Shift Differential Hours"
  FROM dbpcm_warehouse.payroll AS p
  WHERE
    p.register_type = 'EARN'
    AND p.type_code IN (
      SELECT
        earn_code
      FROM dbpcm_warehouse.earning_category
      WHERE
        category_name IN ({shift_category})
    )
    AND (
      p.pay_period_end_date >= {window_start} AND p.pay_period_end_date < {window_end}
    )
  ORDER BY {order_by}
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: shift_category
  type: entity
  required: true
  binds_to: dbpcm_warehouse.earning_category.category_name
  description: Resolve the requested shift concept to this client's category label; do not invent earning codes.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Shift Differential Dollars ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Shift Differential Dollars
    direction: ASC
  allowed_columns:
  - Shift Differential Dollars
  - Shift Differential Hours
slots_summary: window, shift_category, order_by
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_hours
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Shift Differential Dollars:
    kind: currency
    currency: USD
  Shift Differential Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: facts
  measure_columns:
  - Shift Differential Dollars
  - Shift Differential Hours
