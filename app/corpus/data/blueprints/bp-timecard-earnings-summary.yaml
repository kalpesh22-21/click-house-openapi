id: bp-timecard-earnings-summary
intent: 'Total timecard earnings, paid hours, entry counts and employee counts by company, employee, allocated department,
  day, month or earning code. Supports per-person hours and pay in a period and monthly labor-cost trends. Uses
  daily total_earning entries: in-progress earnings finalized and moved to payroll after period close. Use payroll
  earnings for finalized periods. Do not add both lifecycle stages for the same earnings. This template does not
  infer period-close status or switch sources. Amount is not net pay, annual salary or proof of payment. Optional
  earning_code is client-defined: resolve regular/overtime concepts, never hardcode a universal OT code. No average-rate
  calculation across unlike earning codes. Required half-open punch-date period and resolved table_source prevent
  accidental cross-source double counting. MCP handles storage-version deduplication; this does not remove overlapping
  real-world events. Department means recorded labor-allocation department code, not current home department. No
  scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove completeness;
  missing days/months are not zero-filled.'
slots_summary: group_by, period, source, employee, department, earning_code, pay_class, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.total_earning.department_code
- dbpcm_warehouse.total_earning.earn_amount
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.pay_class_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.table_source
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - employee
  - department
  - day
  - month
  - earning_code
- name: period
  type: period_range
  temporal_type: date
  required: true
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: source
  type: entity
  required: true
  binds_to: dbpcm_warehouse.total_earning.table_source
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.total_earning.employee_code
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.total_earning.department_code
  optional_pattern: 'TRUE'
  multiple: true
- name: earning_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.total_earning.earn_code
  optional_pattern: 'TRUE'
  multiple: true
- name: pay_class
  type: entity
  required: false
  binds_to: dbpcm_warehouse.total_earning.pay_class_code
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Group
    direction: ASC
  allowed_columns:
  - Group
  - Timecard Earning Amount
  - Paid Hours
  - Entry Count
  - Employee Count
  - Observed Days
  - First Observed Date
  - Last Observed Date
result_grain:
- Group
sql_template: |
  SELECT
    CASE
      WHEN {group_by} = 'employee'
      THEN employee_code
      WHEN {group_by} = 'department'
      THEN department_code
      WHEN {group_by} = 'day'
      THEN toString(punch_date)
      WHEN {group_by} = 'month'
      THEN SUBSTRING(toString(punch_date), 1, 7)
      WHEN {group_by} = 'earning_code'
      THEN earn_code
      ELSE 'Company'
    END AS "Group",
    sum(earn_amount) AS "Timecard Earning Amount",
    sum(earn_hours) AS "Paid Hours",
    count(*) AS "Entry Count",
    count(DISTINCT employee_code) AS "Employee Count",
    count(DISTINCT punch_date) AS "Observed Days",
    min(punch_date) AS "First Observed Date",
    max(punch_date) AS "Last Observed Date"
  FROM dbpcm_warehouse.total_earning
  WHERE
    punch_date >= toDate({period_start})
    AND punch_date < toDate({period_end})
    AND table_source IN ({source})
    AND employee_code = {employee}
    AND department_code IN ({department})
    AND earn_code IN ({earning_code})
    AND pay_class_code IN ({pay_class})
  GROUP BY
    CASE
      WHEN {group_by} = 'employee'
      THEN employee_code
      WHEN {group_by} = 'department'
      THEN department_code
      WHEN {group_by} = 'day'
      THEN toString(punch_date)
      WHEN {group_by} = 'month'
      THEN SUBSTRING(toString(punch_date), 1, 7)
      WHEN {group_by} = 'earning_code'
      THEN earn_code
      ELSE 'Company'
    END
  ORDER BY {order_by}
column_formats:
  Group:
    kind: text
  Timecard Earning Amount:
    kind: currency
    currency: USD
  Paid Hours:
    kind: number
    unit: hours
    precision: 2
  Entry Count:
    kind: integer
  Employee Count:
    kind: integer
  Observed Days:
    kind: integer
  First Observed Date:
    kind: date
  Last Observed Date:
    kind: date
presentation:
  kind: bars
  category_columns:
  - Group
  measure_columns:
  - Timecard Earning Amount
  by_group_by:
    company: figure
    day: line
    month: line
