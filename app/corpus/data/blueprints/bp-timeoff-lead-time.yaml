id: bp-timeoff-lead-time
intent: Median days from submission date to requested leave date by leave type for approved requests
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    t.earn_description AS "Leave Type",
    t.earn_code AS "Earn Code",
    round(
      (
        quantileExactLow(0.5)(t.lead_days) + quantileExactHigh(0.5)(t.lead_days)
      ) / 2,
      1
    ) AS "Median Lead Days",
    COUNT(*) AS "Request Days"
  FROM (
    SELECT
      earn_description,
      earn_code,
      DATE_DIFF(DAY, date_added, request_date) AS lead_days
    FROM dbpcm_warehouse.time_off_request
    WHERE
      status = 'Approved'
      AND event_type IN ({event_type})
      AND NOT (
        request_date IS NULL
      )
      AND toDate32(request_date) > toDate32('1900-01-01')
      AND (
        toDate32(request_date) >= {window_start}
        AND toDate32(request_date) < {window_end}
      )
  ) AS t
  GROUP BY
    t.earn_description,
    t.earn_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: event_type
  type: enum
  required: false
  enum_values:
  - Time Off Request
  - Payout Request
  default:
  - Time Off Request
  description: Accrual event category to count. Defaults to Time Off Request; use Payout Request only when payouts
    are explicitly requested.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Median Lead Days DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Median Lead Days
    direction: DESC
  allowed_columns:
  - Leave Type
  - Earn Code
  - Median Lead Days
  - Request Days
slots_summary: top_n, window, event_type, order_by
uses:
- dbpcm_warehouse.time_off_request.date_added
- dbpcm_warehouse.time_off_request.request_date
- dbpcm_warehouse.time_off_request.earn_code
- dbpcm_warehouse.time_off_request.earn_description
- dbpcm_warehouse.time_off_request.status
- dbpcm_warehouse.time_off_request.event_type
column_formats:
  Leave Type:
    kind: text
  Earn Code:
    kind: identifier
  Median Lead Days:
    kind: number
    unit: days
    precision: 2
  Request Days:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Leave Type
  measure_columns:
  - Median Lead Days
