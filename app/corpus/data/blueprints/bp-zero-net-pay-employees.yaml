id: bp-zero-net-pay-employees
intent: Employees with exactly $0.00 net pay in a pay period, distinguishing those with no net-pay-distribution
  rows from those with a zero net-pay amount
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code"
  FROM dbpcm_warehouse.payroll
  WHERE
    pay_period_end_date = {period}
  GROUP BY
    employee_code
  HAVING
    SUMIf(amount, register_type = 'EARN') > 0
    AND SUMIf(amount, register_type = 'NETPAYDIST') = 0
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
slots_summary: top_n, period, order_by
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Employee Code:
    kind: identifier
presentation:
  kind: table
