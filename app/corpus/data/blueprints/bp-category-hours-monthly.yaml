id: bp-category-hours-monthly
intent: Monthly trend of paid hours for a specific earning category (such as Sick or Vacation) from timecard earnings,
  bucketed by punch date month
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(addDays(te.punch_date, 1 - toDayOfMonth(te.punch_date)), '%Y-%m') AS "Month",
    round(SUM(te.earn_hours), 2) AS "Total Hours"
  FROM (
    SELECT
      punch_date,
      earn_code,
      earn_hours
    FROM dbpcm_warehouse.total_earning
  ) AS te
  JOIN (
    SELECT
      earn_code,
      category_name
    FROM dbpcm_warehouse.earning_category
  ) AS ec
    ON ec.earn_code = te.earn_code
  WHERE
    ec.category_name IN ({concept})
    AND te.punch_date >= addMonths((
      SELECT
        max(punch_date)
      FROM dbpcm_warehouse.total_earning
    ), -{win})
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: concept
  type: string
  required: true
  binds_to: dbpcm_warehouse.earning_category.category_name
  multiple: true
- name: win
  type: relative_window
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Total Hours
slots_summary: concept, win, order_by
uses:
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_code
- dbpcm_warehouse.earning_category.earn_code
- dbpcm_warehouse.earning_category.category_name
column_formats:
  Month:
    kind: text
  Total Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Total Hours
