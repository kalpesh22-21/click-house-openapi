id: bp-punch-pair-summary
intent: Matched punch-pair counts, distinct employees, observed days, paid hours and pair earning amount by company,
  employee, allocated department, day, month or hours type. Did this employee have punches in the period? Paid hours
  use earn_hours, not elapsed clock duration. Single-argument distinct counts. Required half-open punch-date period
  and resolved table_source prevent accidental cross-source double counting. FINAL deduplicates storage versions,
  not overlapping real-world events. Department means recorded labor-allocation department code, not current home
  department. No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
  completeness; missing days/months are not zero-filled.
slots_summary: group_by, period, source, employee, department, hours_type, pay_class, in_type, out_type, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.punch_pair.department_code
- dbpcm_warehouse.punch_pair.earn_amount
- dbpcm_warehouse.punch_pair.earn_hours
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.hours_type
- dbpcm_warehouse.punch_pair.in_punch_type
- dbpcm_warehouse.punch_pair.out_punch_type
- dbpcm_warehouse.punch_pair.pay_class_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.punch_pair.table_source
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - employee
  - department
  - day
  - month
  - hours_type
- name: period
  type: period_range
  temporal_type: date
  required: true
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: source
  type: entity
  required: true
  binds_to: dbpcm_warehouse.punch_pair.table_source
  multiple: true
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.employee_code
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.department_code
  optional_pattern: 'TRUE'
  multiple: true
- name: hours_type
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.hours_type
  optional_pattern: 'TRUE'
  multiple: true
- name: pay_class
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.pay_class_code
  optional_pattern: 'TRUE'
  multiple: true
- name: in_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.in_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - ID
  - IL
  - IB
  - IX
  multiple: true
- name: out_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.out_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - OD
  - OL
  - OB
  - OX
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Group ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Group
    direction: ASC
  allowed_columns:
  - Group
  - Pair Count
  - Employee Count
  - Observed Days
  - Paid Hours
  - Pair Earning Amount
  - First Observed Date
  - Last Observed Date
result_grain:
- Group
sql_template: |
  SELECT
    CASE
      WHEN {group_by} = 'employee'
      THEN employee_code
      WHEN {group_by} = 'department'
      THEN department_code
      WHEN {group_by} = 'day'
      THEN toString(punch_date)
      WHEN {group_by} = 'month'
      THEN SUBSTRING(toString(punch_date), 1, 7)
      WHEN {group_by} = 'hours_type'
      THEN hours_type
      ELSE 'Company'
    END AS "Group",
    count(*) AS "Pair Count",
    count(DISTINCT employee_code) AS "Employee Count",
    count(DISTINCT punch_date) AS "Observed Days",
    sum(earn_hours) AS "Paid Hours",
    sum(earn_amount) AS "Pair Earning Amount",
    min(punch_date) AS "First Observed Date",
    max(punch_date) AS "Last Observed Date"
  FROM dbpcm_warehouse.punch_pair
  WHERE
    punch_date >= toDate({period_start})
    AND punch_date < toDate({period_end})
    AND table_source IN ({source})
    AND employee_code = {employee}
    AND department_code IN ({department})
    AND hours_type IN ({hours_type})
    AND pay_class_code IN ({pay_class})
    AND in_punch_type IN ({in_type})
    AND out_punch_type IN ({out_type})
  GROUP BY
    CASE
      WHEN {group_by} = 'employee'
      THEN employee_code
      WHEN {group_by} = 'department'
      THEN department_code
      WHEN {group_by} = 'day'
      THEN toString(punch_date)
      WHEN {group_by} = 'month'
      THEN SUBSTRING(toString(punch_date), 1, 7)
      WHEN {group_by} = 'hours_type'
      THEN hours_type
      ELSE 'Company'
    END
  ORDER BY {order_by}
column_formats:
  Group:
    kind: text
  Pair Count:
    kind: integer
  Employee Count:
    kind: integer
  Observed Days:
    kind: integer
  Paid Hours:
    kind: number
    unit: hours
    precision: 2
  Pair Earning Amount:
    kind: currency
    currency: USD
  First Observed Date:
    kind: date
  Last Observed Date:
    kind: date
presentation:
  kind: bars
  category_columns:
  - Group
  measure_columns:
  - Pair Count
  by_group_by:
    company: figure
    day: line
    month: line
