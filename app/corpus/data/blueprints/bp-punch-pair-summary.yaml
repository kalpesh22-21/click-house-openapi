id: bp-punch-pair-summary
intent: Matched punch-pair counts, distinct employees, observed days, paid hours and pair earning amount by company,
  employee, allocated department, day, month or hours type. Did this employee have punches in the period? Paid hours
  use earn_hours, not elapsed clock duration. Single-argument distinct counts. Required half-open punch-date period
  and resolved table_source prevent accidental cross-source double counting. FINAL deduplicates storage versions,
  not overlapping real-world events. Department means recorded labor-allocation department code, not current home
  department. No scheduled shift, tardiness or overtime policy is inferred. Observed first/last dates do not prove
  completeness; missing days/months are not zero-filled.
slots_summary: group_by, period, source, employee, department, hours_type, pay_class, in_type, out_type
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.punch_pair.department_code
- dbpcm_warehouse.punch_pair.earn_amount
- dbpcm_warehouse.punch_pair.earn_hours
- dbpcm_warehouse.punch_pair.employee_code
- dbpcm_warehouse.punch_pair.hours_type
- dbpcm_warehouse.punch_pair.in_punch_type
- dbpcm_warehouse.punch_pair.out_punch_type
- dbpcm_warehouse.punch_pair.pay_class_code
- dbpcm_warehouse.punch_pair.punch_date
- dbpcm_warehouse.punch_pair.table_source
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - employee
  - department
  - day
  - month
  - hours_type
- name: period
  type: period_range
  required: true
- name: source
  type: entity
  required: true
  binds_to: dbpcm_warehouse.punch_pair.table_source
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.employee_code
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.department_code
  optional_pattern: 'TRUE'
- name: hours_type
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.hours_type
  optional_pattern: 'TRUE'
- name: pay_class
  type: entity
  required: false
  binds_to: dbpcm_warehouse.punch_pair.pay_class_code
  optional_pattern: 'TRUE'
- name: in_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.in_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - ID
  - IL
  - IB
  - IX
- name: out_type
  type: enum
  required: false
  binds_to: dbpcm_warehouse.punch_pair.out_punch_type
  optional_pattern: 'TRUE'
  enum_values:
  - OD
  - OL
  - OB
  - OX
result_grain:
- Group
sql_template: "SELECT CASE {group_by} WHEN 'employee' THEN employee_code WHEN 'department' THEN department_code\
  \ WHEN 'day' THEN toString(punch_date) WHEN 'month' THEN substring(toString(punch_date),1,7) WHEN 'hours_type'\
  \ THEN hours_type ELSE 'Company' END AS `Group`,\ncount(*) AS `Pair Count`, count(DISTINCT employee_code) AS `Employee\
  \ Count`, count(DISTINCT punch_date) AS `Observed Days`,\n sum(earn_hours) AS `Paid Hours`, sum(earn_amount) AS\
  \ `Pair Earning Amount`, min(punch_date) AS `First Observed Date`, max(punch_date) AS `Last Observed Date`\nFROM\
  \ dbpcm_warehouse.punch_pair FINAL\nWHERE punch_date >= toDate({period_start}) AND punch_date < toDate({period_end})\
  \ AND table_source = {source} AND employee_code = {employee} AND department_code = {department} AND hours_type\
  \ = {hours_type} AND pay_class_code = {pay_class} AND in_punch_type = {in_type} AND out_punch_type = {out_type}\n\
  GROUP BY CASE {group_by} WHEN 'employee' THEN employee_code WHEN 'department' THEN department_code WHEN 'day'\
  \ THEN toString(punch_date) WHEN 'month' THEN substring(toString(punch_date),1,7) WHEN 'hours_type' THEN hours_type\
  \ ELSE 'Company' END ORDER BY `Group`"
