id: bp-workforce-diversity-profile
intent: Active headcount distribution across gender, marital status, age band, EEO-1 category and leadership cohort
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    multiIf(gender = '', 'Not Reported', gender) AS "Gender",
    ifNull(nullIf(marital_status_description, ''), 'Not Reported') AS "Marital Status",
    multiIf(
      NOT (
        NOT (
          date_of_birth IS NULL
        )
        AND toDate32(date_of_birth) > toDate32('1900-01-01')
      ),
      'Unknown',
      DATE_DIFF(YEAR, date_of_birth, now()) < 20,
      'Under 20',
      DATE_DIFF(YEAR, date_of_birth, now()) < 30,
      '20-29',
      DATE_DIFF(YEAR, date_of_birth, now()) < 40,
      '30-39',
      DATE_DIFF(YEAR, date_of_birth, now()) < 50,
      '40-49',
      DATE_DIFF(YEAR, date_of_birth, now()) < 60,
      '50-59',
      DATE_DIFF(YEAR, date_of_birth, now()) < 70,
      '60-69',
      '70+'
    ) AS "Age Band",
    eeo1_category AS "EEO-1 Category",
    multiIf(
      eeo1_category IN (
        'Executive/Senior Level Officials and Managers',
        'First/Mid-Level Officials and Managers'
      ),
      'Leadership',
      'All Other'
    ) AS "Leadership Cohort",
    count(DISTINCT employee_code) AS "Headcount",
    round(
      100 * count(DISTINCT employee_code) / sum(count(DISTINCT employee_code)) OVER (),
      2
    ) AS "Share Pct"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND department_name IN ({department})
  GROUP BY
    "Gender",
    "Marital Status",
    "Age Band",
    "EEO-1 Category",
    "Leadership Cohort"
  ORDER BY {order_by}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Gender
  - Marital Status
  - Age Band
  - EEO-1 Category
  - Leadership Cohort
  - Headcount
  - Share Pct
slots_summary: department, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.gender
- dbpcm_warehouse.employee.marital_status_description
- dbpcm_warehouse.employee.date_of_birth
- dbpcm_warehouse.employee.eeo1_category
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Gender:
    kind: text
  Marital Status:
    kind: text
  Age Band:
    kind: text
  EEO-1 Category:
    kind: text
  Leadership Cohort:
    kind: text
  Headcount:
    kind: integer
  Share Pct:
    kind: percent
    scale: percent
    precision: 2
presentation:
  kind: table
