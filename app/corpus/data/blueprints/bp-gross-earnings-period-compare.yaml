id: bp-gross-earnings-period-compare
intent: Compare gross earnings between two pay periods company-wide or filtered by employee home department
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    pay_period_end_date AS "Period",
    round(SUM(p.amount), 2) AS "Gross Earnings"
  FROM dbpcm_warehouse.payroll AS p
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = p.employee_code
  WHERE
    p.register_type = 'EARN'
    AND p.pay_period_end_date IN ({period_a}, {period_b})
    AND e.department_name IN ({dept})
  GROUP BY
    pay_period_end_date
  ORDER BY {order_by}
slots:
- name: period_a
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
- name: period_b
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
- name: dept
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Period ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Period
    direction: ASC
  allowed_columns:
  - Period
  - Gross Earnings
slots_summary: period_a, period_b, dept, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
column_formats:
  Period:
    kind: date
  Gross Earnings:
    kind: currency
    currency: USD
presentation:
  kind: line
  category_columns:
  - Period
  measure_columns:
  - Gross Earnings
