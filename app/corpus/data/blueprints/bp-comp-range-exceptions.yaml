id: bp-comp-range-exceptions
intent: Active Salary-pay-type employees whose recorded annual salary is outside their salary range or below a compa-ratio
  cap
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    department_name AS "Department",
    round(annual_salary, 2) AS "Annual Salary",
    round(salary_min, 2) AS "Range Min",
    round(salary_mid, 2) AS "Range Mid",
    round(salary_max, 2) AS "Range Max",
    round(toFloat64(annual_salary) / nullIf(toFloat64(salary_mid), 0), 3) AS "Compa Ratio"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND department_name IN ({department})
    AND pay_type = 'Salary'
    AND annual_salary > 0
    AND (
      toFloat64(annual_salary) < toFloat64(salary_min)
      OR (
        toFloat64(salary_max) > 0 AND toFloat64(annual_salary) > toFloat64(salary_max)
      )
      OR toFloat64(annual_salary) / nullIf(toFloat64(salary_mid), 0) < {compa_cap_pct} / 100.0
    )
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: compa_cap_pct
  type: positive_integer
  required: true
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Compa Ratio ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Compa Ratio
    direction: ASC
  allowed_columns:
  - Employee Code
  - Department
  - Annual Salary
  - Range Min
  - Range Mid
  - Range Max
  - Compa Ratio
slots_summary: top_n, compa_cap_pct, department, order_by
uses:
- dbpcm_warehouse.employee.pay_type
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.salary_min
- dbpcm_warehouse.employee.salary_mid
- dbpcm_warehouse.employee.salary_max
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Department:
    kind: text
  Annual Salary:
    kind: currency
    currency: USD
    precision: 2
  Range Min:
    kind: currency
    currency: USD
  Range Mid:
    kind: currency
    currency: USD
  Range Max:
    kind: currency
    currency: USD
  Compa Ratio:
    kind: number
    precision: 3
presentation:
  kind: bars
  category_columns:
  - Employee Code
  measure_columns:
  - Annual Salary
