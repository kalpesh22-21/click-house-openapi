id: bp-earnings-monthly-trend
intent: Monthly trend of gross or net payroll earnings over the last N completed pay periods, bucketed by pay-period
  end month
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    formatDateTime(addDays(pay_period_end_date, 1 - toDayOfMonth(pay_period_end_date)), '%Y-%m') AS "Month",
    round(SUM(amount), 2) AS "Total Earnings"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type IN ({register})
    AND pay_period_end_date >= addMonths((
      SELECT
        max(pay_period_end_date)
      FROM dbpcm_warehouse.payroll
    ), -{win})
  GROUP BY
    "Month"
  ORDER BY {order_by}
slots:
- name: win
  type: relative_window
  required: true
- name: register
  type: enum
  required: true
  enum_values:
  - EARN
  - NETPAYDIST
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Month ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Month
    direction: ASC
  allowed_columns:
  - Month
  - Total Earnings
slots_summary: win, register, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.payroll.register_type
column_formats:
  Month:
    kind: text
  Total Earnings:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: line
  category_columns:
  - Month
  measure_columns:
  - Total Earnings
