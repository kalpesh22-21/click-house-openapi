id: bp-accrual-balance-summary
intent: 'Recorded beginning, accrued, awarded and taken plan balances by company, department or plan. Optional accrual
  plan code, employee status, department and employee. Uses taken_amount, never approved event hours. No implicit
  PTO filter: resolve plan code for PTO. No event-date restriction, current-balance formula or assumed units. Cross-plan
  sums require compatible units; otherwise use plan grouping/filter. Preaggregate balance rows by employee/plan
  before LEFT JOIN; preserve source row count without assuming unique plan rows.'
slots_summary: group_by, accrual_code, employee_status, department, employee
status: validated
drift_status: clean
catalog_sha: 0c0c24a9bb5ccc742d3b7f9685607355a6d6a051
uses:
- dbpcm_warehouse.accrual_balances.employee_code
- dbpcm_warehouse.accrual_balances.accrual_code
- dbpcm_warehouse.accrual_balances.beginning_balance
- dbpcm_warehouse.accrual_balances.accrued_amount
- dbpcm_warehouse.accrual_balances.awarded_amount
- dbpcm_warehouse.accrual_balances.taken_amount
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - plan
- name: accrual_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.accrual_balances.accrual_code
  optional_pattern: 'TRUE'
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
result_grain:
- Group
sql_template: "WITH b AS (\n SELECT employee_code, accrual_code, sum(beginning_balance) AS beginning,\n sum(accrued_amount)\
  \ AS accrued, sum(awarded_amount) AS awarded,\n sum(taken_amount) AS taken, count(*) AS balance_rows\n FROM dbpcm_warehouse.accrual_balances\
  \ WHERE accrual_code = {accrual_code}\n GROUP BY employee_code, accrual_code\n)\nSELECT CASE {group_by} WHEN 'department'\
  \ THEN e.department_name WHEN 'plan' THEN b.accrual_code ELSE 'Company' END AS `Group`, sum(CAST(b.beginning AS\
  \ Nullable(Decimal(38, 6)))) AS `Beginning Balance`,\n sum(CAST(b.accrued AS Nullable(Decimal(38, 6)))) AS `Accrued\
  \ Amount`, sum(CAST(b.awarded AS Nullable(Decimal(38, 6)))) AS `Awarded Amount`,\n sum(CAST(b.taken AS Nullable(Decimal(38,\
  \ 6)))) AS `Taken Amount`, sum(CAST(b.balance_rows AS Nullable(Decimal(20, 0)))) AS `Source Balance Rows`,\n uniqExact(b.employee_code)\
  \ AS `Employee Count`\nFROM b LEFT JOIN dbpcm_warehouse.employee e ON b.employee_code = e.employee_code\nWHERE\
  \ e.employee_status = {employee_status} AND e.department_name = {department} AND e.employee_code = {employee}\n\
  GROUP BY CASE {group_by} WHEN 'department' THEN e.department_name WHEN 'plan' THEN b.accrual_code ELSE 'Company'\
  \ END\nORDER BY `Group`\n"
