id: bp-accrual-balance-summary
intent: 'Recorded beginning, accrued, awarded and taken plan balances by company, department or plan. Optional accrual
  plan code, employee status, department and employee. Uses taken_amount, never approved event hours. No implicit
  PTO filter: resolve plan code for PTO. No event-date restriction, current-balance formula or assumed units. Cross-plan
  sums require compatible units; otherwise use plan grouping/filter. Preaggregate balance rows by employee/plan
  before LEFT JOIN; preserve source row count without assuming unique plan rows.'
slots_summary: group_by, accrual_code, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.time_off_balance.employee_code
- dbpcm_warehouse.time_off_balance.accrual_code
- dbpcm_warehouse.time_off_balance.beginning_balance
- dbpcm_warehouse.time_off_balance.accrued_amount
- dbpcm_warehouse.time_off_balance.awarded_amount
- dbpcm_warehouse.time_off_balance.taken_amount
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: group_by
  type: enum
  required: true
  enum_values:
  - company
  - department
  - plan
- name: accrual_code
  type: entity
  required: false
  binds_to: dbpcm_warehouse.time_off_balance.accrual_code
  optional_pattern: 'TRUE'
- name: employee_status
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: 'TRUE'
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Group
sql_template: |
  WITH b AS
    (SELECT employee_code,
            accrual_code,
            sum(beginning_balance) AS beginning,
            sum(accrued_amount) AS accrued,
            sum(awarded_amount) AS awarded,
            sum(taken_amount) AS taken,
            count(*) AS balance_rows
     FROM dbpcm_warehouse.time_off_balance
     WHERE accrual_code = {accrual_code}
     GROUP BY employee_code,
              accrual_code)
  SELECT CASE {group_by}
             WHEN 'department' THEN e.department_name
             WHEN 'plan' THEN b.accrual_code
             ELSE 'Company'
         END AS "Group",
         sum(CAST(b.beginning AS Nullable(Decimal(38, 6)))) AS "Beginning Balance",
         sum(CAST(b.accrued AS Nullable(Decimal(38, 6)))) AS "Accrued Amount",
         sum(CAST(b.awarded AS Nullable(Decimal(38, 6)))) AS "Awarded Amount",
         sum(CAST(b.taken AS Nullable(Decimal(38, 6)))) AS "Taken Amount",
         sum(CAST(b.balance_rows AS Nullable(Decimal(20, 0)))) AS "Source Balance Rows",
         uniqExact(b.employee_code) AS "Employee Count"
  FROM b
  LEFT JOIN dbpcm_warehouse.employee AS e ON b.employee_code = e.employee_code
  WHERE e.employee_status = {employee_status}
    AND e.department_name = {department}
    AND e.employee_code = {employee}
  GROUP BY CASE {group_by}
               WHEN 'department' THEN e.department_name
               WHEN 'plan' THEN b.accrual_code
               ELSE 'Company'
           END
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Group"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Group"
                     END ASC
column_formats:
  Group:
    kind: text
  Beginning Balance:
    kind: number
  Accrued Amount:
    kind: number
  Awarded Amount:
    kind: number
  Taken Amount:
    kind: number
  Source Balance Rows:
    kind: integer
  Employee Count:
    kind: integer
