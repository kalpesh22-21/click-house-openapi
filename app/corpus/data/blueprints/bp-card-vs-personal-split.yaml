id: bp-card-vs-personal-split
intent: Corporate card versus personal expense split for a payment period
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    expense_type AS "Expense Type",
    round(toFloat64(SUM(amount_approved)), 2) AS "Approved Amount"
  FROM dbpcm_warehouse.expense
  WHERE
    expense_type IN ('Personal', 'Corporate Card')
    AND expense_status IN ('Approved', 'Paid', 'Marked as Paid')
    AND expense_paid_date = {period}
  GROUP BY
    expense_type
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: true
  binds_to: dbpcm_warehouse.expense.expense_paid_date
  temporal_type: date
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Approved Amount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Approved Amount
    direction: DESC
  allowed_columns:
  - Expense Type
  - Approved Amount
slots_summary: period, order_by
uses:
- dbpcm_warehouse.expense.expense_type
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Expense Type:
    kind: text
  Approved Amount:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: donut
  category_columns:
  - Expense Type
  measure_columns:
  - Approved Amount
