id: bp-headcount-by-work-city-country
intent: Active headcount by work-location country, state and city
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT work_location_country AS "Country",
         work_location_state AS "State",
         work_location_city AS "City",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND work_location_country = {country}
  GROUP BY work_location_country,
           work_location_state,
           work_location_city
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC
slots:
- name: country
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.work_location_country
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: country, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.work_location_country
- dbpcm_warehouse.employee.work_location_state
- dbpcm_warehouse.employee.work_location_city
- dbpcm_warehouse.employee.employee_status
