id: bp-headcount-by-work-city-country
intent: Active headcount by work-location country, state and city
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    work_location_country AS "Country",
    work_location_state AS "State",
    work_location_city AS "City",
    count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active' AND work_location_country IN ({country})
  GROUP BY
    work_location_country,
    work_location_state,
    work_location_city
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: country
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.work_location_country
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Country
  - State
  - City
  - Headcount
slots_summary: top_n, country, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.work_location_country
- dbpcm_warehouse.employee.work_location_state
- dbpcm_warehouse.employee.work_location_city
- dbpcm_warehouse.employee.employee_status
column_formats:
  Country:
    kind: text
  State:
    kind: text
  City:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: table
