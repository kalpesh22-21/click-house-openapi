id: bp-weekly-overtime-hours
intent: Overtime hours per employee per work week based on total_earning earn_hours, the authoritative hours source,
  with a configurable weekly threshold
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  WITH weekly AS (
    SELECT
      employee_code,
      addDays(punch_date, -(
        DATE_DIFF(DAY, toDate32('1900-01-01'), punch_date) % 7
      )) AS week_start,
      SUM(earn_hours) AS weekly_hours
    FROM (
      SELECT
        employee_code,
        punch_date,
        earn_hours
      FROM dbpcm_warehouse.total_earning
    )
    WHERE
      (
        punch_date >= {window_start} AND punch_date < {window_end}
      )
    GROUP BY
      employee_code,
      addDays(punch_date, -(
        DATE_DIFF(DAY, toDate32('1900-01-01'), punch_date) % 7
      ))
  )
  SELECT
    w.employee_code AS "Employee Code",
    max(e.employee_name) AS "Employee Name",
    w.week_start AS "Week Start",
    round(w.weekly_hours, 2) AS "Weekly Hours",
    round(greatest(w.weekly_hours - {threshold}, 0), 2) AS "Overtime Hours"
  FROM weekly AS w
  LEFT JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = w.employee_code
  WHERE
    w.weekly_hours > {threshold}
  GROUP BY
    w.employee_code,
    w.week_start,
    w.weekly_hours
  ORDER BY {order_by}
  LIMIT {max_rows}
slots:
- name: window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and
    end 2026-04-01; for a complete day, end is the next day.
- name: threshold
  type: positive_integer
  required: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Overtime Hours DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Overtime Hours
    direction: DESC
  allowed_columns:
  - Employee Code
  - Employee Name
  - Week Start
  - Weekly Hours
  - Overtime Hours
slots_summary: window, threshold, max_rows, order_by
uses:
- dbpcm_warehouse.total_earning.employee_code
- dbpcm_warehouse.total_earning.punch_date
- dbpcm_warehouse.total_earning.earn_hours
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Week Start:
    kind: date
  Weekly Hours:
    kind: number
    unit: hours
    precision: 2
  Overtime Hours:
    kind: number
    unit: hours
    precision: 2
presentation:
  kind: table
