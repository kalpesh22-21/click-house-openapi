id: bp-manager-span-of-control
intent: Top-N primary supervisors by number of active direct reports
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    primary_supervisor_ee_code AS "Manager Code",
    any(primary_supervisor_name) AS "Manager",
    count(DISTINCT employee_code) AS "Direct Reports"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND NOT (
      primary_supervisor_ee_code IS NULL
    )
    AND primary_supervisor_ee_code <> ''
  GROUP BY
    primary_supervisor_ee_code
  ORDER BY
    "Direct Reports" DESC,
    "Manager Code"
  LIMIT {top_n}
slots:
- name: top_n
  type: relative_window
  required: true
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
slots_summary: top_n
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.primary_supervisor_ee_code
- dbpcm_warehouse.employee.primary_supervisor_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Manager Code:
    kind: identifier
  Manager:
    kind: text
  Direct Reports:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Manager
  measure_columns:
  - Direct Reports
