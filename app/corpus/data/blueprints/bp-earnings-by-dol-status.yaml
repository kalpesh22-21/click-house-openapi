id: bp-earnings-by-dol-status
intent: Gross earnings by employee DOL status for a pay period, joining the current employee roster
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    e.dol_status_description AS "DOL Status",
    round(SUM(p.amount), 2) AS "Gross Earnings"
  FROM dbpcm_warehouse.payroll AS p
  JOIN dbpcm_warehouse.employee AS e
    ON e.employee_code = p.employee_code
  WHERE
    p.register_type = 'EARN' AND p.pay_period_end_date = {period}
  GROUP BY
    e.dol_status_description
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Gross Earnings DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Gross Earnings
    direction: DESC
  allowed_columns:
  - DOL Status
  - Gross Earnings
slots_summary: period, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.pay_period_end_date
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.dol_status_description
column_formats:
  DOL Status:
    kind: text
  Gross Earnings:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - DOL Status
  measure_columns:
  - Gross Earnings
