id: bp-salary-distribution
intent: Annual compensation histogram by pay type with positive whole-currency band_width. Lower inclusive, upper
  exclusive; percentages use the selected known-compensation population within each pay type. salary_population
  selects recorded (including zero) or positive values. Salary uses annual_salary; Hourly uses hourly_salary and
  estimated annual compensation = hourly_salary * 2080 (40 hours/week, 52 weeks/year; excludes overtime). Keep pay
  types separate. Defaults to Active + On Leave; employee_status overrides or All removes the filter.
slots_summary: band_width, salary_population, employee_status, department, employee, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.annual_salary
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.employee_pay_type
- dbpcm_warehouse.employee.hourly_salary
- dbpcm_warehouse.department.department_name
slots:
- name: band_width
  type: positive_integer
  required: true
  min_value: 1
  max_value: 10000000
- name: salary_population
  type: enum
  required: true
  enum_values:
  - recorded
  - positive
  description: Use recorded (including zero) unless the user explicitly requests positive/nonzero compensation.
- name: employee_status
  description: Omit for Active + On Leave; select a status to override, or All to remove the status filter.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  optional_pattern: e.employee_status IN ('Active', 'On Leave')
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
- name: employee
  type: entity
  required: false
  binds_to: dbpcm_warehouse.employee.employee_code
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
result_grain:
- Lower Bound
- Pay Type
sql_template: |
  SELECT e.employee_pay_type AS `Pay Type`,
         CASE
             WHEN e.employee_pay_type = 'Hourly' THEN 'Estimated annual compensation (2080 hours)'
             WHEN e.employee_pay_type = 'Salary' THEN 'Recorded annual salary'
             ELSE 'Unknown compensation basis'
         END AS `Compensation Basis`,
         floor((CASE
                    WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary
                    WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080
                    ELSE NULL
                END) / {band_width}) * {band_width} AS `Lower Bound`, (floor((CASE
                                                                                  WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary
                                                                                  WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080
                                                                                  ELSE NULL
                                                                              END) / {band_width}) + 1) * {band_width} AS `Upper Bound Exclusive`,
                                                                                                           count(*) AS `Employee Count`,
                                                                                                           100.0 * count(*) / sum(count(*)) OVER (PARTITION BY e.employee_pay_type) AS `Percent Within Pay Type`
  FROM dbpcm_warehouse.employee e
  WHERE (e.employee_status = {employee_status}
         OR {employee_status} = 'All')
    AND e.department_name = {department}
    AND e.employee_code = {employee}
    AND (CASE
             WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary
             WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080
             ELSE NULL
         END) IS NOT NULL
    AND ({salary_population} = 'recorded'
         OR (CASE
                 WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary
                 WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080
                 ELSE NULL
             END) > 0)
  GROUP BY e.employee_pay_type,
           floor((CASE
                      WHEN e.employee_pay_type = 'Salary' THEN e.annual_salary
                      WHEN e.employee_pay_type = 'Hourly' THEN e.hourly_salary * 2080
                      ELSE NULL
                  END) / {band_width})
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN `Lower Bound`
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN `Lower Bound`
                     END ASC
uses_rules:
- compensation_by_pay_type
column_formats:
  Pay Type:
    kind: text
  Compensation Basis:
    kind: text
  Lower Bound:
    kind: currency
    currency: USD
    precision: 2
  Upper Bound Exclusive:
    kind: currency
    currency: USD
    precision: 2
  Employee Count:
    kind: integer
  Percent Within Pay Type:
    kind: percent
    scale: percent
    precision: 2
