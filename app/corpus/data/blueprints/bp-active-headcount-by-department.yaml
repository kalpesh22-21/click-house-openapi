id: bp-active-headcount-by-department
intent: Employee headcount by department, highest first and excluding departments with zero matching employees by
  default. Defaults to Active + On Leave; employee_status selects another status or All to remove the status filter.
  zero_headcount selects Include to also show departments with no matching employees.
slots_summary: department, employee_status, order_direction, zero_headcount
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.department.department_code
- dbpcm_warehouse.department.department_name
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
- name: employee_status
  description: Select Active for active employees. Omit for current employees (Active + On Leave); All removes the
    status filter.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  optional_pattern: employee_status IN ('Active', 'On Leave')
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for headcount. Defaults to DESC (highest headcount first).
- name: zero_headcount
  type: enum
  required: false
  enum_values:
  - Exclude
  - Include
  default: Exclude
  description: Exclude departments with zero employees matching the selected status by default. Select Include to
    show all departments, including unstaffed departments.
uses_rules:
- default_employee_population
result_grain:
- Department Code
sql_template: |
  SELECT d.department_code AS "Department Code",
         d.department_name AS "Department",
         coalesce(e.active_count, 0) AS "Headcount"
  FROM dbpcm_warehouse.department AS d
  LEFT JOIN
    (SELECT department_code,
            uniqExact(employee_code) AS active_count
     FROM dbpcm_warehouse.employee
     WHERE (employee_status = {employee_status}
            OR {employee_status} = 'All')
     GROUP BY department_code) AS e ON d.department_code = e.department_code
  WHERE d.department_name = {department}
    AND ({zero_headcount} = 'Include' OR coalesce(e.active_count, 0) > 0)
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC, "Department",
                              "Department Code"
column_formats:
  Department Code:
    kind: identifier
  Department:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Headcount
