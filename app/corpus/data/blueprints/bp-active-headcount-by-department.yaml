id: bp-active-headcount-by-department
intent: Employee headcount by department, including departments with no matching employees. Defaults to Active +
  On Leave; employee_status selects another status or All to remove the filter.
slots_summary: department, employee_status, order_direction
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.department.department_code
- dbpcm_warehouse.department.department_name
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
- name: employee_status
  description: Select Active for active employees. Omit for current employees (Active + On Leave); All removes the status filter.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  optional_pattern: employee_status IN ('Active', 'On Leave')
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
uses_rules:
- default_employee_population
result_grain:
- department_code
sql_template: |
  SELECT d.department_code AS department_code,
         d.department_name AS department,
         coalesce(e.active_count, 0) AS headcount
  FROM dbpcm_warehouse.department AS d
  LEFT JOIN
    (SELECT department_code,
            uniqExact(employee_code) AS active_count
     FROM dbpcm_warehouse.employee
     WHERE (employee_status = {employee_status}
            OR {employee_status} = 'All')
     GROUP BY department_code) AS e ON d.department_code = e.department_code
  WHERE d.department_name = {department}
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN headcount
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN headcount
                     END ASC, department,
                              department_code
column_formats:
  department_code:
    kind: identifier
  department:
    kind: text
  headcount:
    kind: integer
