id: bp-active-headcount-by-department
intent: Employee headcount by department, highest first and excluding departments with zero matching employees by
  default. Defaults to Active + On Leave; employee_status selects another status or All to remove the status filter.
  zero_headcount selects Include to also show departments with no matching employees.
slots_summary: top_n, department, employee_status, zero_headcount, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_code
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.department.department_code
- dbpcm_warehouse.department.department_name
slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  binds_to: dbpcm_warehouse.employee.employee_status
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  multiple: true
  default:
  - Active
  - On Leave
- name: zero_headcount
  type: enum
  required: false
  enum_values:
  - Exclude
  - Include
  default: Exclude
  description: Exclude departments with zero employees matching the selected status by default. Select Include to
    show all departments, including unstaffed departments.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Headcount DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Headcount
    direction: DESC
  allowed_columns:
  - Department Code
  - Department
  - Headcount
uses_rules:
- default_employee_population
result_grain:
- Department Code
sql_template: |+
  SELECT
    d.department_code AS "Department Code",
    d.department_name AS "Department",
    coalesce(e.active_count, 0) AS "Headcount"
  FROM dbpcm_warehouse.department AS d
  LEFT JOIN (
    SELECT
      department_code,
      uniqExact(employee_code) AS active_count
    FROM dbpcm_warehouse.employee
    WHERE
      (
        employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
      )
    GROUP BY
      department_code
  ) AS e
    ON d.department_code = e.department_code
  WHERE
    d.department_name IN ({department})
    AND (
      {zero_headcount} = 'Include' OR coalesce(e.active_count, 0) > 0
    )
  ORDER BY {order_by}
  LIMIT {top_n}

column_formats:
  Department Code:
    kind: identifier
  Department:
    kind: text
  Headcount:
    kind: integer
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Headcount
