id: bp-earnings-by-department-via-scratch-join
intent: Total earnings by department, materializing per-employee earnings and joining departments
slots_summary: department, order_by
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.payroll.employee_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.department.department_name
slots:
- name: department
  type: string
  required: true
  binds_to: dbpcm_warehouse.department.department_name
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Earnings DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Earnings
    direction: DESC
  allowed_columns:
  - Department
  - Total Earnings
result_grain:
- Department
composes:
- order: 0
  output:
    emp_earnings: table
  sql_template: |
    SELECT toString(p.employee_code) AS employee_code,
           toFloat64(SUM(p.amount)) AS earnings
    FROM dbpcm_warehouse.payroll AS p
    WHERE p.register_type = 'EARN'
    GROUP BY p.employee_code
- order: 1
  feeds_from:
  - 0
  consumes:
    emp_earnings: $0
  output: {}
  sql_template: |
    SELECT
      e.department_name AS "Department",
      SUM(x.earnings) AS "Total Earnings"
    FROM scratch.emp_earnings AS x
    JOIN dbpcm_warehouse.employee AS e
      ON e.employee_code = x.employee_code
    WHERE
      e.department_name IN ({department})
    GROUP BY
      e.department_name
    ORDER BY {order_by}
column_formats:
  Department:
    kind: text
  Total Earnings:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Department
  measure_columns:
  - Total Earnings
