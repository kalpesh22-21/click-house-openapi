id: bp-latest-hired-employees
intent: Latest hired employee list ordered by most recent hire date, including rehires. Defaults to Active + On
  Leave. Excludes missing/sentinel and future hire dates. row_limit is the requested top N; original hire is not
  the ranking date.
slots_summary: row_limit, employee_status, department
status: validated
drift_status: clean
catalog_sha: ''
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
- dbpcm_warehouse.employee.most_recent_hire_date
- dbpcm_warehouse.department.department_name
slots:
- name: row_limit
  type: positive_integer
  required: true
  min_value: 1
  max_value: 1000
  description: This blueprint has a fixed ranking defined by its purpose; this slot only limits that ranking. It
    does not accept order_by or order_direction. A different selection or display order requires a separate query.
- name: employee_status
  description: Defaults to Active and On Leave. Omit this slot or send [Active, On Leave] for both; send a list
    of specific statuses to select another population. All removes the status filter and must be supplied alone.
  type: enum
  required: false
  enum_values:
  - Active
  - Deceased
  - Inactive
  - Retired
  - Terminated
  - On Leave
  - Not Hired
  - Prehire
  - Unknown
  - All
  binds_to: dbpcm_warehouse.employee.employee_status
  multiple: true
  default:
  - Active
  - On Leave
- name: department
  type: entity
  required: false
  binds_to: dbpcm_warehouse.department.department_name
  optional_pattern: 'TRUE'
  description: Resolve department names/abbreviations against the directory; a known department may have no matching
    employees.
  multiple: true
result_grain:
- Employee Code
sql_template: |
  SELECT
    e.employee_code AS "Employee Code",
    e.employee_name AS "Employee Name",
    e.department_name AS "Department",
    e.employee_status AS "Status",
    e.most_recent_hire_date AS "Most Recent Hire Date"
  FROM dbpcm_warehouse.employee AS e
  WHERE
    (
      e.employee_status IN ({employee_status}) OR 'All' IN ({employee_status})
    )
    AND e.department_name IN ({department})
    AND e.most_recent_hire_date > toDate('1900-01-01')
    AND e.most_recent_hire_date <= now()
  ORDER BY
    e.most_recent_hire_date DESC,
    e.employee_code
  LIMIT {row_limit}
uses_rules:
- default_employee_population
- missing_date_sentinel
column_formats:
  Employee Code:
    kind: identifier
  Employee Name:
    kind: text
  Department:
    kind: text
  Status:
    kind: text
  Most Recent Hire Date:
    kind: datetime
presentation:
  kind: table
