id: bp-deduction-breakdown
intent: Total payroll deductions and breakdown by deduction type code for a pay period, from register deduction
  lines
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    type_code AS "Deduction Code",
    round(SUM(amount), 2) AS "Total Deductions"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type = 'DDUCT' AND pay_period_end_date = {period}
  GROUP BY
    type_code
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
- name: top_n
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Deductions DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Deductions
    direction: DESC
  allowed_columns:
  - Deduction Code
  - Total Deductions
slots_summary: period, top_n, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.type_code
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Deduction Code:
    kind: identifier
  Total Deductions:
    kind: currency
    currency: USD
presentation:
  kind: bars
  category_columns:
  - Deduction Code
  measure_columns:
  - Total Deductions
