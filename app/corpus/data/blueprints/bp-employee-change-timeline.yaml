id: bp-employee-change-timeline
intent: Chronological audit timeline of master-data changes for a single employee, showing changed field, record
  time, effective date, and change actor
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  /* Output aliases are Title-Case display names; consumers keying on column names */
  /* must use the quoted aliases. */
  SELECT
    changed_field AS "Changed Field",
    change_time_added AS "Record Date",
    effective_date AS "Effective Date",
    change_by_username AS "Changed By",
    change_by_usertype AS "User Type",
    change_description AS "Description"
  FROM dbpcm_warehouse.employee_change
  WHERE
    employee_code = {ee}
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: ee
  type: string
  required: true
  binds_to: dbpcm_warehouse.employee_change.employee_code
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Record Date DESC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Record Date
    direction: DESC
  allowed_columns:
  - Changed Field
  - Record Date
  - Effective Date
  - Changed By
  - User Type
  - Description
slots_summary: ee, max_rows, order_by
uses:
- dbpcm_warehouse.employee_change.employee_code
- dbpcm_warehouse.employee_change.changed_field
- dbpcm_warehouse.employee_change.change_description
- dbpcm_warehouse.employee_change.change_time_added
- dbpcm_warehouse.employee_change.effective_date
- dbpcm_warehouse.employee_change.change_by_username
- dbpcm_warehouse.employee_change.change_by_usertype
column_formats:
  Changed Field:
    kind: text
  Record Date:
    kind: datetime
  Effective Date:
    kind: date
  Changed By:
    kind: text
  User Type:
    kind: text
  Description:
    kind: text
presentation:
  kind: table
