id: bp-headcount-by-dol-status
intent: Active headcount by DOL status (Full/Part-time DOL status) from employee.dol_status_description
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT dol_status_description AS "DOL Status",
         count(DISTINCT employee_code) AS "Headcount"
  FROM dbpcm_warehouse.employee
  WHERE employee_status = 'Active'
    AND department_name = {department}
  GROUP BY "DOL Status"
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Headcount"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Headcount"
                     END ASC, "DOL Status"
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: department, order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.dol_status_description
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  DOL Status:
    kind: text
  Headcount:
    kind: integer
