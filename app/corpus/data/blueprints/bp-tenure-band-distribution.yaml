id: bp-tenure-band-distribution
intent: Active headcount by seniority-date tenure band
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    multiIf(
      NOT (
        NOT (
          seniority_date IS NULL
        )
        AND toDate32(seniority_date) > toDate32('1900-01-01')
      ),
      'Unknown',
      yrs < 1,
      'Under 1 Year',
      yrs < 3,
      '1-3 Years',
      yrs < 5,
      '3-5 Years',
      yrs < 10,
      '5-10 Years',
      yrs < 20,
      '10-20 Years',
      '20+ Years'
    ) AS "Tenure Band",
    count(DISTINCT employee_code) AS "Headcount",
    min(
      CASE
        WHEN NOT (
          seniority_date IS NULL
        )
        AND toDate32(seniority_date) > toDate32('1900-01-01')
        THEN yrs
        ELSE NULL
      END
    ) AS "Band Start"
  FROM (
    SELECT
      employee_code,
      seniority_date,
      DATE_DIFF(DAY, seniority_date, now()) / 365.25 AS yrs
    FROM dbpcm_warehouse.employee
    WHERE
      employee_status = 'Active' AND department_name IN ({department})
  )
  GROUP BY
    "Tenure Band"
  ORDER BY {order_by}
slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Band Start ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Band Start
    direction: ASC
  allowed_columns:
  - Tenure Band
  - Headcount
  - Band Start
slots_summary: department, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.seniority_date
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Tenure Band:
    kind: text
  Headcount:
    kind: integer
  Band Start:
    kind: number
    unit: years
presentation:
  kind: bars
  category_columns:
  - Tenure Band
  measure_columns:
  - Headcount
