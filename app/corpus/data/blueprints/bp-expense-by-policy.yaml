id: bp-expense-by-policy
intent: Approved expense spend by policy description ranked for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT expense_policy_description AS "Policy",
         round(toFloat64(SUM(amount_approved)), 2) AS "Approved Spend",
         count() AS "Line Count"
  FROM dbpcm_warehouse.expense
  WHERE expense_status IN ('Approved',
                           'Paid',
                           'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date <= {expense_window_end}
  GROUP BY expense_policy_description
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Approved Spend"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Approved Spend"
                     END ASC, "Policy"
  LIMIT {top_n}
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
- name: top_n
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: expense_window, top_n, order_direction
uses:
- dbpcm_warehouse.expense.expense_policy_description
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
