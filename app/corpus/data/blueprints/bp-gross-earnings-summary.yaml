id: bp-gross-earnings-summary
intent: Total gross earnings for a single pay period, summed from payroll register earnings lines by pay-period
  bounds
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT round(SUM(amount), 2) AS "Total Gross Earnings"
  FROM dbpcm_warehouse.payroll
  WHERE register_type = 'EARN'
    AND pay_period_end_date = {period}
slots:
- name: period
  type: period
  required: false
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
  optional_pattern: 'TRUE'
slots_summary: period
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Total Gross Earnings:
    kind: currency
    currency: USD
