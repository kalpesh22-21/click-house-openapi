id: bp-name-identity-audit
intent: Active employees whose preferred name differs from their legal name
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Legal Name",
    concatWithSeparator(' ', nullIf(preferred_first_name, ''), nullIf(preferred_last_name, '')) AS "Preferred Name",
    department_name AS "Department"
  FROM dbpcm_warehouse.employee
  WHERE
    employee_status = 'Active'
    AND department_name IN ({department})
    AND NOT (
      nullIf(preferred_first_name, '') IS NULL
    )
    AND (
      preferred_first_name <> first_name
      OR nullIf(preferred_last_name, '') <> last_name
    )
  ORDER BY {order_by}
  LIMIT {max_rows}

slots:
- name: department
  type: string
  required: false
  binds_to: dbpcm_warehouse.employee.department_name
  optional_pattern: 'TRUE'
  multiple: true
- name: max_rows
  type: positive_integer
  required: true
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Employee Code ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Employee Code
    direction: ASC
  allowed_columns:
  - Employee Code
  - Legal Name
  - Preferred Name
  - Department
slots_summary: department, max_rows, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.preferred_first_name
- dbpcm_warehouse.employee.preferred_last_name
- dbpcm_warehouse.employee.first_name
- dbpcm_warehouse.employee.last_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.employee_status
column_formats:
  Employee Code:
    kind: identifier
  Legal Name:
    kind: text
  Preferred Name:
    kind: text
  Department:
    kind: text
presentation:
  kind: table
