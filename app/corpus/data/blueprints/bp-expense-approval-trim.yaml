id: bp-expense-approval-trim
intent: Submitted versus approved amount delta by expense rule for a payment date window
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT expense_rule_description AS "Expense Rule",
         round(toFloat64(SUM(amount_approved)), 2) AS "Approved Total",
         round(toFloat64(SUM(amount_requested)), 2) AS "Submitted Total",
         round(toFloat64(SUM(amount_requested - amount_approved)), 2) AS "Trimmed Total"
  FROM dbpcm_warehouse.expense
  WHERE expense_status IN ('Approved',
                           'Paid',
                           'Marked as Paid')
    AND expense_paid_date >= {expense_window_start}
    AND expense_paid_date < {expense_window_end}
  GROUP BY expense_rule_description
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN "Trimmed Total"
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN "Trimmed Total"
                     END ASC, "Expense Rule"
  LIMIT {max_rows}
slots:
- name: expense_window
  type: period_range
  required: true
  temporal_type: date
  description: Start is inclusive and end is exclusive. For January 1 through March 31, use start 2026-01-01 and end 2026-04-01; for a complete day, end is the next day.
- name: max_rows
  type: positive_integer
  required: true
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: DESC
  description: Sort direction for the primary ORDER BY column. Defaults to DESC (highest first).
slots_summary: expense_window, max_rows, order_direction
uses:
- dbpcm_warehouse.expense.amount_approved
- dbpcm_warehouse.expense.amount_requested
- dbpcm_warehouse.expense.expense_rule_description
- dbpcm_warehouse.expense.expense_status
- dbpcm_warehouse.expense.expense_paid_date
column_formats:
  Expense Rule:
    kind: text
  Approved Total:
    kind: currency
    currency: USD
    precision: 2
  Submitted Total:
    kind: currency
    currency: USD
    precision: 2
  Trimmed Total:
    kind: currency
    currency: USD
    precision: 2
presentation:
  kind: bars
  category_columns:
  - Expense Rule
  measure_columns:
  - Approved Total
