id: bp-future-hire-roster
intent: Employees with future hire dates already on the roster, pre-hires on the books whose start date is after
  today
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT employee_code AS "Employee Code",
         employee_name AS "Name",
         department_name AS "Department",
         position_title_position_info AS "Title",
         hire_date AS "Hire Date"
  FROM dbpcm_warehouse.employee
  WHERE hire_date > now()
  ORDER BY CASE
               WHEN {order_direction} = 'DESC' THEN hire_date
           END DESC, CASE
                         WHEN {order_direction} = 'ASC' THEN hire_date
                     END ASC, employee_code
slots:
- name: order_direction
  type: enum
  required: false
  enum_values:
  - DESC
  - ASC
  default: ASC
  description: Sort direction for the primary ORDER BY column. Defaults to ASC (original presentation order).
slots_summary: order_direction
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.position_title_position_info
- dbpcm_warehouse.employee.hire_date
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Title:
    kind: text
  Hire Date:
    kind: datetime
