id: bp-future-hire-roster
intent: Employees with future hire dates already on the roster, pre-hires on the books whose start date is after
  today
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |+
  SELECT
    employee_code AS "Employee Code",
    employee_name AS "Name",
    department_name AS "Department",
    position_title_position_info AS "Title",
    hire_date AS "Hire Date"
  FROM dbpcm_warehouse.employee
  WHERE
    hire_date > now()
  ORDER BY {order_by}
  LIMIT {top_n}

slots:
- name: top_n
  type: positive_integer
  required: false
  min_value: 1
  max_value: 1000
  optional_pattern: 'TRUE'
  description: Optional maximum number of output rows after aggregation and the declared ordering; omit for the
    full result. Bind only when the user requests a limited list. Returns at most N rows; does not include all tied
    ranks or change the measured population. Applies to the whole result, not per group.
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Hire Date ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Hire Date
    direction: ASC
  allowed_columns:
  - Employee Code
  - Name
  - Department
  - Title
  - Hire Date
slots_summary: top_n, order_by
uses:
- dbpcm_warehouse.employee.employee_code
- dbpcm_warehouse.employee.employee_name
- dbpcm_warehouse.employee.department_name
- dbpcm_warehouse.employee.position_title_position_info
- dbpcm_warehouse.employee.hire_date
column_formats:
  Employee Code:
    kind: identifier
  Name:
    kind: text
  Department:
    kind: text
  Title:
    kind: text
  Hire Date:
    kind: datetime
presentation:
  kind: table
