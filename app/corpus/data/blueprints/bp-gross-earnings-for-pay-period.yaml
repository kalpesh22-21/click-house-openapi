id: bp-gross-earnings-for-pay-period
intent: Gross payroll register earnings for an explicitly requested pay period ending on a specific date.
  Not the default for an unqualified year or month; use the pay-date gross earnings summary instead
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT round(SUM(amount), 2) AS "Total Gross Earnings"
  FROM dbpcm_warehouse.payroll
  WHERE register_type = 'EARN'
    AND pay_period_end_date = {period}
slots:
- name: period
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
slots_summary: period
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Total Gross Earnings:
    kind: currency
    currency: USD
presentation:
  kind: figure
  measure_columns:
  - Total Gross Earnings
