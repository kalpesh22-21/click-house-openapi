id: bp-gross-earnings-for-pay-period
intent: Gross payroll register earnings for an explicitly requested pay period ending on a specific date. Not the
  default for an unqualified year or month; use the pay-date gross earnings summary instead
status: validated
drift_status: clean
catalog_sha: ''
sql_template: |
  SELECT
    round(SUM(amount), 2) AS "Total Gross Earnings"
  FROM dbpcm_warehouse.payroll
  WHERE
    register_type = 'EARN' AND pay_period_end_date = {period}
  ORDER BY {order_by}
slots:
- name: period
  type: period
  required: true
  binds_to: dbpcm_warehouse.payroll.pay_period_end_date
  temporal_type: date
- name: order_by
  type: sort_order
  required: false
  description: Ordered list of 1 to 3 column/direction objects. Use exact allowed_columns and ASC or DESC; no duplicate
    columns. Defaults to Total Gross Earnings ASC. Applies before LIMIT; no implicit secondary sort.
  default:
  - column: Total Gross Earnings
    direction: ASC
  allowed_columns:
  - Total Gross Earnings
slots_summary: period, order_by
uses:
- dbpcm_warehouse.payroll.amount
- dbpcm_warehouse.payroll.register_type
- dbpcm_warehouse.payroll.pay_period_end_date
column_formats:
  Total Gross Earnings:
    kind: currency
    currency: USD
presentation:
  kind: figure
  measure_columns:
  - Total Gross Earnings
