# Standalone development coordinator. Source databases are configured by
# scripts/setup_trino_catalogs.py. Nothing is published or changed on MySQL.
services:
  trino:
    image: trinodb/trino:483
    ports:
      - "127.0.0.1:18081:8080"
    env_file:
      - path: docker/trino/defaults.env
      - path: .env.trino
        required: false
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "trino", "--server", "http://localhost:8080", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
