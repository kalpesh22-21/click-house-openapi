# Local end-to-end stack: ClickHouse + token issuer + the read-only API + MCP.
#
# Usage:
#   docker compose up -d --build
#
#   # 1) Mint a per-user token from the token service:
#   TOKEN=$(curl -s -X POST -H "Authorization: Bearer issuer-key-abc123" \
#       -H 'Content-Type: application/json' -d '{"user_name":"alice"}' \
#       http://localhost:19000/token | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
#
#   # 2) Call the API as that tenant (the JWT carries user_name -> SQL_tenant):
#   curl -H "Authorization: Bearer $TOKEN" http://localhost:18080/databases
#   curl -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
#       -d '{"sql":"SELECT count() FROM analytics.events"}' http://localhost:18080/query
#
#   # 3) /admin still uses the static admin API key (API_KEY), not a JWT:
#   #   curl -H "Authorization: Bearer test-key-abc123" http://localhost:18080/admin/...
#
# This is a DEV/TEST setup: ClickHouse runs over plain HTTP (8123) and the token
# service runs in TOKEN_DEV_MODE (ephemeral signing key, single replica).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch-test
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # Allow the default user to connect without a password (dev only).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro
      # Register the SQL_ custom-settings prefix so the API's SQL_tenant setting
      # is accepted (otherwise queries fail with "Unknown setting SQL_tenant").
      - ./docker/clickhouse-config/custom-settings.xml:/etc/clickhouse-server/config.d/custom-settings.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Token-issuing service (OIDC-style IdP). Mints per-user JWTs and publishes
  # JWKS that the api/mcp services validate against. Same image, MODE=token.
  token:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ch-token
    environment:
      MODE: "token"
      # iss/aud MUST match the api/mcp OIDC_ISSUER / OIDC_AUDIENCE below.
      TOKEN_ISSUER: "http://token:8000/"
      TOKEN_AUDIENCE: "clickhouse-api"
      TOKEN_TTL_SECONDS: "3600"
      # Bearer key required to call POST /token.
      TOKEN_ISSUER_API_KEY: "issuer-key-abc123"
      # Dev only: generate an ephemeral signing key (no key file needed).
      # NEVER set true with >1 replica or in production.
      TOKEN_DEV_MODE: "true"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
    ports:
      - "19000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ch-api
    depends_on:
      clickhouse:
        condition: service_healthy
      token:
        condition: service_healthy
    environment:
      MODE: "api"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "analytics"
      # Per-tenant JWT auth — validated against the token service's JWKS.
      OIDC_JWKS_URL: "http://token:8000/.well-known/jwks.json"
      OIDC_ISSUER: "http://token:8000/"
      OIDC_AUDIENCE: "clickhouse-api"
      # Static admin key for the /admin write routes only (NOT the query routes).
      API_KEY: "test-key-abc123"
      ALLOWED_DATABASES: "*"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
      PUBLIC_BASE_URL: "http://localhost:18080"
    ports:
      - "18080:8000"

  # MCP server, streamable-HTTP transport. Same image as `api`, MODE=mcp.
  # The /mcp path requires a valid OIDC JWT; /health is unauthenticated.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ch-mcp
    depends_on:
      clickhouse:
        condition: service_healthy
      token:
        condition: service_healthy
    environment:
      MODE: "mcp"
      MCP_TRANSPORT: "http"
      MCP_PORT: "8000"
      MCP_PATH: "/mcp"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "analytics"
      # Per-tenant JWT auth — validated against the token service's JWKS.
      OIDC_JWKS_URL: "http://token:8000/.well-known/jwks.json"
      OIDC_ISSUER: "http://token:8000/"
      OIDC_AUDIENCE: "clickhouse-api"
      API_KEY: "test-key-abc123"
      ALLOWED_DATABASES: "*"
      LOG_LEVEL: "INFO"
    ports:
      - "18090:8000"
