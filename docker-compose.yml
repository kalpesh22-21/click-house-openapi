# Local end-to-end stack: ClickHouse + the read-only API + MCP.
#
# Usage:
#   docker compose up -d --build
#
#   # Tokens are minted by an EXTERNAL OIDC issuer (this stack no longer bundles
#   # one). Point OIDC_JWKS_URL/OIDC_ISSUER/OIDC_AUDIENCE at your IdP below, or
#   # set OIDC_PUBLIC_KEY to a static verification key, then present the JWT:
#   curl -H "Authorization: Bearer $TOKEN" http://localhost:18080/databases
#   curl -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
#       -d '{"sql":"SELECT count() FROM analytics.events"}' http://localhost:18080/query
#
# This is a DEV/TEST setup: ClickHouse runs over plain HTTP (8123).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch-test
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # Allow the default user to connect without a password (dev only).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro
      # Register the SQL_ custom-settings prefix so the API's SQL_tenant setting
      # is accepted (otherwise queries fail with "Unknown setting SQL_tenant").
      - ./docker/clickhouse-config/custom-settings.xml:/etc/clickhouse-server/config.d/custom-settings.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ch-api
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      MODE: "api"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "analytics"
      # Per-tenant JWT auth — validated against an EXTERNAL OIDC issuer.
      # Set these to your IdP (or use OIDC_PUBLIC_KEY for a static verify key).
      # auth_configured() needs a KEY SOURCE (JWKS URL or public key) to boot;
      # forwarding OIDC_PUBLIC_KEY lets a local/integration stack run with a
      # static verify key from .env instead of a live IdP.
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_PUBLIC_KEY: "${OIDC_PUBLIC_KEY:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      ALLOWED_DATABASES: "*"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
      PUBLIC_BASE_URL: "http://localhost:18080"
    ports:
      - "18080:8000"

  # MCP server, streamable-HTTP transport. Same image as `api`, MODE=mcp.
  # The /mcp path requires a valid OIDC JWT; /health is unauthenticated.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ch-mcp
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      MODE: "mcp"
      MCP_TRANSPORT: "http"
      MCP_PORT: "8000"
      MCP_PATH: "/mcp"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: "analytics"
      # Per-tenant JWT auth — validated against an EXTERNAL OIDC issuer.
      # Forward OIDC_PUBLIC_KEY too so a local/integration stack can boot with a
      # static verify key from .env instead of a live IdP (see api service above).
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_PUBLIC_KEY: "${OIDC_PUBLIC_KEY:-}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      ALLOWED_DATABASES: "*"
      LOG_LEVEL: "INFO"
    ports:
      - "18090:8000"
